<!-- ===== Sélecteur de langue (traduction automatique) ===== -->
<div id="google_translate_element" style="display:none"></div>

<div id="lang-switcher" class="notranslate" translate="no">
  <button id="lang-btn" type="button" aria-haspopup="true" aria-expanded="false">
    <span class="lang-globe">🌐</span><span id="lang-current">FR</span><span class="lang-caret">▾</span>
  </button>
  <div id="lang-menu" role="menu">
    <a href="#" data-lang="fr" role="menuitem">Français</a>
    <a href="#" data-lang="en" role="menuitem">English</a>
    <a href="#" data-lang="es" role="menuitem">Español</a>
    <a href="#" data-lang="ar" role="menuitem" dir="rtl">العربية</a>
  </div>
</div>

<style>
/* masquer la barre et l'infobulle Google Translate */
.goog-te-banner-frame.skiptranslate,
.goog-te-gadget-icon,
#goog-gt-tt, .goog-tooltip, .goog-te-balloon-frame { display:none !important; }
body { top:0 !important; position:static !important; }
.goog-text-highlight { background:none !important; box-shadow:none !important; }

/* pastille flottante en bas à droite */
#lang-switcher{ position:fixed; right:18px; bottom:18px; z-index:2000;
  font-family:inherit; }
#lang-btn{ display:flex; align-items:center; gap:.4rem; cursor:pointer;
  padding:.5rem .8rem; border-radius:999px; border:1px solid rgba(255,255,255,.18);
  background:rgba(20,32,38,.92); color:#F5F7F8; font-size:.9rem; font-weight:600;
  box-shadow:0 4px 14px rgba(0,0,0,.35); backdrop-filter:blur(6px); }
#lang-btn:hover{ border-color:rgba(255,255,255,.4); }
.lang-globe{ font-size:1rem; } .lang-caret{ opacity:.7; font-size:.75rem; }
#lang-menu{ position:absolute; right:0; bottom:calc(100% + 8px); min-width:150px;
  background:#142026; border:1px solid rgba(255,255,255,.15); border-radius:12px;
  padding:.35rem; box-shadow:0 8px 24px rgba(0,0,0,.4); display:none; }
#lang-menu.open{ display:block; }
#lang-menu a{ display:block; padding:.5rem .7rem; border-radius:8px;
  color:#E8EEF0; text-decoration:none; font-size:.9rem; }
#lang-menu a:hover{ background:rgba(46,134,193,.25); }
#lang-menu a.active{ background:rgba(55,180,126,.25); font-weight:700; }
/* variante thème clair */
body.quarto-light #lang-btn{ background:rgba(255,255,255,.95); color:#1b2b33;
  border-color:rgba(0,0,0,.12); }
body.quarto-light #lang-menu{ background:#fff; border-color:rgba(0,0,0,.12); }
body.quarto-light #lang-menu a{ color:#1b2b33; }
</style>

<script>
function googleTranslateElementInit(){
  new google.translate.TranslateElement(
    { pageLanguage:'fr', includedLanguages:'en,es,ar', autoDisplay:false },
    'google_translate_element');
}
(function(){
  var NAMES={fr:'FR',en:'EN',es:'ES',ar:'AR'};
  function curLang(){ var m=document.cookie.match(/googtrans=\/[^\/]+\/([^;]+)/); return m?m[1]:'fr'; }
  function setCookie(v){
    var host=location.hostname;
    document.cookie='googtrans='+v+'; path=/';
    document.cookie='googtrans='+v+'; path=/; domain='+host;
    if(host.indexOf('.')>-1) document.cookie='googtrans='+v+'; path=/; domain=.'+host;
  }
  function choose(lang){
    if(lang==='fr'){ setCookie(''); document.cookie='googtrans=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT'; }
    else setCookie('/fr/'+lang);
    location.reload();
  }
  function applyDir(lang){ document.documentElement.setAttribute('dir', lang==='ar'?'rtl':'ltr'); }
  document.addEventListener('DOMContentLoaded', function(){
    // protéger maths et code de la traduction automatique
    document.querySelectorAll('.katex, code, pre, .sourceCode').forEach(function(el){
      el.classList.add('notranslate'); el.setAttribute('translate','no');
    });
    var lang=curLang(); applyDir(lang);
    var cur=document.getElementById('lang-current'); if(cur) cur.textContent=NAMES[lang]||'FR';
    var btn=document.getElementById('lang-btn'), menu=document.getElementById('lang-menu');
    menu.querySelectorAll('a').forEach(function(a){
      if(a.dataset.lang===lang) a.classList.add('active');
      a.addEventListener('click',function(e){ e.preventDefault(); choose(a.dataset.lang); });
    });
    btn.addEventListener('click',function(e){ e.stopPropagation();
      var open=menu.classList.toggle('open'); btn.setAttribute('aria-expanded',open); });
    document.addEventListener('click',function(){ menu.classList.remove('open'); });
  });
})();
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
