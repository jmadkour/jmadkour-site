          - text: "English"
            href: en/index.qmd
          - text: "Español"
            href: es/index.qmd
          - text: "العربية"
            href: ar/index.qmd
      - icon: youtube
        href: "https://youtube.com/@JaouadMadkour"
        aria-label: YouTube
