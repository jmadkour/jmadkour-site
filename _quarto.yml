project:
  type: website
  output-dir: _site
  resources:
    - "cours/statistique-descriptive/slides/"
    - "cours/probabilites/slides/"
    - "cours/statistique-inferentielle/slides/"
    - "cours/econometrie-introduction/slides/"
  render:
    - "*.qmd"
    - "cours/**/*.qmd"

website:
  title: "Statistique & économétrie"
  description: "Statistique & économétrie — un manuel vivant, interactif et gratuit."
  site-url: "https://jmadkour.github.io/jmadkour-site/"
  reader-mode: true
  search:
    location: navbar
    type: overlay
  navbar:
    background: primary
    pinned: true
    left:
      - text: "Licence"
        href: licence.qmd
      - text: "Master"
        href: master.qmd
      - text: "Doctorat"
        href: doctorat.qmd
      - text: "À propos"
        href: about.qmd
    right:
      - icon: github
        href: "https://github.com/jmadkour"
        aria-label: GitHub
  sidebar:
    - id: descriptive
      title: "Statistique descriptive"
      style: floating
      collapse-level: 2
      contents:
        - cours/statistique-descriptive/index.qmd
        - cours/statistique-descriptive/donnees-et-statistiques.qmd
        - cours/statistique-descriptive/tableaux-et-graphiques.qmd
        - cours/statistique-descriptive/methodes-numeriques.qmd
    - id: probabilites
      title: "Probabilités"
      style: floating
      collapse-level: 2
      contents:
        - cours/probabilites/index.qmd
        - cours/probabilites/theorie-probabiliste.qmd
        - cours/probabilites/distributions-discretes.qmd
        - cours/probabilites/distributions-continues.qmd
    - id: inferentielle
      title: "Statistique inférentielle"
      style: floating
      collapse-level: 2
      contents:
        - cours/statistique-inferentielle/index.qmd
        - cours/statistique-inferentielle/echantillonnage.qmd
        - cours/statistique-inferentielle/estimation-intervalle.qmd
        - cours/statistique-inferentielle/test-hypotheses.qmd
        - cours/statistique-inferentielle/comparaisons-moyennes-anova.qmd
        - cours/statistique-inferentielle/proportions-independance.qmd
    - id: econometrie
      title: "Introduction à l'économétrie"
      style: floating
      collapse-level: 2
      contents:
        - cours/econometrie-introduction/index.qmd
        - cours/econometrie-introduction/regression-lineaire-simple.qmd
        - cours/econometrie-introduction/regression-multiple.qmd
        - cours/econometrie-introduction/regression-simple.qmd
  page-footer:
    center: "© 2026 jmadkour.org · Statistique & économétrie · construit avec Quarto"
    border: true

format:
  html:
    theme:
      dark: theme-dark.scss
      light: theme-light.scss
    toc: true
    toc-title: "Sur cette page"
    html-math-method: katex
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true
    smooth-scroll: true
    include-after-body: translate.html
    grid:
      content-mode: standard

lang: fr
