project:
  type: website
  output-dir: _site
  resources:
    - CNAME
  render:
    - "*.qmd"
    - "cours/**/*.qmd"

website:
  title: "jmadkour.org"
  description: "Statistique & économétrie — un manuel vivant, interactif et gratuit."
  site-url: "https://jmadkour.org"
  favicon: assets/favicon.png
  reader-mode: true
  search:
    location: navbar
    type: overlay
  navbar:
    background: primary
    pinned: true
    left:
      - text: "Licence"
        href: licence.qmd
      - text: "Master"
        href: master.qmd
      - text: "Doctorat"
        href: doctorat.qmd
      - text: "À propos"
        href: about.qmd
    right:
      - icon: github
        href: "https://github.com/jmadkour"
        aria-label: GitHub
  sidebar:
    - id: descriptive
      title: "Statistique descriptive"
      style: floating
      collapse-level: 2
      contents:
        - cours/statistique-descriptive/index.qmd
    - id: econometrie
      title: "Introduction à l'économétrie"
      style: floating
      collapse-level: 2
      contents:
        - cours/econometrie-introduction/index.qmd
        - cours/econometrie-introduction/regression-simple.qmd
  page-footer:
    center: "© 2026 jmadkour.org · Statistique & économétrie · construit avec Quarto"
    border: true

format:
  html:
    theme:
      light: theme-light.scss
      dark: theme-dark.scss
    toc: true
    toc-title: "Sur cette page"
    html-math-method: katex
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true
    smooth-scroll: true
    grid:
      content-mode: standard

lang: fr
