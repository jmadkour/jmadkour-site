website:
  title: "Jaouad Madkour"
  description: "Jaouad Madkour — statistique, économétrie et gestion des risques financiers : un manuel vivant, interactif et gratuit."
  # Le site est servi sur jmadkour.org (voir CNAME). C'est cette adresse
  # que Quarto doit inscrire dans le sitemap et les liens canoniques :
  # avec l'ancienne adresse github.io, les moteurs indexaient un domaine
  # que le visiteur ne voit jamais, et le référencement se dispersait
  # entre deux adresses pour un même contenu.
  site-url: "https://jmadkour.org"
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  favicon: favicon.png
  reader-mode: true
  search:
    location: navbar
    type: overlay
  navbar:
    background: primary
    pinned: true
    title: false
    left:
      - text: "Jaouad Madkour"
        href: profile.qmd
      - text: "Accueil"
        href: index.qmd
