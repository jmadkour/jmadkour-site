format:
  html:
    theme:
      dark: theme-dark.scss
      light: theme-light.scss
    toc: true
    toc-title: "Sur cette page"
    html-math-method: katex
    code-copy: true
    # Mémorise le thème actif pour que les diaporamas s'y accordent.
    # Les pages qui redéfinissent include-after-body (cours d'informatique)
    # embarquent le même script à la fin de _includes/console.html.
    include-after-body: _includes/theme-sync.html
    code-overflow: wrap
    link-external-newwindow: true
    smooth-scroll: true
    grid:
      content-mode: standard

lang: fr
