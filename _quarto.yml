project:
  type: website
  output-dir: _site
  # pre-render: translate-langs.py   # TRADUCTION EN PAUSE — réactiver cette ligne à la fin
  resources:
    - "CNAME"
    - "cv/CV_Jaouad_Madkour.pdf"
    - "cours/analyse-donnees/slides/"
    - "cours/maths-gestion/slides/"
    - "cours/analyse-dynamique/slides/"
    - "cours/statistique-descriptive/slides/"
    - "cours/probabilites/slides/"
    - "cours/statistique-inferentielle/slides/"
    - "cours/econometrie-introduction/slides/"
    - "cours/analyse-mathematique/slides/"
    - "cours/algebre-lineaire/slides/"
    - "cours/econometrie-financiere/slides/"
    - "cours/econometrie-avancee/slides/"
    - "cours/modelisation-arma/slides/"
    - "cours/modelisation-garch/slides/"
    - "cours/calcul-stochastique/slides/"
    - "cours/value-at-risk/slides/"
    - "cours/fondements-gestion-risques/slides/"
    - "cours/analyse-quantitative/slides/"
    - "cours/marches-produits-financiers/slides/"
    - "cours/modeles-evaluation-risque/slides/"
    - "cours/risque-marche/slides/"
    - "cours/risque-credit/slides/"
    - "cours/risque-operationnel-resilience/slides/"
    - "cours/risque-liquidite-tresorerie/slides/"
    - "cours/gestion-risques-actifs/slides/"
  render:
    - "*.qmd"
    - "cours/**/*.qmd"
    - "en/**/*.qmd"
    - "es/**/*.qmd"
    - "ar/**/*.qmd"

# Met en cache les pages dont le code (R/Python/MATLAB) n'a pas change :
# accelere nettement `quarto preview`/`quarto render` sur un site de cette
# taille, sans jamais servir un resultat perime (auto = invalide des qu'un
# fichier source change).
execute:
  freeze: auto

website:
  title: "Jaouad Madkour"
  description: "Jaouad Madkour — statistique, économétrie et gestion des risques financiers : un manuel vivant, interactif et gratuit."
  # Le site est servi sur jmadkour.org (voir CNAME). C'est cette adresse
  # que Quarto doit inscrire dans le sitemap et les liens canoniques :
  # avec l'ancienne adresse github.io, les moteurs indexaient un domaine
  # que le visiteur ne voit jamais, et le référencement se dispersait
  # entre deux adresses pour un même contenu.
  site-url: "https://jmadkour.org"
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  favicon: favicon.png
  reader-mode: true
  search:
    location: navbar
    type: overlay
  navbar:
    background: primary
    pinned: true
    title: false
    left:
      - text: "Jaouad Madkour"
        href: profile.qmd
      - text: "Accueil"
        href: index.qmd
      - text: "Licence"
        href: licence.qmd
      - text: "Master"
        href: master.qmd
      - text: "Doctorat"
        href: doctorat.qmd
      - text: "Informatique"
        href: informatique.qmd
      - text: "Publications"
        href: recherche.qmd
      - text: "À propos"
        href: about.qmd
    right:
      - text: "🌐"
        menu:
          - text: "Français"
            href: index.qmd
          - text: "English"
            href: en/index.qmd
          - text: "Español"
            href: es/index.qmd
          - text: "العربية"
            href: ar/index.qmd
      - icon: youtube
        href: "https://youtube.com/@JaouadMadkour"
        aria-label: YouTube
        target: _blank
      - icon: instagram
        href: "https://www.instagram.com/jaouad_madkour/"
        aria-label: Instagram
        target: _blank
      - icon: github
        href: "https://github.com/jmadkour"
