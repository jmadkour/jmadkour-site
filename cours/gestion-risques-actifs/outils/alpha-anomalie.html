<!DOCTYPE html>
<html lang="fr">
<head>
<script id="jm-theme-detect">
(function () {
  var t = null;
  try { t = localStorage.getItem("jm-theme"); } catch (e) {}
  if (!t) { t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light"; }
  document.documentElement.setAttribute("data-theme", t);
  window.addEventListener("storage", function (e) {
    if (e.key === "jm-theme" && e.newValue) { document.documentElement.setAttribute("data-theme", e.newValue); }
  });
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapitre 2 — L'alpha et l'anomalie du faible risque — Calculatrice interactive</title>
<style>
  :root { --cdef: #4A3B8C; --cintu: #E08000; --cex: #2E8B57; --ceco: #1F6FB2; --cgris: #5A5A5A; }
  * { box-sizing: border-box; }
  body { font-family: Georgia, "TeX Gyre Pagella", serif; background: #FDFDFD; color: #1a1a1a; max-width: 1150px; margin: 0 auto; padding: 1.5em; }
  h1 { font-family: "Helvetica Neue", Arial, sans-serif; color: var(--cdef); font-size: 1.5em; border-bottom: 2px solid var(--cdef); padding-bottom: 0.3em; }
  .sous-titre { color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; margin-top: -0.6em; }
  .panneau { background: white; border-left: 4px solid var(--cdef); border-radius: 6px; padding: 1em 1.2em; margin: 1em 0; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .panneau h2 { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 1.05em; color: var(--cdef); margin-top: 0; }
  label { display: block; margin: 0.6em 0 0.2em; font-size: 0.85em; color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; }
  input[type=number], input[type=text] { width: 100%; padding: 0.5em; border: 1px solid #ccc; border-radius: 4px; font-family: "Courier New", monospace; font-size: 0.9em; }
  .ligne { display: flex; gap: 1em; flex-wrap: wrap; align-items: flex-start; }
  .ligne > div { flex: 1; min-width: 150px; }
  button { margin-top: 1em; margin-right: 0.5em; background: var(--cdef); color: white; border: none; padding: 0.6em 1.4em; border-radius: 5px; font-family: "Helvetica Neue", Arial, sans-serif; font-weight: bold; cursor: pointer; font-size: 0.95em; }
  button:hover { background: #372c69; }
  .erreur { color: #b00020; font-family: "Helvetica Neue", Arial, sans-serif; font-size: 0.9em; margin-top: 0.6em; }
  .resultat-zone { margin-top: 1em; font-family: "Helvetica Neue", Arial, sans-serif; }
  .aide { font-size: 0.85em; color: var(--cgris); margin-top: 0; }
  .valeur { font-size: 1.0em; padding: 0.4em 0.7em; background: var(--cdef); color: white; border-radius: 5px; display: inline-block; margin: 0.2em 0.3em 0.2em 0; }
  .valeur.ok { background: var(--cex); }
  .valeur.ko { background: #b00020; }
  .valeur.mid { background: var(--cintu); }
  table.tabres { border-collapse: collapse; margin-top: 0.7em; font-size: 0.85em; font-family: "Courier New", monospace; }
  table.tabres th, table.tabres td { border: 1px solid #ccc; padding: 0.3em 0.6em; text-align: right; }
  table.tabres th { background: #f0f0f0; font-family: "Helvetica Neue", Arial, sans-serif; }
</style>
<style id="jm-theme-override">
/* Surcharge : palette et typographie du site jmadkour.org, synchronisee
   avec son bascule clair/sombre (voir script jm-theme-detect ci-dessus). */
:root {
  --cdef: #1f6fb2; --ceco: #1f6fb2; --cex: #1d9e75; --cintu: #b56600; --cgris: #54707f;
  --bg: #ffffff; --fg: #142a38; --border: #dbe6ee; --card-bg: #f6f9fb; --code-bg: #f3f7fa;
  --danger: #b00020; --primary-dark: #17578f;
}
:root[data-theme="dark"] {
  --cdef: #3aa0e6; --ceco: #3aa0e6; --cex: #37b47e; --cintu: #e0954a; --cgris: #9db4c0;
  --bg: #0d1b26; --fg: #e7eef3; --border: #20455a; --card-bg: #13303d; --code-bg: #0f2733;
  --danger: #e0554a; --primary-dark: #5bb3ef;
}
* { box-sizing: border-box; }
html { background: var(--bg) !important; }
body {
  background: var(--bg) !important; color: var(--fg) !important;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
}
h1, h2, .panneau h2 {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  color: var(--cdef) !important; border-color: var(--cdef) !important;
}
.sous-titre, .aide, label { color: var(--cgris) !important; }
.panneau {
  background: var(--card-bg) !important; border: 1px solid var(--border) !important;
  border-left: 1px solid var(--border) !important; border-radius: 14px !important; box-shadow: none !important;
}
input[type=number], input[type=text] {
  background: var(--bg) !important; color: var(--fg) !important; border: 1px solid var(--border) !important;
}
button {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  background: var(--cdef) !important; color: #ffffff !important; border-radius: 8px !important; border: none !important;
}
button:hover { background: var(--primary-dark) !important; }
.erreur { color: var(--danger) !important; }
.valeur { background: var(--cdef) !important; color: #ffffff !important; }
.valeur.ok { background: var(--cex) !important; }
.valeur.ko { background: var(--danger) !important; }
.valeur.mid { background: var(--cintu) !important; }
table.tabres th, table.tabres td { border-color: var(--border) !important; color: var(--fg) !important; }
table.tabres th { background: var(--code-bg) !important; }
</style>
</head>
<body>

<h1>Chapitre 2 — Application : alpha et anomalie du faible risque</h1>
<p class="sous-titre">Calculatrice interactive — la loi fondamentale de Grinold (exercice 5), l'alpha de Buffett, MEDAF contre Fama-French (exercice 6)</p>

<div class="panneau">
  <h2>La loi fondamentale de la gestion active (Grinold)</h2>
  <div class="ligne">
    <div><label for="c2_IC">Coefficient d'information IC</label><input type="number" id="c2_IC" value="0.05" step="0.01"></div>
    <div><label for="c2_BR1">Nombre de paris — approche 1</label><input type="number" id="c2_BR1" value="20" step="5"></div>
    <div><label for="c2_BR2">Nombre de paris — approche 2</label><input type="number" id="c2_BR2" value="200" step="10"></div>
  </div>
  <div class="ligne">
    <div><label for="c2_IRcible">Ratio d'information cible</label><input type="number" id="c2_IRcible" value="1.0" step="0.1"></div>
    <div><label for="c2_ICdouble">IC doublé (pour comparaison)</label><input type="number" id="c2_ICdouble" value="0.10" step="0.01"></div>
  </div>
  <button onclick="calculerGrinold()">Calculer</button>
  <div id="resultatGrinold" class="resultat-zone"></div>
</div>

<div class="panneau">
  <h2>L'alpha de Buffett : MEDAF contre Fama-French</h2>
  <div class="ligne">
    <div><label for="c2b_alphaCAPM">Alpha mensuel MEDAF (%)</label><input type="number" id="c2b_alphaCAPM" value="0.72" step="0.01"></div>
    <div><label for="c2b_alphaFF3">Alpha mensuel Fama-French (%)</label><input type="number" id="c2b_alphaFF3" value="0.65" step="0.01"></div>
  </div>
  <div class="ligne">
    <div><label for="c2b_R2CAPM">R² MEDAF (%)</label><input type="number" id="c2b_R2CAPM" value="14" step="1"></div>
    <div><label for="c2b_R2FF3">R² Fama-French (%)</label><input type="number" id="c2b_R2FF3" value="27" step="1"></div>
  </div>
  <button onclick="calculerBuffett()">Calculer</button>
  <div id="resultatBuffett" class="resultat-zone"></div>
</div>

<script>
function calculerGrinold() {
  var resDiv = document.getElementById('resultatGrinold');
  var IC = parseFloat(document.getElementById('c2_IC').value);
  var BR1 = parseFloat(document.getElementById('c2_BR1').value);
  var BR2 = parseFloat(document.getElementById('c2_BR2').value);
  var IRcible = parseFloat(document.getElementById('c2_IRcible').value);
  var ICdouble = parseFloat(document.getElementById('c2_ICdouble').value);

  if ([IC, BR1, BR2, IRcible, ICdouble].some(isNaN) || IC <= 0 || BR1 < 0 || BR2 < 0) {
    resDiv.innerHTML = '<p class="erreur">Valeurs invalides.</p>';
    return;
  }

  var IR1 = IC * Math.sqrt(BR1);
  var IR2 = IC * Math.sqrt(BR2);
  var BRnecessaire = Math.pow(IRcible / IC, 2);
  var IR3 = ICdouble * Math.sqrt(BR1);

  var html = '';
  html += '<table class="tabres">';
  html += '<tr><th>IR (IC=' + IC.toFixed(2) + ', BR=' + BR1.toFixed(0) + ')</th><td>' + IR1.toFixed(4) + '</td></tr>';
  html += '<tr><th>IR (IC=' + IC.toFixed(2) + ', BR=' + BR2.toFixed(0) + ')</th><td>' + IR2.toFixed(4) + '</td></tr>';
  html += '</table>';
  html += '<div class="valeur mid">BR nécessaire pour IR=' + IRcible.toFixed(2) + ' (à IC=' + IC.toFixed(2) + ') = ' + Math.round(BRnecessaire) + '</div>';
  html += '<div class="valeur">IR (IC=' + ICdouble.toFixed(2) + ', BR=' + BR1.toFixed(0) + ') = ' + IR3.toFixed(4) + '</div>';
  var comparaison = IR3 < IR2 ? 'multiplier BR par ' + (BR2 / BR1).toFixed(1) + ' l\'emporte sur doubler IC' : 'doubler IC l\'emporte sur multiplier BR par ' + (BR2 / BR1).toFixed(1);
  html += '<div class="valeur ' + (IR3 < IR2 ? 'ok' : 'ko') + '">' + comparaison + '</div>';
  resDiv.innerHTML = html;
}

function calculerBuffett() {
  var resDiv = document.getElementById('resultatBuffett');
  var alphaCAPM = parseFloat(document.getElementById('c2b_alphaCAPM').value) / 100;
  var alphaFF3 = parseFloat(document.getElementById('c2b_alphaFF3').value) / 100;
  var R2CAPM = parseFloat(document.getElementById('c2b_R2CAPM').value);
  var R2FF3 = parseFloat(document.getElementById('c2b_R2FF3').value);

  if ([alphaCAPM, alphaFF3, R2CAPM, R2FF3].some(isNaN)) {
    resDiv.innerHTML = '<p class="erreur">Valeurs invalides.</p>';
    return;
  }

  var alphaAnnCAPM = alphaCAPM * 12;
  var alphaAnnFF3 = alphaFF3 * 12;
  var baisseAlpha = alphaAnnCAPM !== 0 ? (alphaAnnCAPM - alphaAnnFF3) / alphaAnnCAPM : NaN;
  var hausseR2 = R2FF3 - R2CAPM;

  var html = '';
  html += '<table class="tabres">';
  html += '<tr><th>alpha annualisé MEDAF</th><td>' + (alphaAnnCAPM * 100).toFixed(2) + '%</td></tr>';
  html += '<tr><th>alpha annualisé Fama-French</th><td>' + (alphaAnnFF3 * 100).toFixed(2) + '%</td></tr>';
  html += '</table>';
  html += '<div class="valeur mid">baisse de l\'alpha = ' + (baisseAlpha * 100).toFixed(2) + '%</div>';
  html += '<div class="valeur">hausse du R² = ' + hausseR2.toFixed(1) + ' points (' + R2CAPM.toFixed(0) + '% → ' + R2FF3.toFixed(0) + '%)</div>';
  resDiv.innerHTML = html;
}

window.onload = function () { calculerGrinold(); calculerBuffett(); };
</script>
</body>
</html>
