<!DOCTYPE html>
<html lang="fr">
<head>
<script id="jm-theme-detect">
(function () {
  var t = null;
  try { t = localStorage.getItem("jm-theme"); } catch (e) {}
  if (!t) { t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light"; }
  document.documentElement.setAttribute("data-theme", t);
  window.addEventListener("storage", function (e) {
    if (e.key === "jm-theme" && e.newValue) { document.documentElement.setAttribute("data-theme", e.newValue); }
  });
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapitre 9 — La diligence raisonnable — Calculatrice interactive</title>
<style>
  :root { --cdef: #4A3B8C; --cintu: #E08000; --cex: #2E8B57; --ceco: #1F6FB2; --cgris: #5A5A5A; }
  * { box-sizing: border-box; }
  body { font-family: Georgia, "TeX Gyre Pagella", serif; background: #FDFDFD; color: #1a1a1a; max-width: 1150px; margin: 0 auto; padding: 1.5em; }
  h1 { font-family: "Helvetica Neue", Arial, sans-serif; color: var(--cdef); font-size: 1.5em; border-bottom: 2px solid var(--cdef); padding-bottom: 0.3em; }
  .sous-titre { color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; margin-top: -0.6em; }
  .panneau { background: white; border-left: 4px solid var(--cdef); border-radius: 6px; padding: 1em 1.2em; margin: 1em 0; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .panneau h2 { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 1.05em; color: var(--cdef); margin-top: 0; }
  label { display: block; margin: 0.6em 0 0.2em; font-size: 0.85em; color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; }
  input[type=number], input[type=text] { width: 100%; padding: 0.5em; border: 1px solid #ccc; border-radius: 4px; font-family: "Courier New", monospace; font-size: 0.9em; }
  .ligne { display: flex; gap: 1em; flex-wrap: wrap; align-items: flex-start; }
  .ligne > div { flex: 1; min-width: 150px; }
  button { margin-top: 1em; margin-right: 0.5em; background: var(--cdef); color: white; border: none; padding: 0.6em 1.4em; border-radius: 5px; font-family: "Helvetica Neue", Arial, sans-serif; font-weight: bold; cursor: pointer; font-size: 0.95em; }
  button:hover { background: #372c69; }
  .erreur { color: #b00020; font-family: "Helvetica Neue", Arial, sans-serif; font-size: 0.9em; margin-top: 0.6em; }
  .resultat-zone { margin-top: 1em; font-family: "Helvetica Neue", Arial, sans-serif; }
  .aide { font-size: 0.85em; color: var(--cgris); margin-top: 0; }
  .valeur { font-size: 1.0em; padding: 0.4em 0.7em; background: var(--cdef); color: white; border-radius: 5px; display: inline-block; margin: 0.2em 0.3em 0.2em 0; }
  .valeur.ok { background: var(--cex); }
  .valeur.ko { background: #b00020; }
  .valeur.mid { background: var(--cintu); }
  table.tabres { border-collapse: collapse; margin-top: 0.7em; font-size: 0.85em; font-family: "Courier New", monospace; }
  table.tabres th, table.tabres td { border: 1px solid #ccc; padding: 0.3em 0.6em; text-align: right; }
  table.tabres th { background: #f0f0f0; font-family: "Helvetica Neue", Arial, sans-serif; }
  svg.graphique { background: white; border: 1px solid #e0e0e0; border-radius: 6px; margin-top: 0.8em; }
</style>
<style id="jm-theme-override">
/* Surcharge : palette et typographie du site jmadkour.org, synchronisee
   avec son bascule clair/sombre (voir script jm-theme-detect ci-dessus). */
:root {
  --cdef: #1f6fb2; --ceco: #1f6fb2; --cex: #1d9e75; --cintu: #b56600; --cgris: #54707f;
  --bg: #ffffff; --fg: #142a38; --border: #dbe6ee; --card-bg: #f6f9fb; --code-bg: #f3f7fa;
  --danger: #b00020; --primary-dark: #17578f;
}
:root[data-theme="dark"] {
  --cdef: #3aa0e6; --ceco: #3aa0e6; --cex: #37b47e; --cintu: #e0954a; --cgris: #9db4c0;
  --bg: #0d1b26; --fg: #e7eef3; --border: #20455a; --card-bg: #13303d; --code-bg: #0f2733;
  --danger: #e0554a; --primary-dark: #5bb3ef;
}
* { box-sizing: border-box; }
html { background: var(--bg) !important; }
body {
  background: var(--bg) !important; color: var(--fg) !important;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
}
h1, h2, .panneau h2 {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  color: var(--cdef) !important; border-color: var(--cdef) !important;
}
.sous-titre, .aide, label { color: var(--cgris) !important; }
.panneau {
  background: var(--card-bg) !important; border: 1px solid var(--border) !important;
  border-left: 1px solid var(--border) !important; border-radius: 14px !important; box-shadow: none !important;
}
input[type=number], input[type=text] {
  background: var(--bg) !important; color: var(--fg) !important; border: 1px solid var(--border) !important;
}
button {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  background: var(--cdef) !important; color: #ffffff !important; border-radius: 8px !important; border: none !important;
}
button:hover { background: var(--primary-dark) !important; }
.erreur { color: var(--danger) !important; }
.valeur { background: var(--cdef) !important; color: #ffffff !important; }
.valeur.ok { background: var(--cex) !important; }
.valeur.ko { background: var(--danger) !important; }
.valeur.mid { background: var(--cintu) !important; }
table.tabres th, table.tabres td { border-color: var(--border) !important; color: var(--fg) !important; }
table.tabres th { background: var(--code-bg) !important; }
svg.graphique { background: var(--card-bg) !important; border-color: var(--border) !important; }
</style>
</head>
<body>

<h1>Chapitre 9 — Application : la diligence raisonnable</h1>
<p class="sous-titre">Calculatrice interactive — zones de viabilité économique (exercice 5), diversification du risque de contrepartie (exercice 6)</p>

<div class="panneau">
  <h2>Zone de viabilité économique d'une société de gestion</h2>
  <div class="ligne">
    <div><label for="c9_aum">Actifs sous gestion (M$)</label><input type="number" id="c9_aum" value="200" step="10"></div>
    <div><label for="c9_fg">Commission de gestion (%)</label><input type="number" id="c9_fg" value="2" step="0.1"></div>
    <div><label for="c9_fp">Commission de performance (%)</label><input type="number" id="c9_fp" value="20" step="1"></div>
    <div><label for="c9_charges">Charges fixes annuelles (M$)</label><input type="number" id="c9_charges" value="6" step="0.5"></div>
  </div>
  <button onclick="calculerZone()">Calculer</button>
  <div id="resultatZone" class="resultat-zone"></div>
</div>

<div class="panneau">
  <h2>Diversification du risque de contrepartie</h2>
  <div class="ligne">
    <div><label for="c9b_cash">Cash total (M$)</label><input type="number" id="c9b_cash" value="300" step="10"></div>
    <div><label for="c9b_p">Probabilité de défaut par courtier (%)</label><input type="number" id="c9b_p" value="2" step="0.1"></div>
    <div><label for="c9b_recouvrement">Taux de recouvrement (%)</label><input type="number" id="c9b_recouvrement" value="35" step="1"></div>
    <div><label for="c9b_n">Nombre de courtiers</label><input type="number" id="c9b_n" value="3" step="1" min="1"></div>
  </div>
  <button onclick="calculerContrepartie()">Calculer</button>
  <div id="resultatContrepartie" class="resultat-zone"></div>
</div>

<script>
function calculerZone() {
  var resDiv = document.getElementById('resultatZone');
  var aum = parseFloat(document.getElementById('c9_aum').value);
  var fg = parseFloat(document.getElementById('c9_fg').value) / 100;
  var fp = parseFloat(document.getElementById('c9_fp').value) / 100;
  var charges = parseFloat(document.getElementById('c9_charges').value);

  if ([aum, fg, fp, charges].some(isNaN) || aum <= 0 || fg < 0 || fp <= 0 || charges < 0) {
    resDiv.innerHTML = '<p class="erreur">Valeurs invalides.</p>';
    return;
  }

  var revenuGestion = aum * fg;
  var ecart = charges - revenuGestion;
  var zone, perfM = 0, perfPct = 0;
  if (ecart <= 0) {
    zone = 'verte';
  } else {
    perfM = ecart / fp;
    perfPct = perfM / aum;
    zone = perfPct <= 0.06 ? 'jaune' : 'rouge';
  }

  var couleurZone = { verte: 'ok', jaune: 'mid', rouge: 'ko' }[zone];

  var html = '';
  html += '<table class="tabres">';
  html += '<tr><th>revenu commission de gestion</th><td>' + revenuGestion.toFixed(2) + ' M$</td></tr>';
  html += '<tr><th>écart (charges - revenu gestion)</th><td>' + ecart.toFixed(2) + ' M$</td></tr>';
  html += '</table>';
  if (ecart > 0) {
    html += '<table class="tabres">';
    html += '<tr><th>gain nécessaire pour combler l\'écart</th><td>' + perfM.toFixed(2) + ' M$</td></tr>';
    html += '<tr><th>performance nécessaire (% AUM)</th><td>' + (perfPct * 100).toFixed(2) + '%</td></tr>';
    html += '</table>';
  }
  html += '<div class="valeur ' + couleurZone + '">zone ' + zone + (zone === 'verte' ? ' (autofinancé même à performance nulle)' : '') + '</div>';

  resDiv.innerHTML = html;
}

function calculerContrepartie() {
  var resDiv = document.getElementById('resultatContrepartie');
  var cashTotal = parseFloat(document.getElementById('c9b_cash').value);
  var p = parseFloat(document.getElementById('c9b_p').value) / 100;
  var recouvrement = parseFloat(document.getElementById('c9b_recouvrement').value) / 100;
  var n = parseInt(document.getElementById('c9b_n').value, 10);

  if ([cashTotal, p, recouvrement, n].some(isNaN) || cashTotal <= 0 || p < 0 || p > 1 || recouvrement < 0 || recouvrement > 1 || n < 1) {
    resDiv.innerHTML = '<p class="erreur">Valeurs invalides.</p>';
    return;
  }

  var perteEnCasDefaut = 1 - recouvrement;
  var perteAttendue = p * perteEnCasDefaut * cashTotal;
  var cashParCourtier = cashTotal / n;
  var perteParDefaut = perteEnCasDefaut * cashParCourtier;
  var seuil = 0.5 * cashTotal;
  var nDefautsNecessaires = Math.min(n, Math.ceil(seuil / perteParDefaut));
  var probCatastrophe = Math.pow(p, nDefautsNecessaires);
  var probAuMoinsUn = 1 - Math.pow(1 - p, n);

  var html = '';
  html += '<table class="tabres">';
  html += '<tr><th>perte attendue (espérance)</th><td>' + perteAttendue.toFixed(3) + ' M$</td></tr>';
  html += '<tr><th>perte par défaut individuel</th><td>' + perteParDefaut.toFixed(2) + ' M$</td></tr>';
  html += '<tr><th>défauts simultanés requis pour ≥ 50% de perte</th><td>' + nDefautsNecessaires + ' / ' + n + '</td></tr>';
  html += '</table>';
  html += '<div class="valeur ko">P(perte ≥ 50%) = ' + (probCatastrophe * 100).toFixed(6) + '%</div>';
  html += '<div class="valeur mid">P(au moins 1 défaut parmi les ' + n + ') = ' + (probAuMoinsUn * 100).toFixed(4) + '%</div>';

  html += dessinerComparaisonRisque(p, probCatastrophe, probAuMoinsUn);

  resDiv.innerHTML = html;
}

function dessinerComparaisonRisque(p, probCatastrophe, probAuMoinsUn) {
  var largeur = 340, hauteur = 220, marge = 45;
  var valeurs = [p, probCatastrophe, probAuMoinsUn];
  var libelles = ['1 courtier', 'catastrophe (N courtiers)', 'au moins 1 défaut (N)'];
  var maxVal = Math.max.apply(null, valeurs.concat([0.0001])) * 1.2;
  var largeurBarre = 55;
  var espace = (largeur - 2 * marge) / libelles.length;
  var yAxe = hauteur - marge;

  var svg = '<svg class="graphique" viewBox="0 0 ' + largeur + ' ' + hauteur + '" width="100%" height="240">';
  svg += '<line x1="' + marge + '" y1="' + yAxe + '" x2="' + (largeur - 10) + '" y2="' + yAxe + '" stroke="#888" stroke-width="1"/>';
  var couleurs = ['var(--cintu, #E08000)', 'var(--cex, #2E8B57)', 'var(--ceco, #1F6FB2)'];
  for (var i = 0; i < libelles.length; i++) {
    var x = marge + i * espace + (espace - largeurBarre) / 2;
    var hBrute = (valeurs[i] / maxVal) * (hauteur - 2 * marge);
    var h = Math.max(hBrute, valeurs[i] > 0 ? 1 : 0);
    var y = yAxe - h;
    svg += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + largeurBarre + '" height="' + h.toFixed(1) + '" fill="' + couleurs[i] + '" opacity="0.85"/>';
    svg += '<text x="' + (x + largeurBarre / 2).toFixed(1) + '" y="' + (y - 6).toFixed(1) + '" font-size="9" text-anchor="middle" fill="currentColor">' + (valeurs[i] * 100).toFixed(valeurs[i] < 0.001 ? 4 : 2) + '%</text>';
    svg += '<text x="' + (x + largeurBarre / 2).toFixed(1) + '" y="' + (yAxe + 12) + '" font-size="8" text-anchor="middle" fill="currentColor">' + libelles[i] + '</text>';
  }
  svg += '</svg>';
  return svg;
}

window.onload = function () { calculerZone(); calculerContrepartie(); };
</script>
</body>
</html>
