<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Introduction — Pourquoi l'espace compte — Outils interactifs</title>
<style>
  :root { --cdef: #4A3B8C; --cintu: #E08000; --cex: #2E8B57; --ceco: #1F6FB2; --cgris: #5A5A5A; }
  * { box-sizing: border-box; }
  body { font-family: Georgia, "TeX Gyre Pagella", serif; background: #FDFDFD; color: #1a1a1a; max-width: 1150px; margin: 0 auto; padding: 1.5em; }
  h1 { font-family: "Helvetica Neue", Arial, sans-serif; color: var(--cdef); font-size: 1.5em; border-bottom: 2px solid var(--cdef); padding-bottom: 0.3em; }
  .sous-titre { color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; margin-top: -0.6em; }
  .panneau { background: white; border-left: 4px solid var(--cdef); border-radius: 6px; padding: 1em 1.2em; margin: 1em 0; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .panneau h2 { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 1.05em; color: var(--cdef); margin-top: 0; }
  label { display: block; margin: 0.6em 0 0.2em; font-size: 0.92em; color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; }
  select, textarea { width: 100%; padding: 0.5em; border: 1px solid #ccc; border-radius: 4px; font-family: "Courier New", monospace; font-size: 0.9em; }
  .ligne { display: flex; gap: 1em; flex-wrap: wrap; align-items: flex-start; }
  .ligne > div { flex: 1; min-width: 220px; }
  button { margin-top: 1em; background: var(--cdef); color: white; border: none; padding: 0.6em 1.4em; border-radius: 5px; font-family: "Helvetica Neue", Arial, sans-serif; font-weight: bold; cursor: pointer; font-size: 0.95em; }
  button:hover { background: #3a2d70; }
  .resultat-zone { margin-top: 1em; font-family: "Helvetica Neue", Arial, sans-serif; }
  .ok { color: var(--cex); font-weight: bold; }
  .alerte { color: #b00020; font-weight: bold; }
  .valeur { font-size: 1.02em; padding: 0.5em 0.8em; background: var(--cdef); color: white; border-radius: 5px; display: inline-block; margin-top: 0.4em; margin-right:0.5em; }
</style>
</head>
<body>

<h1>Introduction — Pourquoi l'espace compte en économétrie</h1>
<p class="sous-titre">Outil interactif — diagnostic : où loge la dépendance spatiale, et quelle en est la conséquence ?</p>

<div class="panneau">
  <h2>Diagnostic de dépendance spatiale</h2>
  <div class="ligne">
    <div>
      <label for="mecanisme">Le mécanisme décrit est-il...</label>
      <select id="mecanisme">
        <option value="substantielle">une véritable rétroaction entre unités (dépendance substantielle)</option>
        <option value="nuisible">une variable omise, elle-même corrélée dans l'espace (corrélation nuisible)</option>
      </select>
    </div>
    <div>
      <label for="logement">Si le mécanisme est substantiel, où loge-t-il ?</label>
      <select id="logement">
        <option value="y">dans y lui-même (effet de rétroaction sur la variable dépendante)</option>
        <option value="erreur">dans le terme d'erreur seulement</option>
      </select>
    </div>
  </div>
  <button onclick="diagnostiquer()">Évaluer</button>
  <div id="resultatDiag" class="resultat-zone"></div>
</div>

<script>
function diagnostiquer() {
  const resDiv = document.getElementById('resultatDiag');
  const mecanisme = document.getElementById('mecanisme').value;
  const logement = document.getElementById('logement').value;
  let out = '';

  if (mecanisme === 'nuisible') {
    out += '<div class="valeur">Corrélation nuisible</div>';
    out += '<p>Aucun mécanisme ne relie directement les unités : une variable omise, elle-même corrélée dans l\'espace, produit l\'apparence d\'un lien. Une politique ciblée sur une seule unité pilote, en espérant un effet de contagion, serait <span class="alerte">inefficace</span> : rien ne se propage réellement.</p>';
  } else if (logement === 'y') {
    out += '<div class="valeur">Dépendance substantielle, logée dans y</div>';
    out += '<p class="alerte">MCO biaisés et non convergents.</p><p>Modèle concerné : <strong>SAR</strong> (chapitre 3) — le décalage spatial de y doit figurer explicitement au membre de droite.</p>';
  } else {
    out += '<div class="valeur">Dépendance substantielle, logée dans l\'erreur</div>';
    out += '<p class="ok">MCO non biaisés, mais inefficaces — écarts-types faux.</p><p>Modèle concerné : <strong>SEM</strong> (chapitre 4) — la corrélation spatiale doit être modélisée directement dans le terme d\'erreur.</p>';
  }
  resDiv.innerHTML = out;
}

window.onload = diagnostiquer;
</script>
</body>
</html>
