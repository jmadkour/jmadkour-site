<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapitre 4 — Le modèle SEM — SAR contre SEM</title>
<style>
  :root { --cdef: #4A3B8C; --cintu: #E08000; --cex: #2E8B57; --ceco: #1F6FB2; --cgris: #5A5A5A; }
  * { box-sizing: border-box; }
  body { font-family: Georgia, "TeX Gyre Pagella", serif; background: #FDFDFD; color: #1a1a1a; max-width: 1150px; margin: 0 auto; padding: 1.5em; }
  h1 { font-family: "Helvetica Neue", Arial, sans-serif; color: var(--cdef); font-size: 1.5em; border-bottom: 2px solid var(--cdef); padding-bottom: 0.3em; }
  .sous-titre { color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; margin-top: -0.6em; }
  .panneau { background: white; border-left: 4px solid var(--cdef); border-radius: 6px; padding: 1em 1.2em; margin: 1em 0; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .panneau h2 { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 1.05em; color: var(--cdef); margin-top: 0; }
  label { display: block; margin: 0.6em 0 0.2em; font-size: 0.92em; color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; }
  select, input[type=number] { width: 100%; padding: 0.5em; border: 1px solid #ccc; border-radius: 4px; font-family: "Courier New", monospace; font-size: 0.9em; }
  .ligne { display: flex; gap: 1em; flex-wrap: wrap; align-items: flex-start; }
  .ligne > div { flex: 1; min-width: 220px; }
  button { margin-top: 1em; background: var(--cdef); color: white; border: none; padding: 0.6em 1.4em; border-radius: 5px; font-family: "Helvetica Neue", Arial, sans-serif; font-weight: bold; cursor: pointer; font-size: 0.95em; }
  button:hover { background: #3a2d70; }
  .resultat-zone { margin-top: 1em; font-family: "Helvetica Neue", Arial, sans-serif; }
  .valeur { font-size: 1.02em; padding: 0.4em 0.7em; background: var(--cdef); color: white; border-radius: 5px; display: inline-block; margin: 0.2em 0.3em 0.2em 0; }
  table.res { border-collapse: collapse; font-family: "Helvetica Neue", Arial, sans-serif; font-size: 0.9em; margin-top: 0.8em; width: 100%; }
  table.res th, table.res td { border: 1px solid #ccc; padding: 0.5em 0.7em; text-align: left; }
  table.res th { background: var(--cdef); color: white; }
</style>
</head>
<body>

<h1>Chapitre 4 — Le modèle à erreurs spatiales (SEM)</h1>
<p class="sous-titre">Outil interactif — comparer les conséquences d'un choc sur $X$ selon la spécification retenue</p>

<div class="panneau">
  <h2>SAR contre SEM : où se propage un choc sur $X$ ?</h2>
  <div class="ligne">
    <div>
      <label for="specification">Spécification retenue</label>
      <select id="specification">
        <option value="sar">SAR (dépendance dans y)</option>
        <option value="sem">SEM (dépendance dans l'erreur)</option>
      </select>
    </div>
    <div>
      <label for="parametre">Paramètre de dépendance (ρ ou λ)</label>
      <input type="number" id="parametre" value="0.3" step="0.01" min="-0.99" max="0.99">
    </div>
    <div>
      <label for="effetDirect">Effet direct exact sur la région voisine (SAR uniquement, calculé au chapitre 3)</label>
      <input type="number" id="effetDirect" value="0.1299" step="0.0001">
    </div>
  </div>
  <button onclick="comparer()">Comparer</button>
  <div id="resultatComp" class="resultat-zone"></div>
</div>

<script>
function comparer() {
  const resDiv = document.getElementById('resultatComp');
  const spec = document.getElementById('specification').value;
  const param = parseFloat(document.getElementById('parametre').value);
  const effetSAR = parseFloat(document.getElementById('effetDirect').value);
  if (isNaN(param)) { resDiv.innerHTML = '<p>Valeur invalide.</p>'; return; }

  let out = '<table class="res"><tr><th></th><th>Effet de X_C sur y_C</th><th>Effet de X_C sur y_A (voisine)</th><th>Interprétation de β</th></tr>';
  if (spec === 'sar') {
    out += `<tr><td><strong>SAR (ρ = ${param})</strong></td><td>1 + effets de retour</td><td>${effetSAR.toFixed(4)} (calculé via le multiplicateur (I−ρW)⁻¹)</td><td>β seul ne suffit plus : il faut le multiplicateur spatial (chapitre 6)</td></tr>`;
  } else {
    out += `<tr><td><strong>SEM (λ = ${param})</strong></td><td>1 (effet direct usuel)</td><td>0 (aucune propagation de X vers les voisines)</td><td>β s'interprète normalement, comme en MCO ordinaire</td></tr>`;
  }
  out += '</table>';
  out += `<p>Le paramètre de dépendance vaut ${param} dans les deux cas, mais seul le SAR propage l'effet de $X$ aux régions voisines : $\\lambda$ ne gouverne, dans le SEM, que la corrélation entre erreurs.</p>`;
  resDiv.innerHTML = out;
}

window.onload = comparer;
</script>
</body>
</html>
