<!DOCTYPE html>
<html lang="fr">
<head>
<script id="jm-theme-detect">
(function () {
  var t = null;
  try { t = localStorage.getItem("jm-theme"); } catch (e) {}
  if (!t) { t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light"; }
  document.documentElement.setAttribute("data-theme", t);
  window.addEventListener("storage", function (e) {
    if (e.key === "jm-theme" && e.newValue) { document.documentElement.setAttribute("data-theme", e.newValue); }
  });
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapitre 6 — Effets directs, indirects et totaux — Calculatrice interactive</title>
<style>
  :root { --cdef: #1F6FB2; --cintu: #B56600; --cex: #1D9E75; --ceco: #1F6FB2; --cgris: #5A5A5A; }
  * { box-sizing: border-box; }
  body { font-family: Georgia, "TeX Gyre Pagella", serif; background: #FDFDFD; color: #1a1a1a; max-width: 1150px; margin: 0 auto; padding: 1.5em; }
  h1 { font-family: "Helvetica Neue", Arial, sans-serif; color: var(--cdef); font-size: 1.5em; border-bottom: 2px solid var(--cdef); padding-bottom: 0.3em; }
  .sous-titre { color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; margin-top: -0.6em; }
  .panneau { background: white; border-left: 4px solid var(--cdef); border-radius: 6px; padding: 1em 1.2em; margin: 1em 0; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .panneau h2 { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 1.05em; color: var(--cdef); margin-top: 0; }
  label { display: block; margin: 0.6em 0 0.2em; font-size: 0.92em; color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; }
  input[type=number], textarea, select { width: 100%; padding: 0.5em; border: 1px solid #ccc; border-radius: 4px; font-family: "Courier New", monospace; font-size: 0.9em; }
  .ligne { display: flex; gap: 1em; flex-wrap: wrap; align-items: flex-start; }
  .ligne > div { flex: 1; min-width: 200px; }
  button { margin-top: 1em; background: var(--cdef); color: white; border: none; padding: 0.6em 1.4em; border-radius: 5px; font-family: "Helvetica Neue", Arial, sans-serif; font-weight: bold; cursor: pointer; font-size: 0.95em; }
  button:hover { background: #17578f; }
  .erreur { color: #b00020; font-family: "Helvetica Neue", Arial, sans-serif; font-size: 0.9em; margin-top: 0.6em; }
  .resultat-zone { margin-top: 1em; font-family: "Helvetica Neue", Arial, sans-serif; }
  .valeur { font-size: 1.02em; padding: 0.4em 0.7em; background: var(--cdef); color: white; border-radius: 5px; display: inline-block; margin: 0.2em 0.3em 0.2em 0; }
  .aide { font-size: 0.85em; color: var(--cgris); margin-top: 0; }
</style>
<style id="jm-theme-override">
/* Surcharge : palette et typographie du site jmadkour.org, synchronisee
   avec son bascule clair/sombre (voir script jm-theme-detect ci-dessus).
   Remplace la palette "polycopie" (violet, serif) utilisee par defaut
   dans le bloc <style> d'origine de cette page. */
:root {
  --cdef: #1f6fb2; --ceco: #1f6fb2; --cex: #1d9e75; --cintu: #b56600; --cgris: #54707f;
  --bg: #ffffff; --fg: #142a38; --border: #dbe6ee; --card-bg: #f6f9fb; --code-bg: #f3f7fa;
  --danger: #b00020; --primary-dark: #17578f;
}
:root[data-theme="dark"] {
  --cdef: #3aa0e6; --ceco: #3aa0e6; --cex: #37b47e; --cintu: #e0954a; --cgris: #9db4c0;
  --bg: #0d1b26; --fg: #e7eef3; --border: #20455a; --card-bg: #13303d; --code-bg: #0f2733;
  --danger: #e0554a; --primary-dark: #5bb3ef;
}
* { box-sizing: border-box; }
html { background: var(--bg) !important; }
body {
  background: var(--bg) !important; color: var(--fg) !important;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
}
h1, h2, h3, .panneau h2 {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  color: var(--cdef) !important; border-color: var(--cdef) !important;
}
.sous-titre, .aide, label { color: var(--cgris) !important; }
.panneau {
  background: var(--card-bg) !important; border: 1px solid var(--border) !important;
  border-left: 1px solid var(--border) !important; border-radius: 14px !important; box-shadow: none !important;
}
input[type=number], input[type=text], select, textarea {
  background: var(--bg) !important; color: var(--fg) !important; border: 1px solid var(--border) !important;
}
button {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  background: var(--cdef) !important; color: #ffffff !important; border-radius: 8px !important; border: none !important;
}
button:hover { background: var(--primary-dark) !important; }
.erreur { color: var(--danger) !important; }
table.res, table.res th, table.res td { border-color: var(--border) !important; }
table.res th { background: var(--card-bg) !important; }
.valeur { background: var(--cdef) !important; color: #ffffff !important; }
.valeur.ok { background: var(--cex) !important; }
.valeur.ko { background: var(--danger) !important; }
</style>
</head>
<body>

<h1>Chapitre 6 — Effets directs, indirects et totaux</h1>
<p class="sous-titre">Calculatrice interactive — SAR, SDM et SLX, sur une matrice W standardisée en ligne</p>

<div class="panneau">
  <h2>Effets direct / indirect / total</h2>
  <div class="ligne">
    <div>
      <label for="specification">Spécification</label>
      <select id="specification">
        <option value="sar">SAR (y = ρWy + Xβ + ε)</option>
        <option value="slx">SLX (y = Xβ + WXθ + ε)</option>
      </select>
    </div>
    <div><label for="rho">ρ (SAR uniquement)</label><input type="number" id="rho" value="0.3" step="0.01" min="-0.99" max="0.99"></div>
    <div><label for="beta">β_k</label><input type="number" id="beta" value="2" step="0.01"></div>
    <div><label for="theta">θ_k (SLX uniquement)</label><input type="number" id="theta" value="0.5" step="0.01"></div>
    <div><label for="voisins">Nombre de voisins par unité (W standardisée en ligne, réseau symétrique régulier)</label><input type="number" id="voisins" value="3" step="1" min="1"></div>
  </div>
  <button onclick="calculer()">Calculer</button>
  <div id="resultat" class="resultat-zone"></div>
</div>

<script>
function calculer() {
  const resDiv = document.getElementById('resultat');
  const spec = document.getElementById('specification').value;
  const rho = parseFloat(document.getElementById('rho').value);
  const beta = parseFloat(document.getElementById('beta').value);
  const theta = parseFloat(document.getElementById('theta').value);
  const k = parseFloat(document.getElementById('voisins').value);
  if ([rho, beta, theta, k].some(isNaN) || k < 1) { resDiv.innerHTML = '<p class="erreur">Valeurs invalides.</p>'; return; }

  let out = '';
  if (spec === 'sar') {
    if (Math.abs(rho) >= 1) { resDiv.innerHTML = '<p class="erreur">|ρ| doit être strictement inférieur à 1.</p>'; return; }
    // Pour un réseau symétrique régulier à k voisins, poids 1/k chacun :
    // (I-rho W)^{-1} a une forme fermée : diagonale = (1 + (k-1)*rho/k... ) -- on utilise directement la
    // décomposition sur le sous-espace propre du graphe complet/régulier avec valeurs propres 1 et -1/k.
    // Effet total exact (formule générale, W standardisée en ligne) :
    const total = beta / (1 - rho);
    // Pour un graphe complet à n=k+1 unités toutes mutuellement voisines (cas du cours), on peut
    // donner aussi direct et indirect en résolvant explicitement (I-rho W)^{-1} pour ce cas régulier.
    const n = k + 1;
    // valeurs propres de W (graphe complet, poids 1/k) : 1 (une fois), -1/k (n-1 fois)
    // (I-rhoW)^{-1} diag = (1/n)*[1/(1-rho) + (n-1)/(1+rho/k)]
    const diag = (1/n) * (1/(1-rho) + (n-1)/(1+rho/k));
    const direct = beta * diag;
    const indirect = total - direct;
    out += `<div class="valeur">effet direct ≈ ${direct.toFixed(4)}</div>`;
    out += `<div class="valeur">effet indirect ≈ ${indirect.toFixed(4)}</div>`;
    out += `<div class="valeur">effet total = β/(1-ρ) = ${total.toFixed(4)}</div>`;
    out += `<p class="aide">Calcul du couple direct/indirect valable pour un réseau régulier où chaque unité a exactement ${k} voisins parmi ${n} unités au total, toutes symétriquement placées (comme le graphe complet à 4 régions du cours pour k=3).</p>`;
  } else {
    const direct = beta;
    const indirectParVoisin = theta / k;
    const indirectTotal = theta;
    out += `<div class="valeur">effet direct = β = ${direct.toFixed(4)}</div>`;
    out += `<div class="valeur">effet indirect par voisin = θ/k = ${indirectParVoisin.toFixed(4)}</div>`;
    out += `<div class="valeur">effet indirect total (somme sur les ${k} voisins) = θ = ${indirectTotal.toFixed(4)}</div>`;
    out += '<p class="aide">Dans le SLX, l\'effet direct est exactement β (aucune boucle de rétroaction) et l\'effet indirect reste strictement local, sans propagation au-delà des voisins immédiats.</p>';
  }
  resDiv.innerHTML = out;
}

window.onload = calculer;
</script>
</body>
</html>
