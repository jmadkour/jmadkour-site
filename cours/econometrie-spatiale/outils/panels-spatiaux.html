<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapitre 7 — Panels spatiaux — Multiplicateur dynamique spatio-temporel</title>
<style>
  :root { --cdef: #4A3B8C; --cintu: #E08000; --cex: #2E8B57; --ceco: #1F6FB2; --cgris: #5A5A5A; }
  * { box-sizing: border-box; }
  body { font-family: Georgia, "TeX Gyre Pagella", serif; background: #FDFDFD; color: #1a1a1a; max-width: 1150px; margin: 0 auto; padding: 1.5em; }
  h1 { font-family: "Helvetica Neue", Arial, sans-serif; color: var(--cdef); font-size: 1.5em; border-bottom: 2px solid var(--cdef); padding-bottom: 0.3em; }
  .sous-titre { color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; margin-top: -0.6em; }
  .panneau { background: white; border-left: 4px solid var(--cdef); border-radius: 6px; padding: 1em 1.2em; margin: 1em 0; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .panneau h2 { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 1.05em; color: var(--cdef); margin-top: 0; }
  label { display: block; margin: 0.6em 0 0.2em; font-size: 0.92em; color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; }
  input[type=number] { width: 100%; padding: 0.5em; border: 1px solid #ccc; border-radius: 4px; font-family: "Courier New", monospace; font-size: 0.9em; }
  .ligne { display: flex; gap: 1em; flex-wrap: wrap; align-items: flex-start; }
  .ligne > div { flex: 1; min-width: 170px; }
  button { margin-top: 1em; background: var(--cdef); color: white; border: none; padding: 0.6em 1.4em; border-radius: 5px; font-family: "Helvetica Neue", Arial, sans-serif; font-weight: bold; cursor: pointer; font-size: 0.95em; }
  button:hover { background: #3a2d70; }
  .erreur { color: #b00020; font-family: "Helvetica Neue", Arial, sans-serif; font-size: 0.9em; margin-top: 0.6em; }
  .resultat-zone { margin-top: 1em; font-family: "Helvetica Neue", Arial, sans-serif; }
  .valeur { font-size: 1.05em; padding: 0.5em 0.8em; background: var(--cdef); color: white; border-radius: 5px; display: inline-block; margin-top: 0.4em; margin-right:0.5em; }
  .ok { color: var(--cex); font-weight: bold; }
  .alerte { color: #b00020; font-weight: bold; }
</style>
</head>
<body>

<h1>Chapitre 7 — Panels spatiaux</h1>
<p class="sous-titre">Calculatrice interactive — effet de long terme du modèle dynamique spatio-temporel</p>

<div class="panneau">
  <h2>Effet de long terme et condition de stabilité</h2>
  <div class="ligne">
    <div><label for="tau">τ (persistance temporelle)</label><input type="number" id="tau" value="0.3" step="0.01"></div>
    <div><label for="rho">ρ (dépendance spatiale contemporaine)</label><input type="number" id="rho" value="0.2" step="0.01"></div>
    <div><label for="eta">η (spatio-temporel croisé)</label><input type="number" id="eta" value="0.1" step="0.01"></div>
    <div><label for="effetCT">Effet de court terme</label><input type="number" id="effetCT" value="0.5" step="0.01"></div>
  </div>
  <button onclick="calculer()">Calculer</button>
  <div id="resultat" class="resultat-zone"></div>
</div>

<script>
function calculer() {
  const resDiv = document.getElementById('resultat');
  const tau = parseFloat(document.getElementById('tau').value);
  const rho = parseFloat(document.getElementById('rho').value);
  const eta = parseFloat(document.getElementById('eta').value);
  const ct = parseFloat(document.getElementById('effetCT').value);
  if ([tau, rho, eta, ct].some(isNaN)) { resDiv.innerHTML = '<p class="erreur">Valeurs invalides.</p>'; return; }

  const somme = tau + rho + eta;
  const stable = Math.abs(somme) < 1;
  let out = `<div class="valeur">τ + ρ + η = ${somme.toFixed(4)}</div>`;
  out += `<p class="${stable ? 'ok' : 'alerte'}">${stable ? 'Condition de stabilité satisfaite (|τ+ρ+η| < 1).' : 'Condition de stabilité violée : le système est explosif, le calcul de l\'effet de long terme n\'est pas interprétable.'}</p>`;

  if (stable) {
    const lt = ct / (1 - somme);
    out += `<div class="valeur">Effet de long terme = ${lt.toFixed(4)}</div>`;
    out += `<p>Un choc de court terme de ${ct} sur x se traduit, une fois toutes les boucles temporelles et spatiales stabilisées, par un effet de long terme de ${lt.toFixed(4)}.</p>`;
  }
  resDiv.innerHTML = out;
}

window.onload = calculer;
</script>
</body>
</html>
