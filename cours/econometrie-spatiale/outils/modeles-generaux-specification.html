<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapitre 5 — Choix de spécification — Arbre de décision d'Anselin-Florax</title>
<style>
  :root { --cdef: #4A3B8C; --cintu: #E08000; --cex: #2E8B57; --ceco: #1F6FB2; --cgris: #5A5A5A; }
  * { box-sizing: border-box; }
  body { font-family: Georgia, "TeX Gyre Pagella", serif; background: #FDFDFD; color: #1a1a1a; max-width: 1150px; margin: 0 auto; padding: 1.5em; }
  h1 { font-family: "Helvetica Neue", Arial, sans-serif; color: var(--cdef); font-size: 1.5em; border-bottom: 2px solid var(--cdef); padding-bottom: 0.3em; }
  .sous-titre { color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; margin-top: -0.6em; }
  .panneau { background: white; border-left: 4px solid var(--cdef); border-radius: 6px; padding: 1em 1.2em; margin: 1em 0; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .panneau h2 { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 1.05em; color: var(--cdef); margin-top: 0; }
  label { display: block; margin: 0.6em 0 0.2em; font-size: 0.92em; color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; }
  input[type=number] { width: 100%; padding: 0.5em; border: 1px solid #ccc; border-radius: 4px; font-family: "Courier New", monospace; font-size: 0.9em; }
  .ligne { display: flex; gap: 1em; flex-wrap: wrap; align-items: flex-start; }
  .ligne > div { flex: 1; min-width: 170px; }
  button { margin-top: 1em; background: var(--cdef); color: white; border: none; padding: 0.6em 1.4em; border-radius: 5px; font-family: "Helvetica Neue", Arial, sans-serif; font-weight: bold; cursor: pointer; font-size: 0.95em; }
  button:hover { background: #3a2d70; }
  .resultat-zone { margin-top: 1em; font-family: "Helvetica Neue", Arial, sans-serif; }
  .valeur { font-size: 1.1em; padding: 0.5em 0.9em; background: var(--cdef); color: white; border-radius: 5px; display: inline-block; margin-top: 0.4em; }
  .aide { font-size: 0.85em; color: var(--cgris); margin-top: 0; }
</style>
</head>
<body>

<h1>Chapitre 5 — Modèles généraux et choix de spécification</h1>
<p class="sous-titre">Outil interactif — arbre de décision d'Anselin et Florax</p>

<div class="panneau">
  <h2>Entrer les statistiques LM (seuil critique χ²(1) à 5 % = 3,841)</h2>
  <div class="ligne">
    <div><label for="lmRho">LM-ρ</label><input type="number" id="lmRho" value="6.7" step="0.01"></div>
    <div><label for="lmLambda">LM-λ</label><input type="number" id="lmLambda" value="7.9" step="0.01"></div>
    <div><label for="lmRhoR">LM-ρ robuste</label><input type="number" id="lmRhoR" value="1.1" step="0.01"></div>
    <div><label for="lmLambdaR">LM-λ robuste</label><input type="number" id="lmLambdaR" value="5.4" step="0.01"></div>
  </div>
  <button onclick="decider()">Appliquer la procédure</button>
  <div id="resultatDecision" class="resultat-zone"></div>
</div>

<script>
const SEUIL = 3.841;

function decider() {
  const resDiv = document.getElementById('resultatDecision');
  const lmRho = parseFloat(document.getElementById('lmRho').value);
  const lmLambda = parseFloat(document.getElementById('lmLambda').value);
  const lmRhoR = parseFloat(document.getElementById('lmRhoR').value);
  const lmLambdaR = parseFloat(document.getElementById('lmLambdaR').value);
  if ([lmRho, lmLambda, lmRhoR, lmLambdaR].some(isNaN)) { resDiv.innerHTML = '<p>Valeurs invalides.</p>'; return; }

  const sigRho = lmRho > SEUIL;
  const sigLambda = lmLambda > SEUIL;
  let modele, etapes = [];

  if (!sigRho && !sigLambda) {
    modele = 'MCO (aucune dépendance spatiale détectée)';
    etapes.push(`LM-ρ = ${lmRho} et LM-λ = ${lmLambda} : aucun n'est significatif (seuil ${SEUIL}).`);
  } else if (sigRho && !sigLambda) {
    modele = 'SAR';
    etapes.push(`LM-ρ = ${lmRho} est significatif, LM-λ = ${lmLambda} ne l'est pas.`);
  } else if (!sigRho && sigLambda) {
    modele = 'SEM';
    etapes.push(`LM-λ = ${lmLambda} est significatif, LM-ρ = ${lmRho} ne l'est pas.`);
  } else {
    etapes.push(`LM-ρ = ${lmRho} et LM-λ = ${lmLambda} sont tous deux significatifs : passage aux versions robustes.`);
    const sigRhoR = lmRhoR > SEUIL;
    const sigLambdaR = lmLambdaR > SEUIL;
    if (sigRhoR && !sigLambdaR) { modele = 'SAR'; etapes.push(`LM-ρ* = ${lmRhoR} significatif, LM-λ* = ${lmLambdaR} ne l'est pas.`); }
    else if (!sigRhoR && sigLambdaR) { modele = 'SEM'; etapes.push(`LM-λ* = ${lmLambdaR} significatif, LM-ρ* = ${lmRhoR} ne l'est pas.`); }
    else if (sigRhoR && sigLambdaR) { modele = 'SAC / SARAR'; etapes.push(`LM-ρ* = ${lmRhoR} et LM-λ* = ${lmLambdaR} tous deux significatifs.`); }
    else { modele = 'MCO (les tests robustes ne confirment aucune dépendance nette)'; etapes.push(`LM-ρ* = ${lmRhoR} et LM-λ* = ${lmLambdaR} tous deux non significatifs.`); }
  }

  let out = `<div class="valeur">Modèle recommandé : ${modele}</div>`;
  out += '<ul>' + etapes.map(e => `<li>${e}</li>`).join('') + '</ul>';
  resDiv.innerHTML = out;
}

window.onload = decider;
</script>
</body>
</html>
