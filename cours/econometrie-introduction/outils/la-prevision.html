<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapitre 6 — La prévision — Calculatrice interactive</title>
<style>
  :root { --cdef: #4A3B8C; --cintu: #E08000; --cex: #2E8B57; --ceco: #1F6FB2; --cgris: #5A5A5A; }
  * { box-sizing: border-box; }
  body { font-family: Georgia, "TeX Gyre Pagella", serif; background: #FDFDFD; color: #1a1a1a; max-width: 1150px; margin: 0 auto; padding: 1.5em; }
  h1 { font-family: "Helvetica Neue", Arial, sans-serif; color: var(--cdef); font-size: 1.5em; border-bottom: 2px solid var(--cdef); padding-bottom: 0.3em; }
  .sous-titre { color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; margin-top: -0.6em; }
  .panneau { background: white; border-left: 4px solid var(--cdef); border-radius: 6px; padding: 1em 1.2em; margin: 1em 0; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .panneau h2 { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 1.05em; color: var(--cdef); margin-top: 0; }
  label { display: block; margin: 0.6em 0 0.2em; font-size: 0.92em; color: var(--cgris); }
  input[type=text], input[type=number] { width: 100%; padding: 0.5em; border: 1px solid #ccc; border-radius: 4px; font-family: "Courier New", monospace; font-size: 0.9em; }
  .ligne { display: flex; gap: 1em; flex-wrap: wrap; align-items: flex-start; }
  .ligne > div { flex: 1; min-width: 170px; }
  button { margin-top: 1em; background: var(--cdef); color: white; border: none; padding: 0.6em 1.4em; border-radius: 5px; font-family: "Helvetica Neue", Arial, sans-serif; font-weight: bold; cursor: pointer; font-size: 0.95em; }
  button:hover { background: #3a2d70; }
  .erreur { color: #b00020; font-family: "Helvetica Neue", Arial, sans-serif; font-size: 0.9em; margin-top: 0.6em; }
  .alerte { color: #b00020; font-weight: bold; }
  .resultat-zone { margin-top: 1em; font-family: "Helvetica Neue", Arial, sans-serif; }
  .aide { font-size: 0.85em; color: var(--cgris); margin-top: 0; }
  .valeur { font-size: 1.05em; padding: 0.5em 0.8em; background: var(--cdef); color: white; border-radius: 5px; display: inline-block; margin-top: 0.4em; margin-right:0.5em; }
  .avertissement { font-size: 0.82em; color: var(--cgris); font-style: italic; margin-top: 1em; }
</style>
</head>
<body>

<h1>Chapitre 6 — La prévision</h1>
<p class="sous-titre">Calculatrice interactive — prévision ponctuelle et deux intervalles</p>

<div class="panneau">
  <h2>Intervalles de prévision (moyenne et individuel)</h2>
  <div class="ligne">
    <div><label for="b0">β̂₀</label><input type="number" id="b0" value="1.36" step="0.01"></div>
    <div><label for="b1">β̂₁</label><input type="number" id="b1" value="0.46" step="0.01"></div>
    <div><label for="sigmaEps">σ̂ε</label><input type="number" id="sigmaEps" value="0.0894" step="0.001"></div>
  </div>
  <div class="ligne">
    <div><label for="nObs">n</label><input type="number" id="nObs" value="5" step="1"></div>
    <div><label for="xbar">x̄</label><input type="number" id="xbar" value="4" step="0.1"></div>
    <div><label for="sumSq">Σ(xᵢ-x̄)²</label><input type="number" id="sumSq" value="10" step="0.1"></div>
  </div>
  <div class="ligne">
    <div><label for="xh">xₕ (valeur à prévoir)</label><input type="number" id="xh" value="5" step="0.1"></div>
    <div><label for="xmin">x minimum observé (domaine)</label><input type="number" id="xmin" value="2" step="0.1"></div>
    <div><label for="xmax">x maximum observé (domaine)</label><input type="number" id="xmax" value="6" step="0.1"></div>
    <div><label for="tcrit">Seuil t critique</label><input type="number" id="tcrit" value="3.182" step="0.01"></div>
  </div>
  <button onclick="calculerPrevision()">Calculer la prévision et les deux intervalles</button>
  <div id="resultatPrevision" class="resultat-zone"></div>
</div>

<p class="avertissement">L'intervalle individuel ne descend jamais sous ±t×σ̂ε, quel que soit n : c'est l'aléa personnel, irréductible avec une seule variable explicative.</p>

<script>
function calculerPrevision() {
  const resDiv = document.getElementById('resultatPrevision');
  const b0 = parseFloat(document.getElementById('b0').value);
  const b1 = parseFloat(document.getElementById('b1').value);
  const sigma = parseFloat(document.getElementById('sigmaEps').value);
  const n = parseFloat(document.getElementById('nObs').value);
  const xbar = parseFloat(document.getElementById('xbar').value);
  const sumSq = parseFloat(document.getElementById('sumSq').value);
  const xh = parseFloat(document.getElementById('xh').value);
  const xmin = parseFloat(document.getElementById('xmin').value);
  const xmax = parseFloat(document.getElementById('xmax').value);
  const tcrit = parseFloat(document.getElementById('tcrit').value);
  if ([b0,b1,sigma,n,xbar,sumSq,xh,xmin,xmax,tcrit].some(isNaN) || n<=0 || sumSq<=0) {
    resDiv.innerHTML = '<p class="erreur">Valeurs invalides.</p>'; return;
  }
  const yhat = b0 + b1*xh;
  const factorMoy = Math.sqrt(1/n + (xh-xbar)**2/sumSq);
  const factorInd = Math.sqrt(1 + 1/n + (xh-xbar)**2/sumSq);
  const halfMoy = tcrit*sigma*factorMoy;
  const halfInd = tcrit*sigma*factorInd;
  let out = `<div class="valeur">ŷₕ = ${yhat.toFixed(4)}</div>`;
  out += `<p>IC de la <strong>moyenne</strong> (95%, approx.) : [${(yhat-halfMoy).toFixed(4)} ; ${(yhat+halfMoy).toFixed(4)}] — demi-largeur ${halfMoy.toFixed(4)}.</p>`;
  out += `<p>IC de <strong>prévision individuelle</strong> (95%, approx.) : [${(yhat-halfInd).toFixed(4)} ; ${(yhat+halfInd).toFixed(4)}] — demi-largeur ${halfInd.toFixed(4)}.</p>`;
  out += `<p>Rapport largeur individuelle / largeur moyenne : ${(halfInd/halfMoy).toFixed(2)}×.</p>`;
  if (xh < xmin || xh > xmax) {
    out += `<p class="alerte">⚠ Extrapolation : xₕ = ${xh} est en dehors du domaine observé [${xmin} ; ${xmax}]. Les intervalles ci-dessus supposent que la relation linéaire reste valable hors de ce domaine — rien ne le garantit.</p>`;
  } else {
    out += `<p>xₕ = ${xh} est à l'intérieur du domaine observé [${xmin} ; ${xmax}].</p>`;
  }
  resDiv.innerHTML = out;
}

window.onload = () => { calculerPrevision(); };
</script>
</body>
</html>
