<!DOCTYPE html>
<html lang="fr">
<head>
<script id="jm-theme-detect">
(function () {
  var t = null;
  try { t = localStorage.getItem("jm-theme"); } catch (e) {}
  if (!t) { t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light"; }
  document.documentElement.setAttribute("data-theme", t);
  window.addEventListener("storage", function (e) {
    if (e.key === "jm-theme" && e.newValue) { document.documentElement.setAttribute("data-theme", e.newValue); }
  });
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Introduction — Mandelbrot et les faits stylisés — Calculatrice interactive</title>
<style>
  :root { --cdef: #1F6FB2; --cintu: #B56600; --cex: #1D9E75; --ceco: #1F6FB2; --cgris: #5A5A5A; }
  * { box-sizing: border-box; }
  body { font-family: Georgia, "TeX Gyre Pagella", serif; background: #FDFDFD; color: #1a1a1a; max-width: 1150px; margin: 0 auto; padding: 1.5em; }
  h1 { font-family: "Helvetica Neue", Arial, sans-serif; color: var(--cdef); font-size: 1.5em; border-bottom: 2px solid var(--cdef); padding-bottom: 0.3em; }
  .sous-titre { color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; margin-top: -0.6em; }
  .panneau { background: white; border-left: 4px solid var(--cdef); border-radius: 6px; padding: 1em 1.2em; margin: 1em 0; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .panneau h2 { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 1.05em; color: var(--cdef); margin-top: 0; }
  label { display: block; margin: 0.6em 0 0.2em; font-size: 0.92em; color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; }
  input[type=number] { width: 100%; padding: 0.5em; border: 1px solid #ccc; border-radius: 4px; font-family: "Courier New", monospace; font-size: 0.9em; }
  .ligne { display: flex; gap: 1em; flex-wrap: wrap; align-items: flex-start; }
  .ligne > div { flex: 1; min-width: 150px; }
  button { margin-top: 1em; background: var(--cdef); color: white; border: none; padding: 0.6em 1.4em; border-radius: 5px; font-family: "Helvetica Neue", Arial, sans-serif; font-weight: bold; cursor: pointer; font-size: 0.95em; }
  button:hover { background: #17578f; }
  .erreur { color: #b00020; font-family: "Helvetica Neue", Arial, sans-serif; font-size: 0.9em; margin-top: 0.6em; }
  .resultat-zone { margin-top: 1em; font-family: "Helvetica Neue", Arial, sans-serif; }
  .aide { font-size: 0.85em; color: var(--cgris); margin-top: 0; }
  table.res { border-collapse: collapse; font-family: "Courier New", monospace; font-size: 0.85em; margin-top: 0.6em; width: 100%; }
  table.res th, table.res td { border: 1px solid #ccc; padding: 0.3em 0.6em; text-align: center; }
  .valeur { font-size: 1.02em; padding: 0.4em 0.7em; background: var(--cdef); color: white; border-radius: 5px; display: inline-block; margin: 0.2em 0.3em 0.2em 0; }
</style>
<style id="jm-theme-override">
/* Surcharge : palette et typographie du site jmadkour.org, synchronisee
   avec son bascule clair/sombre (voir script jm-theme-detect ci-dessus).
   Remplace la palette "polycopie" (violet, serif) utilisee par defaut
   dans le bloc <style> d'origine de cette page. */
:root {
  --cdef: #1f6fb2; --ceco: #1f6fb2; --cex: #1d9e75; --cintu: #b56600; --cgris: #54707f;
  --bg: #ffffff; --fg: #142a38; --border: #dbe6ee; --card-bg: #f6f9fb; --code-bg: #f3f7fa;
  --danger: #b00020; --primary-dark: #17578f;
}
:root[data-theme="dark"] {
  --cdef: #3aa0e6; --ceco: #3aa0e6; --cex: #37b47e; --cintu: #e0954a; --cgris: #9db4c0;
  --bg: #0d1b26; --fg: #e7eef3; --border: #20455a; --card-bg: #13303d; --code-bg: #0f2733;
  --danger: #e0554a; --primary-dark: #5bb3ef;
}
* { box-sizing: border-box; }
html { background: var(--bg) !important; }
body {
  background: var(--bg) !important; color: var(--fg) !important;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
}
h1, h2, h3, .panneau h2 {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  color: var(--cdef) !important; border-color: var(--cdef) !important;
}
.sous-titre, .aide, label { color: var(--cgris) !important; }
.panneau {
  background: var(--card-bg) !important; border: 1px solid var(--border) !important;
  border-left: 1px solid var(--border) !important; border-radius: 14px !important; box-shadow: none !important;
}
input[type=number], input[type=text], select, textarea {
  background: var(--bg) !important; color: var(--fg) !important; border: 1px solid var(--border) !important;
}
button {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  background: var(--cdef) !important; color: #ffffff !important; border-radius: 8px !important; border: none !important;
}
button:hover { background: var(--primary-dark) !important; }
.erreur { color: var(--danger) !important; }
table.res, table.res th, table.res td { border-color: var(--border) !important; }
table.res th { background: var(--card-bg) !important; }
.valeur { background: var(--cdef) !important; color: #ffffff !important; }
.valeur.ok { background: var(--cex) !important; }
.valeur.ko { background: var(--danger) !important; }
</style>
</head>
<body>

<h1>Introduction — Mandelbrot et les faits stylisés des rentabilités</h1>
<p class="sous-titre">Calculatrice interactive — kurtosis, fréquence des pertes extrêmes, gaussianité par agrégation</p>

<div class="panneau">
  <h2>Kurtosis à partir des moments</h2>
  <div class="ligne">
    <div><label for="m4">E[(r−μ)⁴]</label><input type="number" id="m4" value="45" step="0.1"></div>
    <div><label for="Vr">V(r)</label><input type="number" id="Vr" value="2.5" step="0.01" min="0.0001"></div>
  </div>
  <button onclick="calculerKurtosis()">Calculer κ</button>
  <div id="resultatKurtosis" class="resultat-zone"></div>
</div>

<div class="panneau">
  <h2>Fréquence d'une perte extrême, normale contre empirique</h2>
  <div class="ligne">
    <div><label for="zSeuil">seuil en écarts-types (z)</label><input type="number" id="zSeuil" value="3" step="0.1"></div>
    <div><label for="nEvenements">nombre d'événements observés</label><input type="number" id="nEvenements" value="20" step="1" min="0"></div>
    <div><label for="Tjours">nombre de jours de l'échantillon</label><input type="number" id="Tjours" value="2000" step="1" min="1"></div>
    <div><label for="joursAn">jours de cotation par an</label><input type="number" id="joursAn" value="250" step="1" min="1"></div>
  </div>
  <button onclick="calculerFrequence()">Comparer les fréquences</button>
  <div id="resultatFrequence" class="resultat-zone"></div>
</div>

<div class="panneau">
  <h2>Gaussianité par agrégation</h2>
  <div class="ligne">
    <div><label for="kappa1">kurtosis journalier κ₁</label><input type="number" id="kappa1" value="6.05" step="0.01" min="3"></div>
    <div><label for="hMax">horizon maximal (jours)</label><input type="number" id="hMax" value="20" step="1" min="1" max="250"></div>
  </div>
  <button onclick="calculerAgregation()">Calculer</button>
  <div id="resultatAgregation" class="resultat-zone"></div>
</div>

<script>
function erf(x) {
  const sign = x >= 0 ? 1 : -1; x = Math.abs(x);
  const a1=0.254829592,a2=-0.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=0.3275911;
  const t = 1/(1+p*x);
  const y = 1-(((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-x*x);
  return sign*y;
}
function Phi(x) { return 0.5*(1+erf(x/Math.sqrt(2))); }

function calculerKurtosis() {
  const resDiv = document.getElementById('resultatKurtosis');
  const m4 = parseFloat(document.getElementById('m4').value);
  const V = parseFloat(document.getElementById('Vr').value);
  if ([m4, V].some(isNaN) || V <= 0) {
    resDiv.innerHTML = '<p class="erreur">Valeurs invalides.</p>';
    return;
  }
  const kappa = m4 / (V * V);
  const queueEpaisse = kappa > 3;
  let out = `<div class="valeur">κ = ${kappa.toFixed(4)}</div>`;
  out += `<div class="valeur">${queueEpaisse ? 'queues épaisses (κ > 3)' : 'pas de queues épaisses (κ ≤ 3)'}</div>`;
  resDiv.innerHTML = out;
}

function calculerFrequence() {
  const resDiv = document.getElementById('resultatFrequence');
  const z = parseFloat(document.getElementById('zSeuil').value);
  const n = parseFloat(document.getElementById('nEvenements').value);
  const T = parseFloat(document.getElementById('Tjours').value);
  const joursAn = parseFloat(document.getElementById('joursAn').value);
  if ([z, n, T, joursAn].some(isNaN) || T <= 0 || joursAn <= 0) {
    resDiv.innerHTML = '<p class="erreur">Valeurs invalides.</p>';
    return;
  }
  const pNormal = Phi(-Math.abs(z));
  const freqNormaleJours = 1 / pNormal;
  const parAnNormal = joursAn / freqNormaleJours;
  let out = `<div class="valeur">P(Z &lt; −${Math.abs(z)}) = ${pNormal.toFixed(6)}</div>`;
  out += `<div class="valeur">fréquence normale : 1 jour sur ${freqNormaleJours.toFixed(1)} (${parAnNormal.toFixed(3)} / an)</div>`;
  if (n > 0) {
    const freqEmpJours = T / n;
    const parAnEmp = joursAn / freqEmpJours;
    out += `<div class="valeur">fréquence empirique : 1 jour sur ${freqEmpJours.toFixed(1)} (${parAnEmp.toFixed(3)} / an)</div>`;
    out += `<div class="valeur">ratio empirique / normal = ${(parAnEmp / parAnNormal).toFixed(2)}</div>`;
  }
  resDiv.innerHTML = out;
}

function calculerAgregation() {
  const resDiv = document.getElementById('resultatAgregation');
  const kappa1 = parseFloat(document.getElementById('kappa1').value);
  const hMax = parseInt(document.getElementById('hMax').value);
  if (isNaN(kappa1) || isNaN(hMax) || kappa1 < 3 || hMax < 1) {
    resDiv.innerHTML = '<p class="erreur">Valeurs invalides (κ₁ doit être ≥ 3).</p>';
    return;
  }
  const exces1 = kappa1 - 3;
  let out = `<div class="valeur">excès de kurtosis journalier = ${exces1.toFixed(4)}</div>`;
  out += '<table class="res"><tr><th>h (jours)</th><th>excès de kurtosis</th><th>kurtosis</th></tr>';
  const hs = [1, 5, 10, 20, hMax].filter((v, i, a) => a.indexOf(v) === i && v <= hMax).sort((a, b) => a - b);
  hs.forEach(h => {
    const excesH = exces1 / h;
    out += `<tr><td>${h}</td><td>${excesH.toFixed(4)}</td><td>${(excesH + 3).toFixed(4)}</td></tr>`;
  });
  out += '</table>';
  resDiv.innerHTML = out;
}

window.onload = () => { calculerKurtosis(); calculerFrequence(); calculerAgregation(); };
</script>
</body>
</html>
