<!DOCTYPE html>
<html lang="fr">
<head>
<script id="jm-theme-detect">
(function () {
  var t = null;
  try { t = localStorage.getItem("jm-theme"); } catch (e) {}
  if (!t) { t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light"; }
  document.documentElement.setAttribute("data-theme", t);
  window.addEventListener("storage", function (e) {
    if (e.key === "jm-theme" && e.newValue) { document.documentElement.setAttribute("data-theme", e.newValue); }
  });
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapitre 11 — GJR-GARCH, TGARCH et la courbe d'impact — Calculatrice interactive</title>
<style>
  :root { --cdef: #1F6FB2; --cintu: #B56600; --cex: #1D9E75; --ceco: #1F6FB2; --cgris: #5A5A5A; }
  * { box-sizing: border-box; }
  body { font-family: Georgia, "TeX Gyre Pagella", serif; background: #FDFDFD; color: #1a1a1a; max-width: 1150px; margin: 0 auto; padding: 1.5em; }
  h1 { font-family: "Helvetica Neue", Arial, sans-serif; color: var(--cdef); font-size: 1.5em; border-bottom: 2px solid var(--cdef); padding-bottom: 0.3em; }
  .sous-titre { color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; margin-top: -0.6em; }
  .panneau { background: white; border-left: 4px solid var(--cdef); border-radius: 6px; padding: 1em 1.2em; margin: 1em 0; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .panneau h2 { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 1.05em; color: var(--cdef); margin-top: 0; }
  label { display: block; margin: 0.6em 0 0.2em; font-size: 0.92em; color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; }
  input[type=number] { width: 100%; padding: 0.5em; border: 1px solid #ccc; border-radius: 4px; font-family: "Courier New", monospace; font-size: 0.9em; }
  .ligne { display: flex; gap: 1em; flex-wrap: wrap; align-items: flex-start; }
  .ligne > div { flex: 1; min-width: 150px; }
  button { margin-top: 1em; background: var(--cdef); color: white; border: none; padding: 0.6em 1.4em; border-radius: 5px; font-family: "Helvetica Neue", Arial, sans-serif; font-weight: bold; cursor: pointer; font-size: 0.95em; }
  button:hover { background: #17578f; }
  .erreur { color: #b00020; font-family: "Helvetica Neue", Arial, sans-serif; font-size: 0.9em; margin-top: 0.6em; }
  .resultat-zone { margin-top: 1em; font-family: "Helvetica Neue", Arial, sans-serif; }
  .aide { font-size: 0.85em; color: var(--cgris); margin-top: 0; }
  table.res { border-collapse: collapse; font-family: "Courier New", monospace; font-size: 0.85em; margin-top: 0.6em; width: 100%; }
  table.res th, table.res td { border: 1px solid #ccc; padding: 0.3em 0.6em; text-align: center; }
  .valeur { font-size: 1.02em; padding: 0.4em 0.7em; background: var(--cdef); color: white; border-radius: 5px; display: inline-block; margin: 0.2em 0.3em 0.2em 0; }
  .valeur.ok { background: var(--cex); }
  .valeur.ko { background: #b00020; }
</style>
<style id="jm-theme-override">
/* Surcharge : palette et typographie du site jmadkour.org, synchronisee
   avec son bascule clair/sombre (voir script jm-theme-detect ci-dessus).
   Remplace la palette "polycopie" (violet, serif) utilisee par defaut
   dans le bloc <style> d'origine de cette page. */
:root {
  --cdef: #1f6fb2; --ceco: #1f6fb2; --cex: #1d9e75; --cintu: #b56600; --cgris: #54707f;
  --bg: #ffffff; --fg: #142a38; --border: #dbe6ee; --card-bg: #f6f9fb; --code-bg: #f3f7fa;
  --danger: #b00020; --primary-dark: #17578f;
}
:root[data-theme="dark"] {
  --cdef: #3aa0e6; --ceco: #3aa0e6; --cex: #37b47e; --cintu: #e0954a; --cgris: #9db4c0;
  --bg: #0d1b26; --fg: #e7eef3; --border: #20455a; --card-bg: #13303d; --code-bg: #0f2733;
  --danger: #e0554a; --primary-dark: #5bb3ef;
}
* { box-sizing: border-box; }
html { background: var(--bg) !important; }
body {
  background: var(--bg) !important; color: var(--fg) !important;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
}
h1, h2, h3, .panneau h2 {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  color: var(--cdef) !important; border-color: var(--cdef) !important;
}
.sous-titre, .aide, label { color: var(--cgris) !important; }
.panneau {
  background: var(--card-bg) !important; border: 1px solid var(--border) !important;
  border-left: 1px solid var(--border) !important; border-radius: 14px !important; box-shadow: none !important;
}
input[type=number], input[type=text], select, textarea {
  background: var(--bg) !important; color: var(--fg) !important; border: 1px solid var(--border) !important;
}
button {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  background: var(--cdef) !important; color: #ffffff !important; border-radius: 8px !important; border: none !important;
}
button:hover { background: var(--primary-dark) !important; }
.erreur { color: var(--danger) !important; }
table.res, table.res th, table.res td { border-color: var(--border) !important; }
table.res th { background: var(--card-bg) !important; }
.valeur { background: var(--cdef) !important; color: #ffffff !important; }
.valeur.ok { background: var(--cex) !important; }
.valeur.ko { background: var(--danger) !important; }
</style>
</head>
<body>

<h1>Chapitre 11 — GJR-GARCH, TGARCH et la courbe d'impact</h1>
<p class="sous-titre">Calculatrice interactive — h_t asymétrique, persistance et stationnarité, décomposition du gain de BIC</p>

<div class="panneau">
  <h2>GJR-GARCH : h_t selon le signe du choc</h2>
  <div class="ligne">
    <div><label for="omegaG2">ω</label><input type="number" id="omegaG2" value="0.0232" step="0.0001" min="0"></div>
    <div><label for="alphaG2">α₁</label><input type="number" id="alphaG2" value="0.0434" step="0.0001" min="0"></div>
    <div><label for="gammaG2">γ</label><input type="number" id="gammaG2" value="0.1157" step="0.0001"></div>
    <div><label for="betaG2">β₁</label><input type="number" id="betaG2" value="0.8862" step="0.0001" min="0"></div>
  </div>
  <div class="ligne">
    <div><label for="epsAmpl">amplitude du choc |ε_{t-1}|</label><input type="number" id="epsAmpl" value="1.5" step="0.1" min="0"></div>
    <div><label for="hPrevG2">h_{t-1}</label><input type="number" id="hPrevG2" value="1.8" step="0.01" min="0"></div>
  </div>
  <button onclick="calculerGjr()">Comparer choc positif et choc négatif</button>
  <div id="resultatGjr" class="resultat-zone"></div>
</div>

<div class="panneau">
  <h2>Persistance et stationnarité</h2>
  <div class="ligne">
    <div><label for="omegaP2">ω</label><input type="number" id="omegaP2" value="0.0232" step="0.0001" min="0"></div>
    <div><label for="alphaP2">α₁</label><input type="number" id="alphaP2" value="0.0434" step="0.0001" min="0"></div>
    <div><label for="gammaP2">γ</label><input type="number" id="gammaP2" value="0.1157" step="0.0001"></div>
    <div><label for="betaP2">β₁</label><input type="number" id="betaP2" value="0.8862" step="0.0001" min="0"></div>
  </div>
  <button onclick="calculerPersistanceGjr()">Calculer π et σ²</button>
  <div id="resultatPersistanceGjr" class="resultat-zone"></div>
</div>

<div class="panneau">
  <h2>Décomposer le gain de BIC en deux étapes</h2>
  <div class="ligne">
    <div><label for="bicGarchNorm">BIC — GARCH gaussien</label><input type="number" id="bicGarchNorm" value="7117.8" step="0.1"></div>
    <div><label for="bicGarchStudent">BIC — GARCH Student</label><input type="number" id="bicGarchStudent" value="7021.1" step="0.1"></div>
    <div><label for="bicGjrStudent">BIC — GJR-GARCH Student</label><input type="number" id="bicGjrStudent" value="7000.5" step="0.1"></div>
  </div>
  <button onclick="calculerDecompositionBic()">Décomposer les gains successifs</button>
  <div id="resultatDecompositionBic" class="resultat-zone"></div>
</div>

<script>
function calculerGjr() {
  const resDiv = document.getElementById('resultatGjr');
  const omega = parseFloat(document.getElementById('omegaG2').value);
  const alpha1 = parseFloat(document.getElementById('alphaG2').value);
  const gamma = parseFloat(document.getElementById('gammaG2').value);
  const beta1 = parseFloat(document.getElementById('betaG2').value);
  const epsAmpl = parseFloat(document.getElementById('epsAmpl').value);
  const hPrev = parseFloat(document.getElementById('hPrevG2').value);
  if ([omega, alpha1, gamma, beta1, epsAmpl, hPrev].some(isNaN) || omega < 0 || alpha1 < 0 || beta1 < 0 || epsAmpl < 0 || hPrev < 0) {
    resDiv.innerHTML = '<p class="erreur">Valeurs invalides.</p>';
    return;
  }
  const hPos = omega + alpha1 * epsAmpl * epsAmpl + beta1 * hPrev;
  const hNeg = omega + (alpha1 + gamma) * epsAmpl * epsAmpl + beta1 * hPrev;
  let out = `<div class="valeur">h_t (choc positif) = ${hPos.toFixed(4)}</div>`;
  out += `<div class="valeur">h_t (choc négatif) = ${hNeg.toFixed(4)}</div>`;
  out += `<div class="valeur">écart = ${(hNeg - hPos).toFixed(4)}</div>`;
  if (alpha1 + gamma >= 0 && alpha1 > 0) {
    out += `<div class="valeur">(α₁+γ)/α₁ = ${((alpha1 + gamma) / alpha1).toFixed(3)}</div>`;
  }
  resDiv.innerHTML = out;
}

function calculerPersistanceGjr() {
  const resDiv = document.getElementById('resultatPersistanceGjr');
  const omega = parseFloat(document.getElementById('omegaP2').value);
  const alpha1 = parseFloat(document.getElementById('alphaP2').value);
  const gamma = parseFloat(document.getElementById('gammaP2').value);
  const beta1 = parseFloat(document.getElementById('betaP2').value);
  if ([omega, alpha1, gamma, beta1].some(isNaN) || omega < 0 || alpha1 < 0 || beta1 < 0) {
    resDiv.innerHTML = '<p class="erreur">Valeurs invalides.</p>';
    return;
  }
  const pi = alpha1 + gamma / 2 + beta1;
  const stationnaire = pi < 1;
  let out = `<div class="valeur">π = α₁ + γ/2 + β₁ = ${pi.toFixed(4)}</div>`;
  out += `<div class="valeur ${stationnaire ? 'ok' : 'ko'}">${stationnaire ? 'stationnaire' : 'non stationnaire'}</div>`;
  if (stationnaire && omega > 0) {
    out += `<div class="valeur">σ² = ω/(1−π) = ${(omega / (1 - pi)).toFixed(4)}</div>`;
  }
  const positivite = alpha1 + gamma >= 0;
  out += `<div class="valeur ${positivite ? 'ok' : 'ko'}">contrainte α₁+γ≥0 : ${positivite ? 'respectée' : 'violée'}</div>`;
  resDiv.innerHTML = out;
}

function calculerDecompositionBic() {
  const resDiv = document.getElementById('resultatDecompositionBic');
  const bicA = parseFloat(document.getElementById('bicGarchNorm').value);
  const bicB = parseFloat(document.getElementById('bicGarchStudent').value);
  const bicC = parseFloat(document.getElementById('bicGjrStudent').value);
  if ([bicA, bicB, bicC].some(isNaN)) {
    resDiv.innerHTML = '<p class="erreur">Valeurs invalides.</p>';
    return;
  }
  const gainLoi = bicA - bicB;
  const gainAsym = bicB - bicC;
  const gainTotal = bicA - bicC;
  let out = `<div class="valeur">gain dû à la loi de Student = ${gainLoi.toFixed(2)}</div>`;
  out += `<div class="valeur">gain dû à l'asymétrie γ = ${gainAsym.toFixed(2)}</div>`;
  out += `<div class="valeur">gain total = ${gainTotal.toFixed(2)}</div>`;
  out += `<div class="valeur">somme des deux gains = ${(gainLoi + gainAsym).toFixed(2)} (doit égaler le gain total)</div>`;
  resDiv.innerHTML = out;
}

window.onload = () => { calculerGjr(); calculerPersistanceGjr(); calculerDecompositionBic(); };
</script>
</body>
</html>
