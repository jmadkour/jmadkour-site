<!DOCTYPE html>
<html lang="fr">
<head>
<script id="jm-theme-detect">
(function () {
  var t = null;
  try { t = localStorage.getItem("jm-theme"); } catch (e) {}
  if (!t) { t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light"; }
  document.documentElement.setAttribute("data-theme", t);
  window.addEventListener("storage", function (e) {
    if (e.key === "jm-theme" && e.newValue) { document.documentElement.setAttribute("data-theme", e.newValue); }
  });
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapitre 18 — Mise en œuvre sur Python — Calculatrice interactive</title>
<style>
  :root { --cdef: #1F6FB2; --cintu: #B56600; --cex: #1D9E75; --ceco: #1F6FB2; --cgris: #5A5A5A; }
  * { box-sizing: border-box; }
  body { font-family: Georgia, "TeX Gyre Pagella", serif; background: #FDFDFD; color: #1a1a1a; max-width: 1150px; margin: 0 auto; padding: 1.5em; }
  h1 { font-family: "Helvetica Neue", Arial, sans-serif; color: var(--cdef); font-size: 1.5em; border-bottom: 2px solid var(--cdef); padding-bottom: 0.3em; }
  .sous-titre { color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; margin-top: -0.6em; }
  .panneau { background: white; border-left: 4px solid var(--cdef); border-radius: 6px; padding: 1em 1.2em; margin: 1em 0; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .panneau h2 { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 1.05em; color: var(--cdef); margin-top: 0; }
  label { display: block; margin: 0.6em 0 0.2em; font-size: 0.92em; color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; }
  input[type=number] { width: 100%; padding: 0.5em; border: 1px solid #ccc; border-radius: 4px; font-family: "Courier New", monospace; font-size: 0.9em; }
  textarea { width: 100%; padding: 0.5em; border: 1px solid #ccc; border-radius: 4px; font-family: "Courier New", monospace; font-size: 0.9em; resize: vertical; min-height: 2.4em; }
  .ligne { display: flex; gap: 1em; flex-wrap: wrap; align-items: flex-start; }
  .ligne > div { flex: 1; min-width: 150px; }
  button { margin-top: 1em; background: var(--cdef); color: white; border: none; padding: 0.6em 1.4em; border-radius: 5px; font-family: "Helvetica Neue", Arial, sans-serif; font-weight: bold; cursor: pointer; font-size: 0.95em; }
  button:hover { background: #17578f; }
  .erreur { color: #b00020; font-family: "Helvetica Neue", Arial, sans-serif; font-size: 0.9em; margin-top: 0.6em; }
  .resultat-zone { margin-top: 1em; font-family: "Helvetica Neue", Arial, sans-serif; }
  .aide { font-size: 0.85em; color: var(--cgris); margin-top: 0; }
  table.res { border-collapse: collapse; font-family: "Courier New", monospace; font-size: 0.85em; margin-top: 0.6em; width: 100%; }
  table.res th, table.res td { border: 1px solid #ccc; padding: 0.3em 0.6em; text-align: center; }
  .valeur { font-size: 1.02em; padding: 0.4em 0.7em; background: var(--cdef); color: white; border-radius: 5px; display: inline-block; margin: 0.2em 0.3em 0.2em 0; }
  .valeur.ok { background: var(--cex); }
  .valeur.ko { background: #b00020; }
</style>
<style id="jm-theme-override">
/* Surcharge : palette et typographie du site jmadkour.org, synchronisee
   avec son bascule clair/sombre (voir script jm-theme-detect ci-dessus).
   Remplace la palette "polycopie" (violet, serif) utilisee par defaut
   dans le bloc <style> d'origine de cette page. */
:root {
  --cdef: #1f6fb2; --ceco: #1f6fb2; --cex: #1d9e75; --cintu: #b56600; --cgris: #54707f;
  --bg: #ffffff; --fg: #142a38; --border: #dbe6ee; --card-bg: #f6f9fb; --code-bg: #f3f7fa;
  --danger: #b00020; --primary-dark: #17578f;
}
:root[data-theme="dark"] {
  --cdef: #3aa0e6; --ceco: #3aa0e6; --cex: #37b47e; --cintu: #e0954a; --cgris: #9db4c0;
  --bg: #0d1b26; --fg: #e7eef3; --border: #20455a; --card-bg: #13303d; --code-bg: #0f2733;
  --danger: #e0554a; --primary-dark: #5bb3ef;
}
* { box-sizing: border-box; }
html { background: var(--bg) !important; }
body {
  background: var(--bg) !important; color: var(--fg) !important;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
}
h1, h2, h3, .panneau h2 {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  color: var(--cdef) !important; border-color: var(--cdef) !important;
}
.sous-titre, .aide, label { color: var(--cgris) !important; }
.panneau {
  background: var(--card-bg) !important; border: 1px solid var(--border) !important;
  border-left: 1px solid var(--border) !important; border-radius: 14px !important; box-shadow: none !important;
}
input[type=number], input[type=text], select, textarea {
  background: var(--bg) !important; color: var(--fg) !important; border: 1px solid var(--border) !important;
}
button {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  background: var(--cdef) !important; color: #ffffff !important; border-radius: 8px !important; border: none !important;
}
button:hover { background: var(--primary-dark) !important; }
.erreur { color: var(--danger) !important; }
table.res, table.res th, table.res td { border-color: var(--border) !important; }
table.res th { background: var(--card-bg) !important; }
.valeur { background: var(--cdef) !important; color: #ffffff !important; }
.valeur.ok { background: var(--cex) !important; }
.valeur.ko { background: var(--danger) !important; }
</style>
</head>
<body>

<h1>Chapitre 18 — Mise en œuvre sur Python</h1>
<p class="sous-titre">Calculatrice interactive — convention de kurtosis, test de Christoffersen complet, expected shortfall</p>

<div class="panneau">
  <h2>Kurtosis excédentaire ou de Pearson ?</h2>
  <div class="ligne">
    <div><label for="kurtInput18">valeur lue</label><input type="number" id="kurtInput18" value="3.05" step="0.01"></div>
    <div><label for="kurtType18">cette valeur est</label>
      <select id="kurtType18">
        <option value="excedentaire">excédentaire (scipy, fisher=True par défaut)</option>
        <option value="pearson">de Pearson (fisher=False, ou R/moments)</option>
      </select>
    </div>
  </div>
  <button onclick="calculerKurtosis()">Convertir et interpréter</button>
  <div id="resultatKurtosis" class="resultat-zone"></div>
</div>

<div class="panneau">
  <h2>Test de Christoffersen complet, à partir des comptages de transition</h2>
  <div class="ligne">
    <div><label for="n00_18">n₀₀</label><input type="number" id="n00_18" value="489" step="1" min="0"></div>
    <div><label for="n01_18">n₀₁</label><input type="number" id="n01_18" value="5" step="1" min="0"></div>
    <div><label for="n10_18">n₁₀</label><input type="number" id="n10_18" value="5" step="1" min="0"></div>
    <div><label for="n11_18">n₁₁</label><input type="number" id="n11_18" value="0" step="1" min="0"></div>
    <div><label for="alpha18">α</label><input type="number" id="alpha18" value="0.01" step="0.001" min="0.0001" max="0.5"></div>
  </div>
  <button onclick="calculerChristoffersen()">Calculer LR_uc, LR_ind, LR_cc</button>
  <div id="resultatChristoffersen" class="resultat-zone"></div>
</div>

<div class="panneau">
  <h2>Expected shortfall contre VaR</h2>
  <label for="tailES18">valeurs de la queue (sous le seuil), séparées par des virgules</label>
  <textarea id="tailES18" rows="2">-3.8, -3.2, -3.0, -2.9</textarea>
  <div class="ligne">
    <div><label for="varCompare18">VaR de comparaison (seuil plus sévère)</label><input type="number" id="varCompare18" value="-2.75" step="0.01"></div>
  </div>
  <button onclick="calculerESvsVaR()">Comparer</button>
  <div id="resultatESvsVaR" class="resultat-zone"></div>
</div>

<script>
function logGamma(x) {
  const g = 7;
  const p = [
    0.99999999999980993, 676.5203681218851, -1259.1392167224028,
    771.32342877765313, -176.61502916214059, 12.507343278686905,
    -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7
  ];
  if (x < 0.5) return Math.log(Math.PI / Math.sin(Math.PI * x)) - logGamma(1 - x);
  x -= 1;
  let a = p[0];
  const t = x + g + 0.5;
  for (let i = 1; i < g + 2; i++) a += p[i] / (x + i);
  return 0.5 * Math.log(2 * Math.PI) + (x + 0.5) * Math.log(t) - t + Math.log(a);
}
function gammaincLower(a, x) {
  if (x <= 0) return 0;
  if (x < a + 1) {
    let sum = 1 / a, term = sum, n = a;
    for (let i = 0; i < 500; i++) {
      n += 1; term *= x / n; sum += term;
      if (Math.abs(term) < Math.abs(sum) * 1e-15) break;
    }
    return sum * Math.exp(-x + a * Math.log(x) - logGamma(a));
  } else {
    let b = x + 1 - a, c = 1e300, d = 1 / b, h = d;
    for (let i = 1; i < 500; i++) {
      const an = -i * (i - a);
      b += 2;
      d = an * d + b; if (Math.abs(d) < 1e-300) d = 1e-300;
      c = b + an / c; if (Math.abs(c) < 1e-300) c = 1e-300;
      d = 1 / d;
      const del = d * c; h *= del;
      if (Math.abs(del - 1) < 1e-15) break;
    }
    const Q = Math.exp(-x + a * Math.log(x) - logGamma(a)) * h;
    return 1 - Q;
  }
}
function chi2cdf(x, k) { return gammaincLower(k / 2, x / 2); }
function chi2crit(k, alpha) {
  let lo = 0, hi = k + 20 * Math.sqrt(2 * k) + 50;
  for (let i = 0; i < 100; i++) {
    const mid = (lo + hi) / 2;
    const p = 1 - chi2cdf(mid, k);
    if (p > alpha) lo = mid; else hi = mid;
  }
  return (lo + hi) / 2;
}

function calculerKurtosis() {
  const resDiv = document.getElementById('resultatKurtosis');
  const val = parseFloat(document.getElementById('kurtInput18').value);
  const type = document.getElementById('kurtType18').value;
  if (isNaN(val)) {
    resDiv.innerHTML = '<p class="erreur">Valeur invalide.</p>';
    return;
  }
  const pearson = type === 'excedentaire' ? val + 3 : val;
  const excedentaire = type === 'excedentaire' ? val : val - 3;
  let out = `<div class="valeur">kurtosis excédentaire = ${excedentaire.toFixed(2)}</div>`;
  out += `<div class="valeur">kurtosis de Pearson = ${pearson.toFixed(2)}</div>`;
  out += `<div class="valeur ${pearson > 3.2 ? 'ko' : 'ok'}">${pearson > 3.2 ? 'queues épaisses (leptokurtique)' : 'proche des queues normales'}</div>`;
  resDiv.innerHTML = out;
}

function calculerChristoffersen() {
  const resDiv = document.getElementById('resultatChristoffersen');
  const n00 = parseFloat(document.getElementById('n00_18').value);
  const n01 = parseFloat(document.getElementById('n01_18').value);
  const n10 = parseFloat(document.getElementById('n10_18').value);
  const n11 = parseFloat(document.getElementById('n11_18').value);
  const alpha = parseFloat(document.getElementById('alpha18').value);
  if ([n00, n01, n10, n11, alpha].some(isNaN) || n00 < 0 || n01 < 0 || n10 < 0 || n11 < 0 || alpha <= 0 || alpha >= 1) {
    resDiv.innerHTML = '<p class="erreur">Valeurs invalides.</p>';
    return;
  }
  const n = n00 + n01 + n10 + n11;
  const n1 = n01 + n11;
  const piHat = n1 / n;
  let LRuc;
  if (n1 === 0) LRuc = -2 * (n * Math.log(1 - alpha));
  else if (n1 === n) LRuc = -2 * (n * Math.log(alpha));
  else {
    const logL0 = (n - n1) * Math.log(1 - alpha) + n1 * Math.log(alpha);
    const logL1 = (n - n1) * Math.log(1 - piHat) + n1 * Math.log(piHat);
    LRuc = -2 * (logL0 - logL1);
  }
  const p01 = (n00 + n01) > 0 ? n01 / (n00 + n01) : 0;
  const p11 = (n10 + n11) > 0 ? n11 / (n10 + n11) : 0;
  const p = n1 / n;
  const lg = x => x > 0 ? Math.log(x) : 0;
  const col0 = n00 + n10, col1 = n01 + n11;
  const LRind = -2 * ((col0 * lg(1 - p) + col1 * lg(p)) - (n00 * lg(1 - p01) + n01 * lg(p01) + n10 * lg(1 - p11) + n11 * lg(p11)));
  const LRcc = LRuc + LRind;
  const crit1 = chi2crit(1, 0.05);
  const crit2 = chi2crit(2, 0.05);
  let out = `<div class="valeur">π̂ = ${piHat.toFixed(4)}, π̂₀₁ = ${p01.toFixed(4)}, π̂₁₁ = ${p11.toFixed(4)}</div>`;
  out += '<table class="res"><tr><th>test</th><th>statistique</th><th>crit. (5%)</th><th>verdict</th></tr>';
  out += `<tr><td>Kupiec, χ²₁</td><td>${LRuc.toFixed(3)}</td><td>${crit1.toFixed(3)}</td><td>${LRuc > crit1 ? 'rejetée' : 'acceptée'}</td></tr>`;
  out += `<tr><td>Christoffersen, χ²₁</td><td>${LRind.toFixed(3)}</td><td>${crit1.toFixed(3)}</td><td>${LRind > crit1 ? 'rejetée' : 'acceptée'}</td></tr>`;
  out += `<tr><td>conjoint LR_cc, χ²₂</td><td>${LRcc.toFixed(3)}</td><td>${crit2.toFixed(3)}</td><td>${LRcc > crit2 ? 'rejetée' : 'acceptée'}</td></tr>`;
  out += '</table>';
  resDiv.innerHTML = out;
}

function calculerESvsVaR() {
  const resDiv = document.getElementById('resultatESvsVaR');
  const tail = document.getElementById('tailES18').value.split(',').map(s => parseFloat(s.trim())).filter(v => !isNaN(v));
  const varComp = parseFloat(document.getElementById('varCompare18').value);
  if (tail.length === 0 || isNaN(varComp)) {
    resDiv.innerHTML = '<p class="erreur">Valeurs invalides.</p>';
    return;
  }
  const ES = tail.reduce((a, b) => a + b, 0) / tail.length;
  let out = `<div class="valeur">ES (moyenne de la queue) = ${ES.toFixed(3)}</div>`;
  out += `<div class="valeur">VaR de comparaison = ${varComp.toFixed(3)}</div>`;
  out += `<div class="valeur ${Math.abs(ES) > Math.abs(varComp) ? 'ko' : 'ok'}">${Math.abs(ES) > Math.abs(varComp) ? '|ES| > |VaR| : la queue est plus sévère que le seuil de comparaison' : '|ES| ≤ |VaR|'}</div>`;
  resDiv.innerHTML = out;
}

window.onload = () => { calculerKurtosis(); calculerChristoffersen(); calculerESvsVaR(); };
</script>
</body>
</html>
