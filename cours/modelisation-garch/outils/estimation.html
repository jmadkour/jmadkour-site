<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapitre 13 — L'estimation par quasi-maximum de vraisemblance — Calculatrice interactive</title>
<style>
  :root { --cdef: #4A3B8C; --cintu: #E08000; --cex: #2E8B57; --ceco: #1F6FB2; --cgris: #5A5A5A; }
  * { box-sizing: border-box; }
  body { font-family: Georgia, "TeX Gyre Pagella", serif; background: #FDFDFD; color: #1a1a1a; max-width: 1150px; margin: 0 auto; padding: 1.5em; }
  h1 { font-family: "Helvetica Neue", Arial, sans-serif; color: var(--cdef); font-size: 1.5em; border-bottom: 2px solid var(--cdef); padding-bottom: 0.3em; }
  .sous-titre { color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; margin-top: -0.6em; }
  .panneau { background: white; border-left: 4px solid var(--cdef); border-radius: 6px; padding: 1em 1.2em; margin: 1em 0; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .panneau h2 { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 1.05em; color: var(--cdef); margin-top: 0; }
  label { display: block; margin: 0.6em 0 0.2em; font-size: 0.92em; color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; }
  input[type=number] { width: 100%; padding: 0.5em; border: 1px solid #ccc; border-radius: 4px; font-family: "Courier New", monospace; font-size: 0.9em; }
  textarea { width: 100%; padding: 0.5em; border: 1px solid #ccc; border-radius: 4px; font-family: "Courier New", monospace; font-size: 0.9em; resize: vertical; min-height: 2.4em; }
  .ligne { display: flex; gap: 1em; flex-wrap: wrap; align-items: flex-start; }
  .ligne > div { flex: 1; min-width: 150px; }
  button { margin-top: 1em; background: var(--cdef); color: white; border: none; padding: 0.6em 1.4em; border-radius: 5px; font-family: "Helvetica Neue", Arial, sans-serif; font-weight: bold; cursor: pointer; font-size: 0.95em; }
  button:hover { background: #3a2d70; }
  .erreur { color: #b00020; font-family: "Helvetica Neue", Arial, sans-serif; font-size: 0.9em; margin-top: 0.6em; }
  .resultat-zone { margin-top: 1em; font-family: "Helvetica Neue", Arial, sans-serif; }
  .aide { font-size: 0.85em; color: var(--cgris); margin-top: 0; }
  table.res { border-collapse: collapse; font-family: "Courier New", monospace; font-size: 0.85em; margin-top: 0.6em; width: 100%; }
  table.res th, table.res td { border: 1px solid #ccc; padding: 0.3em 0.6em; text-align: center; }
  .valeur { font-size: 1.02em; padding: 0.4em 0.7em; background: var(--cdef); color: white; border-radius: 5px; display: inline-block; margin: 0.2em 0.3em 0.2em 0; }
  .valeur.ok { background: var(--cex); }
  .valeur.ko { background: #b00020; }
</style>
</head>
<body>

<h1>Chapitre 13 — L'estimation par quasi-maximum de vraisemblance</h1>
<p class="sous-titre">Calculatrice interactive — log-vraisemblance gaussienne, oubli de l'initialisation, écarts-types robustes</p>

<div class="panneau">
  <h2>Log-vraisemblance gaussienne</h2>
  <label for="pairesHEps">paires (h_t, ε_t) séparées par des points-virgules, ex. 1.2,0.8; 1.5,-2.1</label>
  <textarea id="pairesHEps" rows="2">1.2,0.8; 1.5,-2.1; 0.9,0.3</textarea>
  <button onclick="calculerLogVrais()">Calculer ln L</button>
  <div id="resultatLogVrais" class="resultat-zone"></div>
</div>

<div class="panneau">
  <h2>Oubli de l'initialisation h₁</h2>
  <div class="ligne">
    <div><label for="beta1Init">β₁</label><input type="number" id="beta1Init" value="0.89" step="0.001" min="0.001" max="0.999"></div>
    <div><label for="seuilInit">seuil à atteindre (fraction)</label><input type="number" id="seuilInit" value="0.01" step="0.001" min="0.0001" max="0.99"></div>
  </div>
  <button onclick="calculerOubliInit()">Calculer le nombre de périodes nécessaire</button>
  <div id="resultatOubliInit" class="resultat-zone"></div>
</div>

<div class="panneau">
  <h2>Écart-type robuste contre non robuste</h2>
  <div class="ligne">
    <div><label for="coefHat">coefficient estimé</label><input type="number" id="coefHat" value="0.045" step="0.001"></div>
    <div><label for="seNonRobuste">écart-type non robuste</label><input type="number" id="seNonRobuste" value="0.020" step="0.001" min="0.0001"></div>
    <div><label for="inflationPct">majoration robuste (%)</label><input type="number" id="inflationPct" value="30" step="1" min="0"></div>
  </div>
  <button onclick="calculerRobuste()">Comparer les deux tests</button>
  <div id="resultatRobuste" class="resultat-zone"></div>
</div>

<script>
function calculerLogVrais() {
  const resDiv = document.getElementById('resultatLogVrais');
  const paires = document.getElementById('pairesHEps').value.split(';')
    .map(s => s.trim()).filter(s => s.length > 0)
    .map(s => s.split(',').map(v => parseFloat(v.trim())));
  if (paires.length === 0 || paires.some(p => p.length !== 2 || p.some(isNaN) || p[0] <= 0)) {
    resDiv.innerHTML = '<p class="erreur">Format invalide (h_t doit être positif).</p>';
    return;
  }
  const T = paires.length;
  let sumTerm = 0;
  let out = '<table class="res"><tr><th>t</th><th>h_t</th><th>ε_t</th><th>ln(h_t)</th><th>ε_t²/h_t</th></tr>';
  paires.forEach((p, i) => {
    const [h, eps] = p;
    const lnH = Math.log(h);
    const ratio = (eps * eps) / h;
    sumTerm += lnH + ratio;
    out += `<tr><td>${i + 1}</td><td>${h}</td><td>${eps}</td><td>${lnH.toFixed(4)}</td><td>${ratio.toFixed(4)}</td></tr>`;
  });
  out += '</table>';
  const lnL = -T / 2 * Math.log(2 * Math.PI) - 0.5 * sumTerm;
  out += `<div class="valeur">T = ${T}</div>`;
  out += `<div class="valeur">Σ[ln h_t + ε_t²/h_t] = ${sumTerm.toFixed(4)}</div>`;
  out += `<div class="valeur">ln L = ${lnL.toFixed(4)}</div>`;
  resDiv.innerHTML = out;
}

function calculerOubliInit() {
  const resDiv = document.getElementById('resultatOubliInit');
  const beta1 = parseFloat(document.getElementById('beta1Init').value);
  const seuil = parseFloat(document.getElementById('seuilInit').value);
  if (isNaN(beta1) || beta1 <= 0 || beta1 >= 1 || isNaN(seuil) || seuil <= 0 || seuil >= 1) {
    resDiv.innerHTML = '<p class="erreur">Valeurs invalides (0 &lt; β₁ &lt; 1, 0 &lt; seuil &lt; 1).</p>';
    return;
  }
  const t = Math.log(seuil) / Math.log(beta1);
  let out = `<div class="valeur">périodes nécessaires t = ln(${seuil})/ln(${beta1}) ≈ ${t.toFixed(1)}</div>`;
  out += `<div class="valeur">vérification : β₁^${Math.ceil(t)} = ${Math.pow(beta1, Math.ceil(t)).toFixed(5)}</div>`;
  resDiv.innerHTML = out;
}

function calculerRobuste() {
  const resDiv = document.getElementById('resultatRobuste');
  const coef = parseFloat(document.getElementById('coefHat').value);
  const seNR = parseFloat(document.getElementById('seNonRobuste').value);
  const inflation = parseFloat(document.getElementById('inflationPct').value);
  if ([coef, seNR, inflation].some(isNaN) || seNR <= 0 || inflation < 0) {
    resDiv.innerHTML = '<p class="erreur">Valeurs invalides.</p>';
    return;
  }
  const tNR = coef / seNR;
  const seR = seNR * (1 + inflation / 100);
  const tR = coef / seR;
  const critique = 1.96;
  let out = `<div class="valeur">t (non robuste) = ${tNR.toFixed(3)}</div>`;
  out += `<div class="valeur ${Math.abs(tNR) > critique ? 'ok' : 'ko'}">${Math.abs(tNR) > critique ? 'significatif' : 'non significatif'} (non robuste)</div>`;
  out += `<div class="valeur">écart-type robuste = ${seR.toFixed(4)}</div>`;
  out += `<div class="valeur">t (robuste) = ${tR.toFixed(3)}</div>`;
  out += `<div class="valeur ${Math.abs(tR) > critique ? 'ok' : 'ko'}">${Math.abs(tR) > critique ? 'significatif' : 'non significatif'} (robuste)</div>`;
  if ((Math.abs(tNR) > critique) !== (Math.abs(tR) > critique)) {
    out += `<div class="valeur ko">la conclusion bascule selon l'écart-type utilisé !</div>`;
  }
  resDiv.innerHTML = out;
}

window.onload = () => { calculerLogVrais(); calculerOubliInit(); calculerRobuste(); };
</script>
</body>
</html>
