<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapitre 10 — L'effet de levier et l'EGARCH de Nelson — Calculatrice interactive</title>
<style>
  :root { --cdef: #4A3B8C; --cintu: #E08000; --cex: #2E8B57; --ceco: #1F6FB2; --cgris: #5A5A5A; }
  * { box-sizing: border-box; }
  body { font-family: Georgia, "TeX Gyre Pagella", serif; background: #FDFDFD; color: #1a1a1a; max-width: 1150px; margin: 0 auto; padding: 1.5em; }
  h1 { font-family: "Helvetica Neue", Arial, sans-serif; color: var(--cdef); font-size: 1.5em; border-bottom: 2px solid var(--cdef); padding-bottom: 0.3em; }
  .sous-titre { color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; margin-top: -0.6em; }
  .panneau { background: white; border-left: 4px solid var(--cdef); border-radius: 6px; padding: 1em 1.2em; margin: 1em 0; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .panneau h2 { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 1.05em; color: var(--cdef); margin-top: 0; }
  label { display: block; margin: 0.6em 0 0.2em; font-size: 0.92em; color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; }
  input[type=number] { width: 100%; padding: 0.5em; border: 1px solid #ccc; border-radius: 4px; font-family: "Courier New", monospace; font-size: 0.9em; }
  .ligne { display: flex; gap: 1em; flex-wrap: wrap; align-items: flex-start; }
  .ligne > div { flex: 1; min-width: 150px; }
  button { margin-top: 1em; background: var(--cdef); color: white; border: none; padding: 0.6em 1.4em; border-radius: 5px; font-family: "Helvetica Neue", Arial, sans-serif; font-weight: bold; cursor: pointer; font-size: 0.95em; }
  button:hover { background: #3a2d70; }
  .erreur { color: #b00020; font-family: "Helvetica Neue", Arial, sans-serif; font-size: 0.9em; margin-top: 0.6em; }
  .resultat-zone { margin-top: 1em; font-family: "Helvetica Neue", Arial, sans-serif; }
  .aide { font-size: 0.85em; color: var(--cgris); margin-top: 0; }
  table.res { border-collapse: collapse; font-family: "Courier New", monospace; font-size: 0.85em; margin-top: 0.6em; width: 100%; }
  table.res th, table.res td { border: 1px solid #ccc; padding: 0.3em 0.6em; text-align: center; }
  .valeur { font-size: 1.02em; padding: 0.4em 0.7em; background: var(--cdef); color: white; border-radius: 5px; display: inline-block; margin: 0.2em 0.3em 0.2em 0; }
  .valeur.ok { background: var(--cex); }
  .valeur.ko { background: #b00020; }
</style>
</head>
<body>

<h1>Chapitre 10 — L'effet de levier et l'EGARCH de Nelson</h1>
<p class="sous-titre">Calculatrice interactive — asymétrie de la courbe d'impact, stationnarité, test de l'effet de levier</p>

<div class="panneau">
  <h2>Décomposition d'un choc EGARCH</h2>
  <div class="ligne">
    <div><label for="alphaE">α₁</label><input type="number" id="alphaE" value="0.16" step="0.001"></div>
    <div><label for="lambdaE">λ</label><input type="number" id="lambdaE" value="-0.09" step="0.001"></div>
    <div><label for="zChoc">z (choc standardisé)</label><input type="number" id="zChoc" value="2" step="0.1"></div>
  </div>
  <button onclick="calculerChocEgarch()">Calculer l'effet sur ln h_t et sur h_t</button>
  <div id="resultatChocEgarch" class="resultat-zone"></div>
</div>

<div class="panneau">
  <h2>Stationnarité de l'EGARCH</h2>
  <div class="ligne">
    <div><label for="betaE">β₁</label><input type="number" id="betaE" value="0.97" step="0.001"></div>
  </div>
  <button onclick="calculerStationnariteE()">Vérifier |β₁| &lt; 1</button>
  <div id="resultatStationnariteE" class="resultat-zone"></div>
</div>

<div class="panneau">
  <h2>Tester l'effet de levier (H₀ : λ=0 contre H₁ : λ&lt;0)</h2>
  <div class="ligne">
    <div><label for="lambdaHat">λ̂ estimé</label><input type="number" id="lambdaHat" value="-0.09" step="0.001"></div>
    <div><label for="seLambda">écart-type estimé</label><input type="number" id="seLambda" value="0.03" step="0.001" min="0.0001"></div>
  </div>
  <button onclick="calculerTestLevier()">Calculer la statistique de test</button>
  <div id="resultatTestLevier" class="resultat-zone"></div>
</div>

<script>
function calculerChocEgarch() {
  const resDiv = document.getElementById('resultatChocEgarch');
  const alpha1 = parseFloat(document.getElementById('alphaE').value);
  const lambda = parseFloat(document.getElementById('lambdaE').value);
  const z = parseFloat(document.getElementById('zChoc').value);
  if ([alpha1, lambda, z].some(isNaN)) {
    resDiv.innerHTML = '<p class="erreur">Valeurs invalides.</p>';
    return;
  }
  const variation = alpha1 * Math.abs(z) + lambda * z;
  const facteur = Math.exp(variation);
  const variationOppose = alpha1 * Math.abs(z) - lambda * z;
  const facteurOppose = Math.exp(variationOppose);
  const ratioAugmentation = (facteur - 1) / (facteurOppose - 1);
  let out = `<div class="valeur">variation de ln h_t (ce choc) = ${variation.toFixed(4)}</div>`;
  out += `<div class="valeur">facteur multiplicatif de h_t = ${facteur.toFixed(4)}</div>`;
  out += `<div class="valeur">facteur pour le choc de signe opposé = ${facteurOppose.toFixed(4)}</div>`;
  if (facteur !== facteurOppose) {
    out += `<div class="valeur">rapport des augmentations (ce choc / signe opposé) = ${ratioAugmentation.toFixed(3)}</div>`;
  }
  resDiv.innerHTML = out;
}

function calculerStationnariteE() {
  const resDiv = document.getElementById('resultatStationnariteE');
  const beta1 = parseFloat(document.getElementById('betaE').value);
  if (isNaN(beta1)) {
    resDiv.innerHTML = '<p class="erreur">Valeur invalide.</p>';
    return;
  }
  const stationnaire = Math.abs(beta1) < 1;
  let out = `<div class="valeur">|β₁| = ${Math.abs(beta1).toFixed(4)}</div>`;
  out += `<div class="valeur ${stationnaire ? 'ok' : 'ko'}">${stationnaire ? 'stationnaire' : 'non stationnaire'}</div>`;
  out += `<div class="aide">Rappel : contrairement au GARCH, aucune contrainte de signe n'est requise sur α₁ ni λ — la positivité de h_t est assurée par l'exponentielle.</div>`;
  resDiv.innerHTML = out;
}

function calculerTestLevier() {
  const resDiv = document.getElementById('resultatTestLevier');
  const lambdaHat = parseFloat(document.getElementById('lambdaHat').value);
  const se = parseFloat(document.getElementById('seLambda').value);
  if ([lambdaHat, se].some(isNaN) || se <= 0) {
    resDiv.innerHTML = '<p class="erreur">Valeurs invalides (écart-type &gt; 0).</p>';
    return;
  }
  const tStat = lambdaHat / se;
  const critique = -1.645;
  const rejet = tStat < critique;
  let out = `<div class="valeur">t = λ̂/écart-type = ${tStat.toFixed(3)}</div>`;
  out += `<div class="valeur">valeur critique (5%, unilatéral) = ${critique}</div>`;
  out += `<div class="valeur ${rejet ? 'ok' : 'ko'}">${rejet ? 'rejet de H₀ : effet de levier confirmé' : 'non-rejet de H₀ : pas d\'effet de levier détecté'}</div>`;
  resDiv.innerHTML = out;
}

window.onload = () => { calculerChocEgarch(); calculerStationnariteE(); calculerTestLevier(); };
</script>
</body>
</html>
