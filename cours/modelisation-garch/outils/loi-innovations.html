<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapitre 9 — La loi des innovations — Calculatrice interactive</title>
<style>
  :root { --cdef: #4A3B8C; --cintu: #E08000; --cex: #2E8B57; --ceco: #1F6FB2; --cgris: #5A5A5A; }
  * { box-sizing: border-box; }
  body { font-family: Georgia, "TeX Gyre Pagella", serif; background: #FDFDFD; color: #1a1a1a; max-width: 1150px; margin: 0 auto; padding: 1.5em; }
  h1 { font-family: "Helvetica Neue", Arial, sans-serif; color: var(--cdef); font-size: 1.5em; border-bottom: 2px solid var(--cdef); padding-bottom: 0.3em; }
  .sous-titre { color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; margin-top: -0.6em; }
  .panneau { background: white; border-left: 4px solid var(--cdef); border-radius: 6px; padding: 1em 1.2em; margin: 1em 0; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .panneau h2 { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 1.05em; color: var(--cdef); margin-top: 0; }
  label { display: block; margin: 0.6em 0 0.2em; font-size: 0.92em; color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; }
  input[type=number] { width: 100%; padding: 0.5em; border: 1px solid #ccc; border-radius: 4px; font-family: "Courier New", monospace; font-size: 0.9em; }
  .ligne { display: flex; gap: 1em; flex-wrap: wrap; align-items: flex-start; }
  .ligne > div { flex: 1; min-width: 150px; }
  button { margin-top: 1em; background: var(--cdef); color: white; border: none; padding: 0.6em 1.4em; border-radius: 5px; font-family: "Helvetica Neue", Arial, sans-serif; font-weight: bold; cursor: pointer; font-size: 0.95em; }
  button:hover { background: #3a2d70; }
  .erreur { color: #b00020; font-family: "Helvetica Neue", Arial, sans-serif; font-size: 0.9em; margin-top: 0.6em; }
  .resultat-zone { margin-top: 1em; font-family: "Helvetica Neue", Arial, sans-serif; }
  .aide { font-size: 0.85em; color: var(--cgris); margin-top: 0; }
  table.res { border-collapse: collapse; font-family: "Courier New", monospace; font-size: 0.85em; margin-top: 0.6em; width: 100%; }
  table.res th, table.res td { border: 1px solid #ccc; padding: 0.3em 0.6em; text-align: center; }
  .valeur { font-size: 1.02em; padding: 0.4em 0.7em; background: var(--cdef); color: white; border-radius: 5px; display: inline-block; margin: 0.2em 0.3em 0.2em 0; }
  .valeur.ok { background: var(--cex); }
  .valeur.ko { background: #b00020; }
</style>
</head>
<body>

<h1>Chapitre 9 — La loi des innovations</h1>
<p class="sous-titre">Calculatrice interactive — kurtosis de la Student, gain de BIC, écart de VaR et de capital selon la loi choisie</p>

<div class="panneau">
  <h2>Kurtosis de la Student : formule directe et inverse</h2>
  <div class="ligne">
    <div><label for="nuDirect">ν (degrés de liberté)</label><input type="number" id="nuDirect" value="6.46" step="0.01" min="4.001"></div>
    <div><label for="kappaCible">κ_z cible (pour l'inversion)</label><input type="number" id="kappaCible" value="4.66" step="0.01" min="3.0001"></div>
  </div>
  <button onclick="calculerStudentKurtosis()">Calculer κ_z(ν) et ν(κ_z)</button>
  <div id="resultatStudentKurtosis" class="resultat-zone"></div>
</div>

<div class="panneau">
  <h2>Le gain de BIC d'un paramètre supplémentaire</h2>
  <div class="ligne">
    <div><label for="bicA">BIC (modèle simple, ex. normale)</label><input type="number" id="bicA" value="7117.8" step="0.1"></div>
    <div><label for="bicB">BIC (modèle enrichi, ex. Student)</label><input type="number" id="bicB" value="7021.1" step="0.1"></div>
    <div><label for="Tobs">T (nombre d'observations)</label><input type="number" id="Tobs" value="2500" step="1" min="2"></div>
  </div>
  <button onclick="calculerBic()">Comparer le gain à la pénalité ln(T)</button>
  <div id="resultatBic" class="resultat-zone"></div>
</div>

<div class="panneau">
  <h2>Écart de VaR et de capital selon la loi choisie</h2>
  <div class="ligne">
    <div><label for="qNorm">|z₀.₀₁| loi normale</label><input type="number" id="qNorm" value="2.33" step="0.01" min="0"></div>
    <div><label for="qAutre">|z₀.₀₁| autre loi (Student ou asymétrique)</label><input type="number" id="qAutre" value="3.09" step="0.01" min="0"></div>
    <div><label for="sigmaVar">σ journalière</label><input type="number" id="sigmaVar" value="0.015" step="0.001" min="0"></div>
    <div><label for="notionnel">notionnel (MAD)</label><input type="number" id="notionnel" value="500000000" step="1000000" min="0"></div>
  </div>
  <button onclick="calculerVar()">Calculer les deux VaR et l'écart de capital</button>
  <div id="resultatVar" class="resultat-zone"></div>
</div>

<script>
function kappaStudent(nu) { return 3 * (nu - 2) / (nu - 4); }
function nuFromKappa(kappa) { return (4 * kappa - 6) / (kappa - 3); }

function calculerStudentKurtosis() {
  const resDiv = document.getElementById('resultatStudentKurtosis');
  const nu = parseFloat(document.getElementById('nuDirect').value);
  const kappaCible = parseFloat(document.getElementById('kappaCible').value);
  if (isNaN(nu) || nu <= 4 || isNaN(kappaCible) || kappaCible <= 3) {
    resDiv.innerHTML = '<p class="erreur">ν doit être &gt; 4, κ_z cible doit être &gt; 3.</p>';
    return;
  }
  const kappaDeNu = kappaStudent(nu);
  const nuDeKappa = nuFromKappa(kappaCible);
  let out = `<div class="valeur">κ_z(ν=${nu}) = ${kappaDeNu.toFixed(4)}</div>`;
  out += `<div class="valeur">ν nécessaire pour κ_z=${kappaCible} = ${nuDeKappa.toFixed(4)}</div>`;
  out += `<div class="valeur">vérification : κ_z(${nuDeKappa.toFixed(4)}) = ${kappaStudent(nuDeKappa).toFixed(4)}</div>`;
  resDiv.innerHTML = out;
}

function calculerBic() {
  const resDiv = document.getElementById('resultatBic');
  const bicA = parseFloat(document.getElementById('bicA').value);
  const bicB = parseFloat(document.getElementById('bicB').value);
  const T = parseFloat(document.getElementById('Tobs').value);
  if ([bicA, bicB, T].some(isNaN) || T <= 1) {
    resDiv.innerHTML = '<p class="erreur">Valeurs invalides.</p>';
    return;
  }
  const gain = bicA - bicB;
  const penalite = Math.log(T);
  const justifie = gain > 10;
  let out = `<div class="valeur">écart de BIC = ${gain.toFixed(2)}</div>`;
  out += `<div class="valeur">pénalité ln(T) pour un paramètre = ${penalite.toFixed(3)}</div>`;
  out += `<div class="valeur">rapport gain / pénalité = ${(gain / penalite).toFixed(2)}</div>`;
  out += `<div class="valeur ${justifie ? 'ok' : 'ko'}">${justifie ? 'gain largement au-dessus du seuil usuel de 10' : 'gain sous le seuil usuel de 10'}</div>`;
  resDiv.innerHTML = out;
}

function calculerVar() {
  const resDiv = document.getElementById('resultatVar');
  const qNorm = parseFloat(document.getElementById('qNorm').value);
  const qAutre = parseFloat(document.getElementById('qAutre').value);
  const sigma = parseFloat(document.getElementById('sigmaVar').value);
  const notionnel = parseFloat(document.getElementById('notionnel').value);
  if ([qNorm, qAutre, sigma, notionnel].some(isNaN) || qNorm <= 0 || qAutre <= 0 || sigma <= 0 || notionnel <= 0) {
    resDiv.innerHTML = '<p class="erreur">Valeurs invalides (toutes strictement positives).</p>';
    return;
  }
  const varNorm = qNorm * sigma * notionnel;
  const varAutre = qAutre * sigma * notionnel;
  const ecart = varAutre - varNorm;
  const ecartPct = (varAutre / varNorm - 1) * 100;
  let out = `<div class="valeur">VaR (loi normale) = ${varNorm.toLocaleString('fr-FR', { maximumFractionDigits: 0 })} MAD</div>`;
  out += `<div class="valeur">VaR (autre loi) = ${varAutre.toLocaleString('fr-FR', { maximumFractionDigits: 0 })} MAD</div>`;
  out += `<div class="valeur">capital supplémentaire = ${ecart.toLocaleString('fr-FR', { maximumFractionDigits: 0 })} MAD</div>`;
  out += `<div class="valeur ${ecartPct > 30 ? 'ok' : ''}">écart relatif = ${ecartPct.toFixed(2)} %</div>`;
  resDiv.innerHTML = out;
}

window.onload = () => { calculerStudentKurtosis(); calculerBic(); calculerVar(); };
</script>
</body>
</html>
