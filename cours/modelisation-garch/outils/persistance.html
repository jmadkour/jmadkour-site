<!DOCTYPE html>
<html lang="fr">
<head>
<script id="jm-theme-detect">
(function () {
  var t = null;
  try { t = localStorage.getItem("jm-theme"); } catch (e) {}
  if (!t) { t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light"; }
  document.documentElement.setAttribute("data-theme", t);
  window.addEventListener("storage", function (e) {
    if (e.key === "jm-theme" && e.newValue) { document.documentElement.setAttribute("data-theme", e.newValue); }
  });
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapitre 7 — Stationnarité, persistance et variance de long terme — Calculatrice interactive</title>
<style>
  :root { --cdef: #1F6FB2; --cintu: #B56600; --cex: #1D9E75; --ceco: #1F6FB2; --cgris: #5A5A5A; }
  * { box-sizing: border-box; }
  body { font-family: Georgia, "TeX Gyre Pagella", serif; background: #FDFDFD; color: #1a1a1a; max-width: 1150px; margin: 0 auto; padding: 1.5em; }
  h1 { font-family: "Helvetica Neue", Arial, sans-serif; color: var(--cdef); font-size: 1.5em; border-bottom: 2px solid var(--cdef); padding-bottom: 0.3em; }
  .sous-titre { color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; margin-top: -0.6em; }
  .panneau { background: white; border-left: 4px solid var(--cdef); border-radius: 6px; padding: 1em 1.2em; margin: 1em 0; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .panneau h2 { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 1.05em; color: var(--cdef); margin-top: 0; }
  label { display: block; margin: 0.6em 0 0.2em; font-size: 0.92em; color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; }
  input[type=number] { width: 100%; padding: 0.5em; border: 1px solid #ccc; border-radius: 4px; font-family: "Courier New", monospace; font-size: 0.9em; }
  textarea { width: 100%; padding: 0.5em; border: 1px solid #ccc; border-radius: 4px; font-family: "Courier New", monospace; font-size: 0.9em; resize: vertical; min-height: 2.4em; }
  .ligne { display: flex; gap: 1em; flex-wrap: wrap; align-items: flex-start; }
  .ligne > div { flex: 1; min-width: 150px; }
  button { margin-top: 1em; background: var(--cdef); color: white; border: none; padding: 0.6em 1.4em; border-radius: 5px; font-family: "Helvetica Neue", Arial, sans-serif; font-weight: bold; cursor: pointer; font-size: 0.95em; }
  button:hover { background: #17578f; }
  .erreur { color: #b00020; font-family: "Helvetica Neue", Arial, sans-serif; font-size: 0.9em; margin-top: 0.6em; }
  .resultat-zone { margin-top: 1em; font-family: "Helvetica Neue", Arial, sans-serif; }
  .aide { font-size: 0.85em; color: var(--cgris); margin-top: 0; }
  table.res { border-collapse: collapse; font-family: "Courier New", monospace; font-size: 0.85em; margin-top: 0.6em; width: 100%; }
  table.res th, table.res td { border: 1px solid #ccc; padding: 0.3em 0.6em; text-align: center; }
  .valeur { font-size: 1.02em; padding: 0.4em 0.7em; background: var(--cdef); color: white; border-radius: 5px; display: inline-block; margin: 0.2em 0.3em 0.2em 0; }
  .valeur.ok { background: var(--cex); }
  .valeur.ko { background: #b00020; }
</style>
<style id="jm-theme-override">
/* Surcharge : palette et typographie du site jmadkour.org, synchronisee
   avec son bascule clair/sombre (voir script jm-theme-detect ci-dessus).
   Remplace la palette "polycopie" (violet, serif) utilisee par defaut
   dans le bloc <style> d'origine de cette page. */
:root {
  --cdef: #1f6fb2; --ceco: #1f6fb2; --cex: #1d9e75; --cintu: #b56600; --cgris: #54707f;
  --bg: #ffffff; --fg: #142a38; --border: #dbe6ee; --card-bg: #f6f9fb; --code-bg: #f3f7fa;
  --danger: #b00020; --primary-dark: #17578f;
}
:root[data-theme="dark"] {
  --cdef: #3aa0e6; --ceco: #3aa0e6; --cex: #37b47e; --cintu: #e0954a; --cgris: #9db4c0;
  --bg: #0d1b26; --fg: #e7eef3; --border: #20455a; --card-bg: #13303d; --code-bg: #0f2733;
  --danger: #e0554a; --primary-dark: #5bb3ef;
}
* { box-sizing: border-box; }
html { background: var(--bg) !important; }
body {
  background: var(--bg) !important; color: var(--fg) !important;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
}
h1, h2, h3, .panneau h2 {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  color: var(--cdef) !important; border-color: var(--cdef) !important;
}
.sous-titre, .aide, label { color: var(--cgris) !important; }
.panneau {
  background: var(--card-bg) !important; border: 1px solid var(--border) !important;
  border-left: 1px solid var(--border) !important; border-radius: 14px !important; box-shadow: none !important;
}
input[type=number], input[type=text], select, textarea {
  background: var(--bg) !important; color: var(--fg) !important; border: 1px solid var(--border) !important;
}
button {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  background: var(--cdef) !important; color: #ffffff !important; border-radius: 8px !important; border: none !important;
}
button:hover { background: var(--primary-dark) !important; }
.erreur { color: var(--danger) !important; }
table.res, table.res th, table.res td { border-color: var(--border) !important; }
table.res th { background: var(--card-bg) !important; }
.valeur { background: var(--cdef) !important; color: #ffffff !important; }
.valeur.ok { background: var(--cex) !important; }
.valeur.ko { background: var(--danger) !important; }
</style>
</head>
<body>

<h1>Chapitre 7 — Stationnarité, persistance et variance de long terme</h1>
<p class="sous-titre">Calculatrice interactive — régime de persistance, condition de kurtosis fini, demi-vie d'un choc</p>

<div class="panneau">
  <h2>Persistance, régime et variance de long terme</h2>
  <div class="ligne">
    <div><label for="omegaP">ω</label><input type="number" id="omegaP" value="0.0195" step="0.0001" min="0"></div>
    <div><label for="alphaP">α₁</label><input type="number" id="alphaP" value="0.0995" step="0.0001" min="0"></div>
    <div><label for="betaP">β₁</label><input type="number" id="betaP" value="0.8899" step="0.0001" min="0"></div>
  </div>
  <button onclick="calculerPersistance()">Analyser ce modèle</button>
  <div id="resultatPersistance" class="resultat-zone"></div>
</div>

<div class="panneau">
  <h2>Condition d'existence du kurtosis</h2>
  <div class="ligne">
    <div><label for="alphaK2">α₁</label><input type="number" id="alphaK2" value="0.10" step="0.0001" min="0"></div>
    <div><label for="betaK2">β₁</label><input type="number" id="betaK2" value="0.89" step="0.0001" min="0"></div>
  </div>
  <button onclick="calculerKurtosisGarch()">Tester la condition π² + 2α₁² &lt; 1</button>
  <div id="resultatKurtosisGarch" class="resultat-zone"></div>
</div>

<div class="panneau">
  <h2>Demi-vie d'un choc pour plusieurs valeurs de π</h2>
  <label for="piListe">liste des valeurs de π (séparées par des virgules)</label>
  <textarea id="piListe" rows="2">0.80, 0.90, 0.95, 0.98, 0.99, 0.995</textarea>
  <button onclick="calculerDemiVies()">Calculer les demi-vies</button>
  <div id="resultatDemiVies" class="resultat-zone"></div>
</div>

<script>
function demiVie(pi) { return Math.log(0.5) / Math.log(pi); }

function calculerPersistance() {
  const resDiv = document.getElementById('resultatPersistance');
  const omega = parseFloat(document.getElementById('omegaP').value);
  const alpha1 = parseFloat(document.getElementById('alphaP').value);
  const beta1 = parseFloat(document.getElementById('betaP').value);
  if ([omega, alpha1, beta1].some(isNaN) || omega < 0 || alpha1 < 0 || beta1 < 0) {
    resDiv.innerHTML = '<p class="erreur">Valeurs invalides.</p>';
    return;
  }
  const pi = alpha1 + beta1;
  let regime, out = '';
  if (pi === 0) regime = 'pas d\'effet ARCH (variance constante)';
  else if (pi < 1) regime = 'stationnaire';
  else if (pi === 1) regime = 'IGARCH';
  else regime = 'explosif (non stationnaire)';
  out += `<div class="valeur">π = α₁+β₁ = ${pi.toFixed(4)}</div>`;
  out += `<div class="valeur ${pi < 1 ? 'ok' : 'ko'}">régime : ${regime}</div>`;
  if (pi < 1 && omega > 0) {
    const sigma2 = omega / (1 - pi);
    const dv = demiVie(pi);
    out += `<div class="valeur">σ² = ω/(1−π) = ${sigma2.toFixed(4)}</div>`;
    out += `<div class="valeur">σ = ${Math.sqrt(sigma2).toFixed(4)}</div>`;
    out += `<div class="valeur">demi-vie = ${dv.toFixed(1)} jours (≈ ${(dv / 21).toFixed(2)} mois de bourse)</div>`;
  } else {
    out += `<div class="valeur ko">σ² n'existe pas (variance inconditionnelle infinie ou non définie)</div>`;
  }
  resDiv.innerHTML = out;
}

function calculerKurtosisGarch() {
  const resDiv = document.getElementById('resultatKurtosisGarch');
  const alpha1 = parseFloat(document.getElementById('alphaK2').value);
  const beta1 = parseFloat(document.getElementById('betaK2').value);
  if ([alpha1, beta1].some(isNaN) || alpha1 < 0 || beta1 < 0) {
    resDiv.innerHTML = '<p class="erreur">Valeurs invalides.</p>';
    return;
  }
  const pi = alpha1 + beta1;
  const condition = pi * pi + 2 * alpha1 * alpha1;
  const fini = condition < 1;
  let out = `<div class="valeur">π = ${pi.toFixed(4)}</div>`;
  out += `<div class="valeur">π² + 2α₁² = ${condition.toFixed(5)}</div>`;
  out += `<div class="valeur ${fini ? 'ok' : 'ko'}">kurtosis ${fini ? 'fini' : 'infini'}</div>`;
  if (fini) {
    const kappa = 3 * (1 - pi * pi) / (1 - condition);
    out += `<div class="valeur">κ = 3(1−π²)/(1−π²−2α₁²) = ${kappa.toFixed(2)}</div>`;
  }
  resDiv.innerHTML = out;
}

function calculerDemiVies() {
  const resDiv = document.getElementById('resultatDemiVies');
  const pis = document.getElementById('piListe').value.split(',').map(s => parseFloat(s.trim())).filter(v => !isNaN(v));
  if (pis.length === 0 || pis.some(p => p <= 0 || p >= 1)) {
    resDiv.innerHTML = '<p class="erreur">Toutes les valeurs de π doivent être strictement comprises entre 0 et 1.</p>';
    return;
  }
  let out = '<table class="res"><tr><th>π</th><th>demi-vie (jours)</th><th>mois de bourse (≈21 j)</th></tr>';
  pis.forEach(pi => {
    const dv = demiVie(pi);
    out += `<tr><td>${pi.toFixed(4)}</td><td>${dv.toFixed(1)}</td><td>${(dv / 21).toFixed(2)}</td></tr>`;
  });
  out += '</table>';
  if (pis.length >= 2) {
    const dvFirst = demiVie(pis[0]);
    const dvLast = demiVie(pis[pis.length - 1]);
    out += `<div class="valeur">rapport demi-vie(dernier π)/demi-vie(premier π) = ${(dvLast / dvFirst).toFixed(2)}</div>`;
  }
  resDiv.innerHTML = out;
}

window.onload = () => { calculerPersistance(); calculerKurtosisGarch(); calculerDemiVies(); };
</script>
</body>
</html>
