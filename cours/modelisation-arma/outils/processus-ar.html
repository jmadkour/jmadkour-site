<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapitre 4 — Processus AR(p) — Calculatrice interactive</title>
<style>
  :root { --cdef: #4A3B8C; --cintu: #E08000; --cex: #2E8B57; --ceco: #1F6FB2; --cgris: #5A5A5A; }
  * { box-sizing: border-box; }
  body { font-family: Georgia, "TeX Gyre Pagella", serif; background: #FDFDFD; color: #1a1a1a; max-width: 1150px; margin: 0 auto; padding: 1.5em; }
  h1 { font-family: "Helvetica Neue", Arial, sans-serif; color: var(--cdef); font-size: 1.5em; border-bottom: 2px solid var(--cdef); padding-bottom: 0.3em; }
  .sous-titre { color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; margin-top: -0.6em; }
  .panneau { background: white; border-left: 4px solid var(--cdef); border-radius: 6px; padding: 1em 1.2em; margin: 1em 0; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .panneau h2 { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 1.05em; color: var(--cdef); margin-top: 0; }
  label { display: block; margin: 0.6em 0 0.2em; font-size: 0.92em; color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; }
  input[type=number], textarea { width: 100%; padding: 0.5em; border: 1px solid #ccc; border-radius: 4px; font-family: "Courier New", monospace; font-size: 0.9em; }
  .ligne { display: flex; gap: 1em; flex-wrap: wrap; align-items: flex-start; }
  .ligne > div { flex: 1; min-width: 170px; }
  button { margin-top: 1em; background: var(--cdef); color: white; border: none; padding: 0.6em 1.4em; border-radius: 5px; font-family: "Helvetica Neue", Arial, sans-serif; font-weight: bold; cursor: pointer; font-size: 0.95em; }
  button:hover { background: #3a2d70; }
  .erreur { color: #b00020; font-family: "Helvetica Neue", Arial, sans-serif; font-size: 0.9em; margin-top: 0.6em; }
  .resultat-zone { margin-top: 1em; font-family: "Helvetica Neue", Arial, sans-serif; }
  .aide { font-size: 0.85em; color: var(--cgris); margin-top: 0; }
  table.res { border-collapse: collapse; font-family: "Courier New", monospace; font-size: 0.85em; margin-top: 0.6em; width: 100%; }
  table.res th, table.res td { border: 1px solid #ccc; padding: 0.3em 0.6em; text-align: center; }
  .valeur { font-size: 1.02em; padding: 0.4em 0.7em; background: var(--cdef); color: white; border-radius: 5px; display: inline-block; margin: 0.2em 0.3em 0.2em 0; }
</style>
</head>
<body>

<h1>Chapitre 4 — Les processus autorégressifs AR(p)</h1>
<p class="sous-titre">Calculatrice interactive — simulation AR(1) et réponse à un choc</p>

<div class="panneau">
  <h2>Simuler un AR(1)</h2>
  <div class="ligne">
    <div><label for="theta">θ (constante)</label><input type="number" id="theta" value="2" step="0.1"></div>
    <div><label for="alphaAR1">α</label><input type="number" id="alphaAR1" value="0.6" step="0.01"></div>
    <div><label for="y0AR1">y₀ (valeur initiale)</label><input type="number" id="y0AR1" value="10" step="0.1"></div>
  </div>
  <p class="aide">Chocs ε successifs, un par ligne.</p>
  <textarea id="epsAR1" rows="4">0.5
-0.3
0.8
-0.2</textarea>
  <button onclick="calculerAR1()">Simuler</button>
  <div id="resultatAR1sim" class="resultat-zone"></div>
</div>

<div class="panneau">
  <h2>Réponse à un choc unique (fonction de réponse impulsionnelle)</h2>
  <div class="ligne">
    <div><label for="alphaIRF">α</label><input type="number" id="alphaIRF" value="0.9" step="0.01"></div>
    <div><label for="horizonIRF">Horizon (nombre de périodes)</label><input type="number" id="horizonIRF" value="8" step="1" min="1"></div>
  </div>
  <button onclick="calculerIRF()">Calculer la réponse</button>
  <div id="resultatIRF" class="resultat-zone"></div>
</div>

<script>
function calculerAR1() {
  const resDiv = document.getElementById('resultatAR1sim');
  const theta = parseFloat(document.getElementById('theta').value);
  const alpha = parseFloat(document.getElementById('alphaAR1').value);
  let y = parseFloat(document.getElementById('y0AR1').value);
  const eps = document.getElementById('epsAR1').value.trim().split('\n').filter(l => l.trim().length).map(l => parseFloat(l.trim()));
  if ([theta, alpha, y].some(isNaN) || eps.some(isNaN)) { resDiv.innerHTML = '<p class="erreur">Valeurs invalides.</p>'; return; }
  let out = '<table class="res"><tr><th>t</th><th>ε_t</th><th>y_t</th></tr>';
  eps.forEach((e, i) => {
    y = theta + alpha * y + e;
    out += `<tr><td>${i+1}</td><td>${e}</td><td>${y.toFixed(4)}</td></tr>`;
  });
  out += '</table>';
  if (Math.abs(alpha) < 1) {
    const mu = theta / (1 - alpha);
    out += `<div class="valeur">μ (moyenne de long terme) = ${mu.toFixed(4)}</div>`;
  } else if (alpha === 1) {
    out += `<p class="erreur">α = 1 : marche aléatoire, pas de moyenne de long terme finie (processus non stationnaire).</p>`;
  } else {
    out += `<p class="erreur">|α| &gt; 1 : régime explosif, la série diverge.</p>`;
  }
  resDiv.innerHTML = out;
}

function calculerIRF() {
  const resDiv = document.getElementById('resultatIRF');
  const alpha = parseFloat(document.getElementById('alphaIRF').value);
  const H = parseInt(document.getElementById('horizonIRF').value);
  if (isNaN(alpha) || isNaN(H) || H < 1) { resDiv.innerHTML = '<p class="erreur">Valeurs invalides.</p>'; return; }
  let out = '<table class="res"><tr><th>h</th><th>α^h</th></tr>';
  let changementsSigne = 0;
  let prevSign = 1;
  for (let h = 0; h <= H; h++) {
    const val = Math.pow(alpha, h);
    if (h > 0 && Math.sign(val) !== 0 && Math.sign(val) !== prevSign) changementsSigne++;
    if (Math.sign(val) !== 0) prevSign = Math.sign(val);
    out += `<tr><td>${h}</td><td>${val.toFixed(6)}</td></tr>`;
  }
  out += '</table>';
  out += `<div class="valeur">changements de signe entre h=0 et h=${H} : ${changementsSigne}</div>`;
  const regime = Math.abs(alpha) > 1 ? 'explosif' : (alpha === 1 ? 'marche aléatoire (non stationnaire)' : (alpha < 0 ? 'zigzag (alternance de signe)' : (Math.abs(alpha) >= 0.7 ? 'forte persistance (peut ressembler à un cycle sans en être un)' : 'retour rapide vers la moyenne')));
  out += `<div class="valeur">régime : ${regime}</div>`;
  resDiv.innerHTML = out;
}

window.onload = () => { calculerAR1(); calculerIRF(); };
</script>
</body>
</html>
