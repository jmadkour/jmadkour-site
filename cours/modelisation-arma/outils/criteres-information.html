<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapitre 12 — Critères d'information — Calculatrice interactive</title>
<style>
  :root { --cdef: #4A3B8C; --cintu: #E08000; --cex: #2E8B57; --ceco: #1F6FB2; --cgris: #5A5A5A; }
  * { box-sizing: border-box; }
  body { font-family: Georgia, "TeX Gyre Pagella", serif; background: #FDFDFD; color: #1a1a1a; max-width: 1150px; margin: 0 auto; padding: 1.5em; }
  h1 { font-family: "Helvetica Neue", Arial, sans-serif; color: var(--cdef); font-size: 1.5em; border-bottom: 2px solid var(--cdef); padding-bottom: 0.3em; }
  .sous-titre { color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; margin-top: -0.6em; }
  .panneau { background: white; border-left: 4px solid var(--cdef); border-radius: 6px; padding: 1em 1.2em; margin: 1em 0; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .panneau h2 { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 1.05em; color: var(--cdef); margin-top: 0; }
  label { display: block; margin: 0.6em 0 0.2em; font-size: 0.92em; color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; }
  input[type=number], textarea { width: 100%; padding: 0.5em; border: 1px solid #ccc; border-radius: 4px; font-family: "Courier New", monospace; font-size: 0.9em; }
  .ligne { display: flex; gap: 1em; flex-wrap: wrap; align-items: flex-start; }
  .ligne > div { flex: 1; min-width: 150px; }
  button { margin-top: 1em; background: var(--cdef); color: white; border: none; padding: 0.6em 1.4em; border-radius: 5px; font-family: "Helvetica Neue", Arial, sans-serif; font-weight: bold; cursor: pointer; font-size: 0.95em; }
  button:hover { background: #3a2d70; }
  .erreur { color: #b00020; font-family: "Helvetica Neue", Arial, sans-serif; font-size: 0.9em; margin-top: 0.6em; }
  .resultat-zone { margin-top: 1em; font-family: "Helvetica Neue", Arial, sans-serif; }
  .aide { font-size: 0.85em; color: var(--cgris); margin-top: 0; }
  table.res { border-collapse: collapse; font-family: "Courier New", monospace; font-size: 0.85em; margin-top: 0.6em; width: 100%; }
  table.res th, table.res td { border: 1px solid #ccc; padding: 0.3em 0.6em; text-align: center; }
  table.res th { background: #f0eef7; }
  td.min { background: var(--cex); color: white; font-weight: bold; }
  .valeur { font-size: 1.02em; padding: 0.4em 0.7em; background: var(--cdef); color: white; border-radius: 5px; display: inline-block; margin: 0.2em 0.3em 0.2em 0; }
</style>
</head>
<body>

<h1>Chapitre 12 — Le choix du modèle par les critères d'information</h1>
<p class="sous-titre">Calculatrice interactive — AIC, BIC, HQ et comparaison de plusieurs modèles candidats</p>

<div class="panneau">
  <h2>Comparer des modèles candidats</h2>
  <p class="aide">Une ligne par modèle : nom, k (nombre de paramètres), −2 ln L̂, séparés par des virgules.</p>
  <textarea id="modeles" rows="5">AR(1), 2, 1502
MA(1), 2, 1510
ARMA(1,1), 3, 1493
ARMA(2,1), 4, 1490</textarea>
  <div class="ligne">
    <div><label for="Tobs12">Nombre d'observations T</label><input type="number" id="Tobs12" value="250" step="1" min="2"></div>
  </div>
  <button onclick="calculerCriteres()">Calculer AIC, BIC, HQ</button>
  <div id="resultatCriteres" class="resultat-zone"></div>
</div>

<script>
function calculerCriteres() {
  const resDiv = document.getElementById('resultatCriteres');
  const T = parseFloat(document.getElementById('Tobs12').value);
  const lignes = document.getElementById('modeles').value.trim().split('\n').filter(l => l.trim().length);
  if (isNaN(T) || T <= 1 || lignes.length === 0) {
    resDiv.innerHTML = '<p class="erreur">Valeurs invalides.</p>';
    return;
  }
  const modeles = [];
  for (const ligne of lignes) {
    const parts = ligne.split(',').map(s => s.trim());
    if (parts.length !== 3) {
      resDiv.innerHTML = `<p class="erreur">Ligne mal formée : "${ligne}" (attendu : nom, k, -2lnL).</p>`;
      return;
    }
    const [nom, kStr, mllStr] = parts;
    const k = parseFloat(kStr);
    const mll = parseFloat(mllStr);
    if (isNaN(k) || isNaN(mll)) {
      resDiv.innerHTML = `<p class="erreur">Valeurs numériques invalides sur la ligne : "${ligne}".</p>`;
      return;
    }
    const AIC = mll + 2 * k;
    const BIC = mll + k * Math.log(T);
    const HQ = mll + 2 * k * Math.log(Math.log(T));
    modeles.push({ nom, k, mll, AIC, BIC, HQ });
  }
  const minAIC = Math.min(...modeles.map(m => m.AIC));
  const minBIC = Math.min(...modeles.map(m => m.BIC));
  const minHQ = Math.min(...modeles.map(m => m.HQ));
  let out = '<table class="res"><tr><th>modèle</th><th>k</th><th>−2 ln L̂</th><th>AIC</th><th>BIC</th><th>HQ</th></tr>';
  modeles.forEach(m => {
    out += `<tr><td>${m.nom}</td><td>${m.k}</td><td>${m.mll}</td>`;
    out += `<td class="${m.AIC === minAIC ? 'min' : ''}">${m.AIC.toFixed(2)}</td>`;
    out += `<td class="${m.BIC === minBIC ? 'min' : ''}">${m.BIC.toFixed(2)}</td>`;
    out += `<td class="${m.HQ === minHQ ? 'min' : ''}">${m.HQ.toFixed(2)}</td></tr>`;
  });
  out += '</table>';
  const meilleurAIC = modeles.find(m => m.AIC === minAIC);
  const meilleurBIC = modeles.find(m => m.BIC === minBIC);
  const meilleurHQ = modeles.find(m => m.HQ === minHQ);
  out += `<div class="valeur">minimum AIC : ${meilleurAIC.nom}</div>`;
  out += `<div class="valeur">minimum BIC : ${meilleurBIC.nom}</div>`;
  out += `<div class="valeur">minimum HQ : ${meilleurHQ.nom}</div>`;
  const sorted = modeles.map(m => m.AIC).sort((a, b) => a - b);
  const ecartAIC = sorted.length > 1 ? sorted[1] - sorted[0] : NaN;
  if (!isNaN(ecartAIC)) {
    out += `<p class="aide">Écart d'AIC entre le meilleur et le second : ${ecartAIC.toFixed(2)} (${ecartAIC < 2 ? 'négligeable, < 2' : 'non négligeable, ≥ 2'}).</p>`;
  }
  resDiv.innerHTML = out;
}

window.onload = () => { calculerCriteres(); };
</script>
</body>
</html>
