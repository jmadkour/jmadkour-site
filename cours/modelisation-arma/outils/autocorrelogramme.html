<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapitre 10 — Autocorrélation, autocorrélogramme et mémoire — Calculatrice interactive</title>
<style>
  :root { --cdef: #4A3B8C; --cintu: #E08000; --cex: #2E8B57; --ceco: #1F6FB2; --cgris: #5A5A5A; }
  * { box-sizing: border-box; }
  body { font-family: Georgia, "TeX Gyre Pagella", serif; background: #FDFDFD; color: #1a1a1a; max-width: 1150px; margin: 0 auto; padding: 1.5em; }
  h1 { font-family: "Helvetica Neue", Arial, sans-serif; color: var(--cdef); font-size: 1.5em; border-bottom: 2px solid var(--cdef); padding-bottom: 0.3em; }
  .sous-titre { color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; margin-top: -0.6em; }
  .panneau { background: white; border-left: 4px solid var(--cdef); border-radius: 6px; padding: 1em 1.2em; margin: 1em 0; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .panneau h2 { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 1.05em; color: var(--cdef); margin-top: 0; }
  label { display: block; margin: 0.6em 0 0.2em; font-size: 0.92em; color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; }
  input[type=number], textarea { width: 100%; padding: 0.5em; border: 1px solid #ccc; border-radius: 4px; font-family: "Courier New", monospace; font-size: 0.9em; }
  .ligne { display: flex; gap: 1em; flex-wrap: wrap; align-items: flex-start; }
  .ligne > div { flex: 1; min-width: 170px; }
  button { margin-top: 1em; background: var(--cdef); color: white; border: none; padding: 0.6em 1.4em; border-radius: 5px; font-family: "Helvetica Neue", Arial, sans-serif; font-weight: bold; cursor: pointer; font-size: 0.95em; }
  button:hover { background: #3a2d70; }
  .erreur { color: #b00020; font-family: "Helvetica Neue", Arial, sans-serif; font-size: 0.9em; margin-top: 0.6em; }
  .resultat-zone { margin-top: 1em; font-family: "Helvetica Neue", Arial, sans-serif; }
  .aide { font-size: 0.85em; color: var(--cgris); margin-top: 0; }
  table.res { border-collapse: collapse; font-family: "Courier New", monospace; font-size: 0.85em; margin-top: 0.6em; width: 100%; }
  table.res th, table.res td { border: 1px solid #ccc; padding: 0.3em 0.6em; text-align: center; }
  .valeur { font-size: 1.02em; padding: 0.4em 0.7em; background: var(--cdef); color: white; border-radius: 5px; display: inline-block; margin: 0.2em 0.3em 0.2em 0; }
  .sig { color: #b00020; font-weight: bold; }
</style>
</head>
<body>

<h1>Chapitre 10 — Autocorrélation, autocorrélogramme et mémoire</h1>
<p class="sous-titre">Calculatrice interactive — ACF empirique avec bandes de significativité, et corrélation d'une marche aléatoire</p>

<div class="panneau">
  <h2>Autocorrélogramme empirique</h2>
  <p class="aide">Valeurs de la série, une par ligne.</p>
  <textarea id="serieACF" rows="6">4
6
5
7
6
8</textarea>
  <div class="ligne">
    <div><label for="nbLagsACF">Nombre de retards à calculer</label><input type="number" id="nbLagsACF" value="2" step="1" min="1"></div>
  </div>
  <button onclick="calculerACF()">Calculer l'ACF</button>
  <div id="resultatACF" class="resultat-zone"></div>
</div>

<div class="panneau">
  <h2>Corrélation d'une marche aléatoire à distance k</h2>
  <div class="ligne">
    <div><label for="tRW">t (date de départ)</label><input type="number" id="tRW" value="990" step="1" min="1"></div>
    <div><label for="kRW">k (nombre de retards)</label><input type="number" id="kRW" value="10" step="1" min="1"></div>
  </div>
  <button onclick="calculerRW()">Calculer Corr(y_t, y_(t+k))</button>
  <div id="resultatRW" class="resultat-zone"></div>
</div>

<script>
function calculerACF() {
  const resDiv = document.getElementById('resultatACF');
  const x = document.getElementById('serieACF').value.trim().split('\n').filter(l => l.trim().length).map(l => parseFloat(l.trim()));
  const nLags = parseInt(document.getElementById('nbLagsACF').value);
  const T = x.length;
  if (x.some(isNaN) || isNaN(nLags) || T < 3 || nLags < 1 || nLags >= T) {
    resDiv.innerHTML = '<p class="erreur">Valeurs invalides (au moins 3 observations, retards < T).</p>';
    return;
  }
  const mean = x.reduce((a, b) => a + b, 0) / T;
  function gammaHat(k) {
    let s = 0;
    for (let t = k; t < T; t++) s += (x[t] - mean) * (x[t - k] - mean);
    return s / T;
  }
  const g0 = gammaHat(0);
  const band = 1.96 / Math.sqrt(T);
  let out = `<div class="valeur">x̄ = ${mean.toFixed(4)}</div>`;
  out += `<div class="valeur">γ̂₀ = ${g0.toFixed(4)}</div>`;
  out += `<div class="valeur">bande ±1,96/√T = ±${band.toFixed(4)}</div>`;
  out += '<table class="res"><tr><th>k</th><th>γ̂_k</th><th>ρ̂_k</th><th>significatif ?</th></tr>';
  for (let k = 1; k <= nLags; k++) {
    const gk = gammaHat(k);
    const rk = gk / g0;
    const sig = Math.abs(rk) > band;
    out += `<tr><td>${k}</td><td>${gk.toFixed(4)}</td><td>${rk.toFixed(4)}</td><td>${sig ? '<span class="sig">oui</span>' : 'non'}</td></tr>`;
  }
  out += '</table>';
  resDiv.innerHTML = out;
}

function calculerRW() {
  const resDiv = document.getElementById('resultatRW');
  const t = parseFloat(document.getElementById('tRW').value);
  const k = parseFloat(document.getElementById('kRW').value);
  if ([t, k].some(isNaN) || t <= 0 || k <= 0) {
    resDiv.innerHTML = '<p class="erreur">Valeurs invalides (t et k doivent être positifs).</p>';
    return;
  }
  const corr = Math.sqrt(t / (t + k));
  resDiv.innerHTML = `<div class="valeur">Corr(y_${t}, y_${t + k}) = √(${t}/${t + k}) = ${corr.toFixed(4)}</div>`;
}

window.onload = () => { calculerACF(); calculerRW(); };
</script>
</body>
</html>
