<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapitre 6 — Processus ARMA(p,q) — Calculatrice interactive</title>
<style>
  :root { --cdef: #4A3B8C; --cintu: #E08000; --cex: #2E8B57; --ceco: #1F6FB2; --cgris: #5A5A5A; }
  * { box-sizing: border-box; }
  body { font-family: Georgia, "TeX Gyre Pagella", serif; background: #FDFDFD; color: #1a1a1a; max-width: 1150px; margin: 0 auto; padding: 1.5em; }
  h1 { font-family: "Helvetica Neue", Arial, sans-serif; color: var(--cdef); font-size: 1.5em; border-bottom: 2px solid var(--cdef); padding-bottom: 0.3em; }
  .sous-titre { color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; margin-top: -0.6em; }
  .panneau { background: white; border-left: 4px solid var(--cdef); border-radius: 6px; padding: 1em 1.2em; margin: 1em 0; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .panneau h2 { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 1.05em; color: var(--cdef); margin-top: 0; }
  label { display: block; margin: 0.6em 0 0.2em; font-size: 0.92em; color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; }
  input[type=number], textarea { width: 100%; padding: 0.5em; border: 1px solid #ccc; border-radius: 4px; font-family: "Courier New", monospace; font-size: 0.9em; }
  .ligne { display: flex; gap: 1em; flex-wrap: wrap; align-items: flex-start; }
  .ligne > div { flex: 1; min-width: 170px; }
  button { margin-top: 1em; background: var(--cdef); color: white; border: none; padding: 0.6em 1.4em; border-radius: 5px; font-family: "Helvetica Neue", Arial, sans-serif; font-weight: bold; cursor: pointer; font-size: 0.95em; }
  button:hover { background: #3a2d70; }
  .erreur { color: #b00020; font-family: "Helvetica Neue", Arial, sans-serif; font-size: 0.9em; margin-top: 0.6em; }
  .resultat-zone { margin-top: 1em; font-family: "Helvetica Neue", Arial, sans-serif; }
  .aide { font-size: 0.85em; color: var(--cgris); margin-top: 0; }
  table.res { border-collapse: collapse; font-family: "Courier New", monospace; font-size: 0.85em; margin-top: 0.6em; width: 100%; }
  table.res th, table.res td { border: 1px solid #ccc; padding: 0.3em 0.6em; text-align: center; }
  .valeur { font-size: 1.02em; padding: 0.4em 0.7em; background: var(--cdef); color: white; border-radius: 5px; display: inline-block; margin: 0.2em 0.3em 0.2em 0; }
</style>
</head>
<body>

<h1>Chapitre 6 — Les processus mixtes ARMA(p,q)</h1>
<p class="sous-titre">Calculatrice interactive — simulation ARMA(1,1) et coût en paramètres d'une approximation MA pure</p>

<div class="panneau">
  <h2>Simuler un ARMA(1,1)</h2>
  <div class="ligne">
    <div><label for="thetaARMA">θ</label><input type="number" id="thetaARMA" value="0.5" step="0.1"></div>
    <div><label for="alphaARMA">α</label><input type="number" id="alphaARMA" value="0.6" step="0.01"></div>
    <div><label for="betaARMA">β</label><input type="number" id="betaARMA" value="0.3" step="0.01"></div>
    <div><label for="y0ARMA">y₀</label><input type="number" id="y0ARMA" value="2" step="0.1"></div>
  </div>
  <p class="aide">Chocs ε successifs, du plus ancien (ε₀) au plus récent.</p>
  <textarea id="epsARMA" rows="4">0.2
0.4
-0.3
0.7</textarea>
  <button onclick="calculerARMA()">Simuler</button>
  <div id="resultatARMA" class="resultat-zone"></div>
</div>

<div class="panneau">
  <h2>Coût en paramètres d'une approximation MA pure</h2>
  <div class="ligne">
    <div><label for="alphaCout">α (persistance de l'ARMA(1,1))</label><input type="number" id="alphaCout" value="0.8" step="0.01" min="-0.999" max="0.999"></div>
    <div><label for="seuilCout">Seuil d'erreur toléré</label><input type="number" id="seuilCout" value="0.01" step="0.001" min="0.0001" max="0.5"></div>
  </div>
  <button onclick="calculerCout()">Calculer le nombre de paramètres nécessaires</button>
  <div id="resultatCout" class="resultat-zone"></div>
</div>

<script>
function calculerARMA() {
  const resDiv = document.getElementById('resultatARMA');
  const theta = parseFloat(document.getElementById('thetaARMA').value);
  const alpha = parseFloat(document.getElementById('alphaARMA').value);
  const beta = parseFloat(document.getElementById('betaARMA').value);
  let y = parseFloat(document.getElementById('y0ARMA').value);
  const eps = document.getElementById('epsARMA').value.trim().split('\n').filter(l => l.trim().length).map(l => parseFloat(l.trim()));
  if ([theta, alpha, beta, y].some(isNaN) || eps.some(isNaN) || eps.length < 2) {
    resDiv.innerHTML = '<p class="erreur">Valeurs invalides (au moins deux chocs requis).</p>';
    return;
  }
  let out = '<table class="res"><tr><th>t</th><th>ε_t</th><th>y_t</th></tr>';
  for (let t = 1; t < eps.length; t++) {
    y = theta + alpha * y + eps[t] + beta * eps[t-1];
    out += `<tr><td>${t}</td><td>${eps[t]}</td><td>${y.toFixed(4)}</td></tr>`;
  }
  out += '</table>';
  const stationnaire = Math.abs(alpha) < 1;
  const inversible = Math.abs(beta) < 1;
  out += `<div class="valeur">stationnaire (|α|&lt;1) : ${stationnaire ? 'oui' : 'non'}</div>`;
  out += `<div class="valeur">inversible (|β|&lt;1) : ${inversible ? 'oui' : 'non'}</div>`;
  resDiv.innerHTML = out;
}

function calculerCout() {
  const resDiv = document.getElementById('resultatCout');
  const alpha = parseFloat(document.getElementById('alphaCout').value);
  const seuil = parseFloat(document.getElementById('seuilCout').value);
  if (isNaN(alpha) || isNaN(seuil) || Math.abs(alpha) >= 1 || seuil <= 0) {
    resDiv.innerHTML = '<p class="erreur">Valeurs invalides (|α| doit être &lt; 1, seuil &gt; 0).</p>';
    return;
  }
  let n = 1;
  while (Math.pow(Math.abs(alpha), n) >= seuil && n < 1000) n++;
  let out = `<div class="valeur">q ≈ ${n} paramètres pour un MA pur</div>`;
  out += `<div class="valeur">2 paramètres pour l'ARMA(1,1) équivalent</div>`;
  out += `<p class="aide">|α|^${n} = ${Math.pow(Math.abs(alpha), n).toFixed(6)} < seuil (${seuil}), alors que |α|^${n-1} = ${Math.pow(Math.abs(alpha), n-1).toFixed(6)} ≥ seuil.</p>`;
  resDiv.innerHTML = out;
}

window.onload = () => { calculerARMA(); calculerCout(); };
</script>
</body>
</html>
