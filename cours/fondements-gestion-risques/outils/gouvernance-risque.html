<!DOCTYPE html>
<html lang="fr">
<head>
<script id="jm-theme-detect">
(function () {
  var t = null;
  try { t = localStorage.getItem("jm-theme"); } catch (e) {}
  if (!t) { t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light"; }
  document.documentElement.setAttribute("data-theme", t);
  window.addEventListener("storage", function (e) {
    if (e.key === "jm-theme" && e.newValue) { document.documentElement.setAttribute("data-theme", e.newValue); }
  });
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapitre 2 — La gouvernance du risque — Calculatrice interactive</title>
<style>
  :root { --cdef: #4A3B8C; --cintu: #E08000; --cex: #2E8B57; --ceco: #1F6FB2; --cgris: #5A5A5A; }
  * { box-sizing: border-box; }
  body { font-family: Georgia, "TeX Gyre Pagella", serif; background: #FDFDFD; color: #1a1a1a; max-width: 1150px; margin: 0 auto; padding: 1.5em; }
  h1 { font-family: "Helvetica Neue", Arial, sans-serif; color: var(--cdef); font-size: 1.5em; border-bottom: 2px solid var(--cdef); padding-bottom: 0.3em; }
  .sous-titre { color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; margin-top: -0.6em; }
  .panneau { background: white; border-left: 4px solid var(--cdef); border-radius: 6px; padding: 1em 1.2em; margin: 1em 0; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .panneau h2 { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 1.05em; color: var(--cdef); margin-top: 0; }
  label { display: block; margin: 0.6em 0 0.2em; font-size: 0.85em; color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; }
  input[type=number], input[type=text] { width: 100%; padding: 0.5em; border: 1px solid #ccc; border-radius: 4px; font-family: "Courier New", monospace; font-size: 0.9em; }
  .ligne { display: flex; gap: 1em; flex-wrap: wrap; align-items: flex-start; }
  .ligne > div { flex: 1; min-width: 150px; }
  button { margin-top: 1em; margin-right: 0.5em; background: var(--cdef); color: white; border: none; padding: 0.6em 1.4em; border-radius: 5px; font-family: "Helvetica Neue", Arial, sans-serif; font-weight: bold; cursor: pointer; font-size: 0.95em; }
  button:hover { background: #372c69; }
  .erreur { color: #b00020; font-family: "Helvetica Neue", Arial, sans-serif; font-size: 0.9em; margin-top: 0.6em; }
  .resultat-zone { margin-top: 1em; font-family: "Helvetica Neue", Arial, sans-serif; }
  .aide { font-size: 0.85em; color: var(--cgris); margin-top: 0; }
  .valeur { font-size: 1.0em; padding: 0.4em 0.7em; background: var(--cdef); color: white; border-radius: 5px; display: inline-block; margin: 0.2em 0.3em 0.2em 0; }
  .valeur.ok { background: var(--cex); }
  .valeur.ko { background: #b00020; }
  .valeur.mid { background: var(--cintu); }
  table.tabres { border-collapse: collapse; margin-top: 0.7em; font-size: 0.85em; font-family: "Courier New", monospace; }
  table.tabres th, table.tabres td { border: 1px solid #ccc; padding: 0.3em 0.6em; text-align: right; }
  table.tabres th { background: #f0f0f0; font-family: "Helvetica Neue", Arial, sans-serif; }
</style>
<style id="jm-theme-override">
/* Surcharge : palette et typographie du site jmadkour.org, synchronisee
   avec son bascule clair/sombre (voir script jm-theme-detect ci-dessus). */
:root {
  --cdef: #1f6fb2; --ceco: #1f6fb2; --cex: #1d9e75; --cintu: #b56600; --cgris: #54707f;
  --bg: #ffffff; --fg: #142a38; --border: #dbe6ee; --card-bg: #f6f9fb; --code-bg: #f3f7fa;
  --danger: #b00020; --primary-dark: #17578f;
}
:root[data-theme="dark"] {
  --cdef: #3aa0e6; --ceco: #3aa0e6; --cex: #37b47e; --cintu: #e0954a; --cgris: #9db4c0;
  --bg: #0d1b26; --fg: #e7eef3; --border: #20455a; --card-bg: #13303d; --code-bg: #0f2733;
  --danger: #e0554a; --primary-dark: #5bb3ef;
}
* { box-sizing: border-box; }
html { background: var(--bg) !important; }
body {
  background: var(--bg) !important; color: var(--fg) !important;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
}
h1, h2, .panneau h2 {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  color: var(--cdef) !important; border-color: var(--cdef) !important;
}
.sous-titre, .aide, label { color: var(--cgris) !important; }
.panneau {
  background: var(--card-bg) !important; border: 1px solid var(--border) !important;
  border-left: 1px solid var(--border) !important; border-radius: 14px !important; box-shadow: none !important;
}
input[type=number], input[type=text] {
  background: var(--bg) !important; color: var(--fg) !important; border: 1px solid var(--border) !important;
}
button {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  background: var(--cdef) !important; color: #ffffff !important; border-radius: 8px !important; border: none !important;
}
button:hover { background: var(--primary-dark) !important; }
.erreur { color: var(--danger) !important; }
.valeur { background: var(--cdef) !important; color: #ffffff !important; }
.valeur.ok { background: var(--cex) !important; }
.valeur.ko { background: var(--danger) !important; }
.valeur.mid { background: var(--cintu) !important; }
table.tabres th, table.tabres td { border-color: var(--border) !important; color: var(--fg) !important; }
table.tabres th { background: var(--code-bg) !important; }
</style>
</head>
<body>

<h1>Chapitre 2 — Application : la gouvernance du risque</h1>
<p class="sous-titre">Calculatrice interactive — les trois ratios prudentiels de Bâle III (exercice 5), effet de levier et risque de gouvernance (exercice 6)</p>

<div class="panneau">
  <h2>Les trois ratios prudentiels de Bâle III</h2>
  <div class="ligne">
    <div><label for="d2_tier1">Fonds propres Tier 1</label><input type="number" id="d2_tier1" value="8000000000" step="100000000"></div>
    <div><label for="d2_RWA">Actifs pondérés des risques (RWA)</label><input type="number" id="d2_RWA" value="100000000000" step="1000000000"></div>
    <div><label for="d2_exposition">Exposition totale non pondérée</label><input type="number" id="d2_exposition" value="250000000000" step="1000000000"></div>
  </div>
  <div class="ligne">
    <div><label for="d2_HQLA">Actifs liquides de haute qualité (HQLA)</label><input type="number" id="d2_HQLA" value="15000000000" step="100000000"></div>
    <div><label for="d2_sorties">Sorties nettes de trésorerie à 30 jours</label><input type="number" id="d2_sorties" value="12000000000" step="100000000"></div>
  </div>
  <button onclick="calculerRatiosBale()">Calculer</button>
  <div id="resultatRatiosBale" class="resultat-zone"></div>
</div>

<div class="panneau">
  <h2>Effet de levier et risque de gouvernance</h2>
  <div class="ligne">
    <div><label for="d2b_fondsPropres">Fonds propres</label><input type="number" id="d2b_fondsPropres" value="1500000000" step="100000000"></div>
    <div><label for="d2b_position">Position (pension à échéance)</label><input type="number" id="d2b_position" value="6300000000" step="100000000"></div>
    <div><label for="d2b_decoteInitiale">Décote initiale (%)</label><input type="number" id="d2b_decoteInitiale" value="2" step="0.5"></div>
    <div><label for="d2b_decoteNouvelle">Décote après dégradation (%)</label><input type="number" id="d2b_decoteNouvelle" value="8" step="0.5"></div>
    <div><label for="d2b_liquidites">Liquidités disponibles</label><input type="number" id="d2b_liquidites" value="200000000" step="10000000"></div>
  </div>
  <button onclick="calculerLevierGouvernance()">Calculer</button>
  <div id="resultatLevierGouvernance" class="resultat-zone"></div>
</div>

<script>
function calculerRatiosBale() {
  var resDiv = document.getElementById('resultatRatiosBale');
  var tier1 = parseFloat(document.getElementById('d2_tier1').value);
  var RWA = parseFloat(document.getElementById('d2_RWA').value);
  var exposition = parseFloat(document.getElementById('d2_exposition').value);
  var HQLA = parseFloat(document.getElementById('d2_HQLA').value);
  var sorties = parseFloat(document.getElementById('d2_sorties').value);

  if ([tier1, RWA, exposition, HQLA, sorties].some(isNaN)) {
    resDiv.innerHTML = '<p class="erreur">Valeurs invalides.</p>';
    return;
  }

  var ratioCET1 = tier1 / RWA;
  var ratioLevier = tier1 / exposition;
  var LCR = HQLA / sorties;

  var html = '';
  html += '<div class="valeur">ratio CET1 = ' + (ratioCET1 * 100).toFixed(2) + '%</div>';
  html += '<div class="valeur ' + (ratioLevier >= 0.03 ? 'ok' : 'ko') + '">ratio de levier = ' + (ratioLevier * 100).toFixed(2) + '% (min. 3%)</div>';
  html += '<div class="valeur ' + (LCR >= 1 ? 'ok' : 'ko') + '">LCR = ' + (LCR * 100).toFixed(2) + '% (min. 100%)</div>';
  resDiv.innerHTML = html;
}

function calculerLevierGouvernance() {
  var resDiv = document.getElementById('resultatLevierGouvernance');
  var fondsPropres = parseFloat(document.getElementById('d2b_fondsPropres').value);
  var position = parseFloat(document.getElementById('d2b_position').value);
  var decoteInitiale = parseFloat(document.getElementById('d2b_decoteInitiale').value) / 100;
  var decoteNouvelle = parseFloat(document.getElementById('d2b_decoteNouvelle').value) / 100;
  var liquidites = parseFloat(document.getElementById('d2b_liquidites').value);

  if ([fondsPropres, position, decoteInitiale, decoteNouvelle, liquidites].some(isNaN) || fondsPropres === 0) {
    resDiv.innerHTML = '<p class="erreur">Valeurs invalides.</p>';
    return;
  }

  var ratioLevier = position / fondsPropres;
  var collateralInitial = position * decoteInitiale;
  var collateralNouveau = position * decoteNouvelle;
  var appelMarge = collateralNouveau - collateralInitial;
  var couvert = liquidites >= appelMarge;
  var deficit = appelMarge - liquidites;

  var html = '';
  html += '<div class="valeur mid">ratio de levier = ' + ratioLevier.toFixed(2) + ' fois les fonds propres</div>';
  html += '<table class="tabres">';
  html += '<tr><th>collatéral initial</th><td>' + collateralInitial.toFixed(0) + '</td></tr>';
  html += '<tr><th>collatéral requis après dégradation</th><td>' + collateralNouveau.toFixed(0) + '</td></tr>';
  html += '<tr><th>appel de marge additionnel</th><td>' + appelMarge.toFixed(0) + '</td></tr>';
  html += '</table>';
  html += '<div class="valeur ' + (couvert ? 'ok' : 'ko') + '">' + (couvert ? 'appel de marge couvert' : 'appel de marge NON couvert — déficit de ' + deficit.toFixed(0)) + '</div>';
  resDiv.innerHTML = html;
}

window.onload = function () { calculerRatiosBale(); calculerLevierGouvernance(); };
</script>
</body>
</html>
