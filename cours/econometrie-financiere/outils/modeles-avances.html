<!DOCTYPE html>
<html lang="fr">
<head>
<script id="jm-theme-detect">
(function () {
  var t = null;
  try { t = localStorage.getItem("jm-theme"); } catch (e) {}
  if (!t) { t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light"; }
  document.documentElement.setAttribute("data-theme", t);
  window.addEventListener("storage", function (e) {
    if (e.key === "jm-theme" && e.newValue) { document.documentElement.setAttribute("data-theme", e.newValue); }
  });
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapitre 6 — Modèles avancés — Calculatrice interactive</title>
<style>
  :root { --cdef: #1F6FB2; --cintu: #B56600; --cex: #1D9E75; --ceco: #1F6FB2; --cgris: #5A5A5A; }
  * { box-sizing: border-box; }
  body { font-family: Georgia, "TeX Gyre Pagella", serif; background: #FDFDFD; color: #1a1a1a; max-width: 1150px; margin: 0 auto; padding: 1.5em; }
  h1 { font-family: "Helvetica Neue", Arial, sans-serif; color: var(--cdef); font-size: 1.5em; border-bottom: 2px solid var(--cdef); padding-bottom: 0.3em; }
  .sous-titre { color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; margin-top: -0.6em; }
  .panneau { background: white; border-left: 4px solid var(--cdef); border-radius: 6px; padding: 1em 1.2em; margin: 1em 0; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .panneau h2 { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 1.05em; color: var(--cdef); margin-top: 0; }
  label { display: block; margin: 0.6em 0 0.2em; font-size: 0.92em; color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; }
  input[type=number], select { width: 100%; padding: 0.5em; border: 1px solid #ccc; border-radius: 4px; font-family: "Courier New", monospace; font-size: 0.9em; }
  .ligne { display: flex; gap: 1em; flex-wrap: wrap; align-items: flex-start; }
  .ligne > div { flex: 1; min-width: 170px; }
  button { margin-top: 1em; background: var(--cdef); color: white; border: none; padding: 0.6em 1.4em; border-radius: 5px; font-family: "Helvetica Neue", Arial, sans-serif; font-weight: bold; cursor: pointer; font-size: 0.95em; }
  button:hover { background: #17578f; }
  .erreur { color: #b00020; font-family: "Helvetica Neue", Arial, sans-serif; font-size: 0.9em; margin-top: 0.6em; }
  .resultat-zone { margin-top: 1em; font-family: "Helvetica Neue", Arial, sans-serif; }
  .aide { font-size: 0.85em; color: var(--cgris); margin-top: 0; }
  .valeur { font-size: 1.02em; padding: 0.4em 0.7em; background: var(--cdef); color: white; border-radius: 5px; display: inline-block; margin: 0.2em 0.3em 0.2em 0; }
</style>
<style id="jm-theme-override">
/* Surcharge : palette et typographie du site jmadkour.org, synchronisee
   avec son bascule clair/sombre (voir script jm-theme-detect ci-dessus).
   Remplace la palette "polycopie" (violet, serif) utilisee par defaut
   dans le bloc <style> d'origine de cette page. */
:root {
  --cdef: #1f6fb2; --ceco: #1f6fb2; --cex: #1d9e75; --cintu: #b56600; --cgris: #54707f;
  --bg: #ffffff; --fg: #142a38; --border: #dbe6ee; --card-bg: #f6f9fb; --code-bg: #f3f7fa;
  --danger: #b00020; --primary-dark: #17578f;
}
:root[data-theme="dark"] {
  --cdef: #3aa0e6; --ceco: #3aa0e6; --cex: #37b47e; --cintu: #e0954a; --cgris: #9db4c0;
  --bg: #0d1b26; --fg: #e7eef3; --border: #20455a; --card-bg: #13303d; --code-bg: #0f2733;
  --danger: #e0554a; --primary-dark: #5bb3ef;
}
* { box-sizing: border-box; }
html { background: var(--bg) !important; }
body {
  background: var(--bg) !important; color: var(--fg) !important;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
}
h1, h2, h3, .panneau h2 {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  color: var(--cdef) !important; border-color: var(--cdef) !important;
}
.sous-titre, .aide, label { color: var(--cgris) !important; }
.panneau {
  background: var(--card-bg) !important; border: 1px solid var(--border) !important;
  border-left: 1px solid var(--border) !important; border-radius: 14px !important; box-shadow: none !important;
}
input[type=number], input[type=text], select, textarea {
  background: var(--bg) !important; color: var(--fg) !important; border: 1px solid var(--border) !important;
}
button {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  background: var(--cdef) !important; color: #ffffff !important; border-radius: 8px !important; border: none !important;
}
button:hover { background: var(--primary-dark) !important; }
.erreur { color: var(--danger) !important; }
table.res, table.res th, table.res td { border-color: var(--border) !important; }
table.res th { background: var(--card-bg) !important; }
.valeur { background: var(--cdef) !important; color: #ffffff !important; }
.valeur.ok { background: var(--cex) !important; }
.valeur.ko { background: var(--danger) !important; }
</style>
</head>
<body>

<h1>Chapitre 6 — Modèles économétriques avancés</h1>
<p class="sous-titre">Calculatrice interactive — modèle logit/probit et test de Chow</p>

<div class="panneau">
  <h2>Modèle binaire (logit / probit)</h2>
  <div class="ligne">
    <div><label for="modele">Fonction de lien</label>
      <select id="modele"><option value="logit">Logit : Λ(z)</option><option value="probit">Probit : Φ(z)</option></select>
    </div>
    <div><label for="alphaBin">α (constante)</label><input type="number" id="alphaBin" value="-5" step="0.01"></div>
    <div><label for="betaBin">β (coefficient)</label><input type="number" id="betaBin" value="0.04" step="0.001"></div>
    <div><label for="xBin">X</label><input type="number" id="xBin" value="80" step="0.1"></div>
  </div>
  <button onclick="calculerBinaire()">Calculer P(Y=1|X) et l'effet marginal</button>
  <div id="resultatBinaire" class="resultat-zone"></div>
</div>

<div class="panneau">
  <h2>Test de Chow</h2>
  <div class="ligne">
    <div><label for="rssP">RSS poolée</label><input type="number" id="rssP" value="850" step="0.1" min="0"></div>
    <div><label for="rss1">RSS₁ (sous-période 1)</label><input type="number" id="rss1" value="300" step="0.1" min="0"></div>
    <div><label for="rss2">RSS₂ (sous-période 2)</label><input type="number" id="rss2" value="400" step="0.1" min="0"></div>
    <div><label for="kChow">k (nombre de paramètres)</label><input type="number" id="kChow" value="3" step="1" min="1"></div>
    <div><label for="n1Chow">n₁</label><input type="number" id="n1Chow" value="60" step="1" min="1"></div>
    <div><label for="n2Chow">n₂</label><input type="number" id="n2Chow" value="60" step="1" min="1"></div>
    <div><label for="fCrit">Valeur critique F (au seuil choisi)</label><input type="number" id="fCrit" value="2.68" step="0.01" min="0"></div>
  </div>
  <button onclick="calculerChow()">Calculer la statistique F</button>
  <div id="resultatChow" class="resultat-zone"></div>
</div>

<script>
function erf(x) {
  const sign = x >= 0 ? 1 : -1;
  x = Math.abs(x);
  const a1=0.254829592, a2=-0.284496736, a3=1.421413741, a4=-1.453152027, a5=1.061405429, p=0.3275911;
  const t = 1/(1+p*x);
  const y = 1-(((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-x*x);
  return sign*y;
}
function Phi(z) { return 0.5*(1+erf(z/Math.sqrt(2))); }
function phiDensity(z) { return Math.exp(-z*z/2)/Math.sqrt(2*Math.PI); }
function Lambda(z) { return 1/(1+Math.exp(-z)); }

function calculerBinaire() {
  const resDiv = document.getElementById('resultatBinaire');
  const modele = document.getElementById('modele').value;
  const alpha = parseFloat(document.getElementById('alphaBin').value);
  const beta = parseFloat(document.getElementById('betaBin').value);
  const X = parseFloat(document.getElementById('xBin').value);
  if ([alpha, beta, X].some(isNaN)) { resDiv.innerHTML = '<p class="erreur">Valeurs invalides.</p>'; return; }
  const z = alpha + beta * X;
  let P, effetMarginal;
  if (modele === 'logit') {
    P = Lambda(z);
    effetMarginal = P * (1 - P) * beta;
  } else {
    P = Phi(z);
    effetMarginal = phiDensity(z) * beta;
  }
  let out = `<div class="valeur">z = ${z.toFixed(4)}</div>`;
  out += `<div class="valeur">P(Y=1|X) = ${(P*100).toFixed(2)} %</div>`;
  out += `<div class="valeur">effet marginal en X = ${effetMarginal.toFixed(6)} (soit ${(effetMarginal*100).toFixed(4)} point de % par unité de X)</div>`;
  resDiv.innerHTML = out;
}

function calculerChow() {
  const resDiv = document.getElementById('resultatChow');
  const RSS = parseFloat(document.getElementById('rssP').value);
  const RSS1 = parseFloat(document.getElementById('rss1').value);
  const RSS2 = parseFloat(document.getElementById('rss2').value);
  const k = parseFloat(document.getElementById('kChow').value);
  const n1 = parseFloat(document.getElementById('n1Chow').value);
  const n2 = parseFloat(document.getElementById('n2Chow').value);
  const fCrit = parseFloat(document.getElementById('fCrit').value);
  if ([RSS, RSS1, RSS2, k, n1, n2, fCrit].some(isNaN) || k <= 0) { resDiv.innerHTML = '<p class="erreur">Valeurs invalides.</p>'; return; }
  const n = n1 + n2;
  const ddl2 = n - 2 * k;
  if (ddl2 <= 0) { resDiv.innerHTML = '<p class="erreur">Degrés de liberté du dénominateur non positifs (n - 2k ≤ 0).</p>'; return; }
  if (RSS < RSS1 + RSS2) { resDiv.innerHTML = '<p class="erreur">RSS poolée ne peut pas être inférieure à RSS₁+RSS₂.</p>'; return; }
  const F = ((RSS - (RSS1 + RSS2)) / k) / ((RSS1 + RSS2) / ddl2);
  let out = `<div class="valeur">F(${k}, ${ddl2}) = ${F.toFixed(4)}</div>`;
  out += F > fCrit
    ? `<p>F &gt; valeur critique (${fCrit}) : <strong>H₀ rejetée</strong> — rupture structurelle détectée.</p>`
    : `<p>F ≤ valeur critique (${fCrit}) : H₀ non rejetée — pas de preuve statistique de rupture.</p>`;
  resDiv.innerHTML = out;
}

window.onload = () => { calculerBinaire(); calculerChow(); };
</script>
</body>
</html>
