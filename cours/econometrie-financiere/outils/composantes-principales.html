<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapitre 1 — ACP — Calculatrice interactive</title>
<style>
  :root { --cdef: #4A3B8C; --cintu: #E08000; --cex: #2E8B57; --ceco: #1F6FB2; --cgris: #5A5A5A; }
  * { box-sizing: border-box; }
  body { font-family: Georgia, "TeX Gyre Pagella", serif; background: #FDFDFD; color: #1a1a1a; max-width: 1150px; margin: 0 auto; padding: 1.5em; }
  h1 { font-family: "Helvetica Neue", Arial, sans-serif; color: var(--cdef); font-size: 1.5em; border-bottom: 2px solid var(--cdef); padding-bottom: 0.3em; }
  .sous-titre { color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; margin-top: -0.6em; }
  .panneau { background: white; border-left: 4px solid var(--cdef); border-radius: 6px; padding: 1em 1.2em; margin: 1em 0; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .panneau h2 { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 1.05em; color: var(--cdef); margin-top: 0; }
  label { display: block; margin: 0.6em 0 0.2em; font-size: 0.92em; color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; }
  input[type=number], textarea { width: 100%; padding: 0.5em; border: 1px solid #ccc; border-radius: 4px; font-family: "Courier New", monospace; font-size: 0.9em; }
  .ligne { display: flex; gap: 1em; flex-wrap: wrap; align-items: flex-start; }
  .ligne > div { flex: 1; min-width: 170px; }
  button { margin-top: 1em; background: var(--cdef); color: white; border: none; padding: 0.6em 1.4em; border-radius: 5px; font-family: "Helvetica Neue", Arial, sans-serif; font-weight: bold; cursor: pointer; font-size: 0.95em; }
  button:hover { background: #3a2d70; }
  .erreur { color: #b00020; font-family: "Helvetica Neue", Arial, sans-serif; font-size: 0.9em; margin-top: 0.6em; }
  .resultat-zone { margin-top: 1em; font-family: "Helvetica Neue", Arial, sans-serif; }
  .aide { font-size: 0.85em; color: var(--cgris); margin-top: 0; }
  table.res { border-collapse: collapse; font-family: "Courier New", monospace; font-size: 0.85em; margin-top: 0.6em; }
  table.res th, table.res td { border: 1px solid #ccc; padding: 0.3em 0.6em; text-align: center; }
  .valeur { font-size: 1.02em; padding: 0.4em 0.7em; background: var(--cdef); color: white; border-radius: 5px; display: inline-block; margin: 0.2em 0.3em 0.2em 0; }
</style>
</head>
<body>

<h1>Chapitre 1 — Analyse en composantes principales</h1>
<p class="sous-titre">Calculatrice interactive — diagonalisation 2×2 et variance expliquée</p>

<div class="panneau">
  <h2>Valeurs propres d'une matrice de covariance 2×2</h2>
  <div class="ligne">
    <div><label for="a">Σ₁₁</label><input type="number" id="a" value="9" step="0.01"></div>
    <div><label for="b">Σ₁₂ = Σ₂₁</label><input type="number" id="b" value="5" step="0.01"></div>
    <div><label for="d">Σ₂₂</label><input type="number" id="d" value="9" step="0.01"></div>
  </div>
  <button onclick="calculerValeursPropres()">Calculer</button>
  <div id="resultatVP" class="resultat-zone"></div>
</div>

<div class="panneau">
  <h2>Variance expliquée cumulée</h2>
  <p class="aide">Une valeur propre par ligne, dans l'ordre décroissant.</p>
  <textarea id="lambdas" rows="4">12
5
2
1</textarea>
  <label for="seuil">Seuil de variance expliquée visé (%)</label>
  <input type="number" id="seuil" value="95" step="1" min="1" max="100">
  <button onclick="calculerVarianceExpliquee()">Calculer</button>
  <div id="resultatVar" class="resultat-zone"></div>
</div>

<script>
function calculerValeursPropres() {
  const resDiv = document.getElementById('resultatVP');
  const a = parseFloat(document.getElementById('a').value);
  const b = parseFloat(document.getElementById('b').value);
  const d = parseFloat(document.getElementById('d').value);
  if ([a,b,d].some(isNaN)) { resDiv.innerHTML = '<p class="erreur">Valeurs invalides.</p>'; return; }
  const tr = a + d;
  const det = a*d - b*b;
  const disc = tr*tr - 4*det;
  if (disc < 0) { resDiv.innerHTML = '<p class="erreur">Discriminant négatif : matrice non valide (vérifier la symétrie et les valeurs).</p>'; return; }
  const sq = Math.sqrt(disc);
  const l1 = (tr + sq) / 2;
  const l2 = (tr - sq) / 2;
  let out = `<div class="valeur">tr(Σ) = ${tr.toFixed(4)}</div><div class="valeur">det(Σ) = ${det.toFixed(4)}</div>`;
  out += `<div class="valeur">λ₁ = ${l1.toFixed(4)}</div><div class="valeur">λ₂ = ${l2.toFixed(4)}</div>`;
  if (tr !== 0) out += `<div class="valeur">part de λ₁ = ${(l1/tr*100).toFixed(2)} %</div>`;
  if (a === d) out += `<p>Diagonale égale (${a} = ${d}) : vecteurs propres (1,1)/√2 pour λ₁ et (1,-1)/√2 pour λ₂.</p>`;
  resDiv.innerHTML = out;
}

function calculerVarianceExpliquee() {
  const resDiv = document.getElementById('resultatVar');
  const lambdas = document.getElementById('lambdas').value.trim().split('\n').filter(l => l.trim().length).map(l => parseFloat(l));
  const seuil = parseFloat(document.getElementById('seuil').value);
  if (lambdas.some(isNaN) || isNaN(seuil)) { resDiv.innerHTML = '<p class="erreur">Valeurs invalides.</p>'; return; }
  const total = lambdas.reduce((s,v) => s+v, 0);
  let out = '<table class="res"><tr><th>m</th><th>λ_m</th><th>cumul</th><th>% expliqué</th></tr>';
  let cumul = 0;
  let mAtteint = null;
  lambdas.forEach((l, i) => {
    cumul += l;
    const pct = (cumul/total*100);
    if (mAtteint === null && pct >= seuil) mAtteint = i+1;
    out += `<tr><td>${i+1}</td><td>${l.toFixed(2)}</td><td>${cumul.toFixed(2)}</td><td>${pct.toFixed(2)} %</td></tr>`;
  });
  out += '</table>';
  out += `<div class="valeur">variance totale = ${total.toFixed(2)}</div>`;
  out += mAtteint ? `<div class="valeur">${mAtteint} composante(s) pour atteindre ${seuil} %</div>` : `<p class="erreur">Le seuil de ${seuil} % n'est jamais atteint avec ces composantes.</p>`;
  resDiv.innerHTML = out;
}

window.onload = () => { calculerValeursPropres(); calculerVarianceExpliquee(); };
</script>
</body>
</html>
