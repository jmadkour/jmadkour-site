<!DOCTYPE html>
<html lang="fr">
<head>
<script id="jm-theme-detect">
(function () {
  var t = null;
  try { t = localStorage.getItem("jm-theme"); } catch (e) {}
  if (!t) { t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light"; }
  document.documentElement.setAttribute("data-theme", t);
  window.addEventListener("storage", function (e) {
    if (e.key === "jm-theme" && e.newValue) { document.documentElement.setAttribute("data-theme", e.newValue); }
  });
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapitre 6 — Les marchés de contrats à terme — Calculatrice interactive</title>
<style>
  :root { --cdef: #4A3B8C; --cintu: #E08000; --cex: #2E8B57; --ceco: #1F6FB2; --cgris: #5A5A5A; }
  * { box-sizing: border-box; }
  body { font-family: Georgia, "TeX Gyre Pagella", serif; background: #FDFDFD; color: #1a1a1a; max-width: 1150px; margin: 0 auto; padding: 1.5em; }
  h1 { font-family: "Helvetica Neue", Arial, sans-serif; color: var(--cdef); font-size: 1.5em; border-bottom: 2px solid var(--cdef); padding-bottom: 0.3em; }
  .sous-titre { color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; margin-top: -0.6em; }
  .panneau { background: white; border-left: 4px solid var(--cdef); border-radius: 6px; padding: 1em 1.2em; margin: 1em 0; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .panneau h2 { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 1.05em; color: var(--cdef); margin-top: 0; }
  label { display: block; margin: 0.6em 0 0.2em; font-size: 0.85em; color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; }
  input[type=number], input[type=text] { width: 100%; padding: 0.5em; border: 1px solid #ccc; border-radius: 4px; font-family: "Courier New", monospace; font-size: 0.9em; }
  .ligne { display: flex; gap: 1em; flex-wrap: wrap; align-items: flex-start; }
  .ligne > div { flex: 1; min-width: 150px; }
  button { margin-top: 1em; margin-right: 0.5em; background: var(--cdef); color: white; border: none; padding: 0.6em 1.4em; border-radius: 5px; font-family: "Helvetica Neue", Arial, sans-serif; font-weight: bold; cursor: pointer; font-size: 0.95em; }
  button:hover { background: #372c69; }
  .erreur { color: #b00020; font-family: "Helvetica Neue", Arial, sans-serif; font-size: 0.9em; margin-top: 0.6em; }
  .resultat-zone { margin-top: 1em; font-family: "Helvetica Neue", Arial, sans-serif; }
  .aide { font-size: 0.85em; color: var(--cgris); margin-top: 0; }
  .valeur { font-size: 1.0em; padding: 0.4em 0.7em; background: var(--cdef); color: white; border-radius: 5px; display: inline-block; margin: 0.2em 0.3em 0.2em 0; }
  .valeur.ok { background: var(--cex); }
  .valeur.ko { background: #b00020; }
  .valeur.mid { background: var(--cintu); }
  table.tabres { border-collapse: collapse; margin-top: 0.7em; font-size: 0.85em; font-family: "Courier New", monospace; }
  table.tabres th, table.tabres td { border: 1px solid #ccc; padding: 0.3em 0.6em; text-align: right; }
  table.tabres th { background: #f0f0f0; font-family: "Helvetica Neue", Arial, sans-serif; }
</style>
<style id="jm-theme-override">
/* Surcharge : palette et typographie du site jmadkour.org, synchronisee
   avec son bascule clair/sombre (voir script jm-theme-detect ci-dessus). */
:root {
  --cdef: #1f6fb2; --ceco: #1f6fb2; --cex: #1d9e75; --cintu: #b56600; --cgris: #54707f;
  --bg: #ffffff; --fg: #142a38; --border: #dbe6ee; --card-bg: #f6f9fb; --code-bg: #f3f7fa;
  --danger: #b00020; --primary-dark: #17578f;
}
:root[data-theme="dark"] {
  --cdef: #3aa0e6; --ceco: #3aa0e6; --cex: #37b47e; --cintu: #e0954a; --cgris: #9db4c0;
  --bg: #0d1b26; --fg: #e7eef3; --border: #20455a; --card-bg: #13303d; --code-bg: #0f2733;
  --danger: #e0554a; --primary-dark: #5bb3ef;
}
* { box-sizing: border-box; }
html { background: var(--bg) !important; }
body {
  background: var(--bg) !important; color: var(--fg) !important;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
}
h1, h2, .panneau h2 {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  color: var(--cdef) !important; border-color: var(--cdef) !important;
}
.sous-titre, .aide, label { color: var(--cgris) !important; }
.panneau {
  background: var(--card-bg) !important; border: 1px solid var(--border) !important;
  border-left: 1px solid var(--border) !important; border-radius: 14px !important; box-shadow: none !important;
}
input[type=number], input[type=text] {
  background: var(--bg) !important; color: var(--fg) !important; border: 1px solid var(--border) !important;
}
button {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  background: var(--cdef) !important; color: #ffffff !important; border-radius: 8px !important; border: none !important;
}
button:hover { background: var(--primary-dark) !important; }
.erreur { color: var(--danger) !important; }
.valeur { background: var(--cdef) !important; color: #ffffff !important; }
.valeur.ok { background: var(--cex) !important; }
.valeur.ko { background: var(--danger) !important; }
.valeur.mid { background: var(--cintu) !important; }
table.tabres th, table.tabres td { border-color: var(--border) !important; color: var(--fg) !important; }
table.tabres th { background: var(--code-bg) !important; }
</style>
</head>
<body>

<h1>Chapitre 6 — Application : les marchés de contrats à terme</h1>
<p class="sous-titre">Calculatrice interactive — le marquage au marché jour après jour (exercice 5), l'efficacité de la couverture comptable (exercice 6)</p>

<div class="panneau">
  <h2>Le marquage au marché jour après jour</h2>
  <div class="ligne">
    <div><label for="d6_contrats">Nombre de contrats</label><input type="number" id="d6_contrats" value="5" step="1"></div>
    <div><label for="d6_taille">Taille du contrat (unités)</label><input type="number" id="d6_taille" value="100" step="10"></div>
    <div><label for="d6_entree">Prix d'entrée</label><input type="number" id="d6_entree" value="200" step="1"></div>
    <div style="flex:2;"><label for="d6_cours">Cours de compensation successifs (liste)</label><input type="text" id="d6_cours" value="204,198,205,210"></div>
  </div>
  <button onclick="calculerMarquage()">Calculer</button>
  <div id="resultatMarquage" class="resultat-zone"></div>
</div>

<div class="panneau">
  <h2>L'efficacité de la couverture comptable</h2>
  <div class="ligne">
    <div><label for="d6_gainDerive">Gain (ou perte) marqué au marché du dérivé</label><input type="number" id="d6_gainDerive" value="120000" step="1000"></div>
    <div><label for="d6_perteCouverte">Perte (valeur absolue) de l'élément couvert</label><input type="number" id="d6_perteCouverte" value="120000" step="1000"></div>
    <div><label for="d6_borneBasse">Borne basse de la fourchette (%)</label><input type="number" id="d6_borneBasse" value="80" step="1"></div>
    <div><label for="d6_borneHaute">Borne haute de la fourchette (%)</label><input type="number" id="d6_borneHaute" value="125" step="1"></div>
  </div>
  <button onclick="calculerEfficacite()">Calculer</button>
  <div id="resultatEfficacite" class="resultat-zone"></div>
</div>

<script>
function calculerMarquage() {
  var resDiv = document.getElementById('resultatMarquage');
  var contrats = parseFloat(document.getElementById('d6_contrats').value);
  var taille = parseFloat(document.getElementById('d6_taille').value);
  var entree = parseFloat(document.getElementById('d6_entree').value);
  var cours = document.getElementById('d6_cours').value.split(',').map(function (s) { return parseFloat(s.trim()); }).filter(function (x) { return !isNaN(x); });
  if (isNaN(contrats) || isNaN(taille) || isNaN(entree) || cours.length === 0) {
    resDiv.innerHTML = '<p class="erreur">Valeurs invalides.</p>';
    return;
  }
  var position = contrats * taille;
  var precedent = entree;
  var cumul = 0;
  var html = '<table class="tabres"><tr><th>jour</th><th>cours de compensation</th><th>gain / perte du jour</th><th>solde cumulé</th></tr>';
  cours.forEach(function (c, i) {
    var gain = (c - precedent) * position;
    cumul += gain;
    html += '<tr><td>' + (i + 1) + '</td><td>' + c.toLocaleString('fr-FR') + '</td><td>' + (gain >= 0 ? '+' : '') + gain.toLocaleString('fr-FR') + '</td><td>' + (cumul >= 0 ? '+' : '') + cumul.toLocaleString('fr-FR') + '</td></tr>';
    precedent = c;
  });
  html += '</table>';
  var gainUnique = (cours[cours.length - 1] - entree) * position;
  html += '<div class="valeur ok">gain cumulé (marquage quotidien) = ' + (cumul >= 0 ? '+' : '') + cumul.toLocaleString('fr-FR') + '</div>';
  html += '<div class="valeur mid">gain équivalent à règlement unique à l\'échéance = ' + (gainUnique >= 0 ? '+' : '') + gainUnique.toLocaleString('fr-FR') + '</div>';
  html += '<p class="aide">Le total est identique (un <em>future</em> et un <em>forward</em> de mêmes caractéristiques donnent le même gain final) ; seul le profil de trésorerie intermédiaire diffère.</p>';
  resDiv.innerHTML = html;
}

function calculerEfficacite() {
  var resDiv = document.getElementById('resultatEfficacite');
  var gainDerive = parseFloat(document.getElementById('d6_gainDerive').value);
  var perteCouverte = parseFloat(document.getElementById('d6_perteCouverte').value);
  var borneBasse = parseFloat(document.getElementById('d6_borneBasse').value);
  var borneHaute = parseFloat(document.getElementById('d6_borneHaute').value);
  if ([gainDerive, perteCouverte, borneBasse, borneHaute].some(isNaN) || perteCouverte === 0) {
    resDiv.innerHTML = '<p class="erreur">Valeurs invalides (la perte couverte ne peut être nulle).</p>';
    return;
  }
  var ratio = Math.abs(gainDerive) / Math.abs(perteCouverte) * 100;
  var efficace = ratio >= borneBasse && ratio <= borneHaute;

  var html = '';
  html += '<div class="valeur">résultat comptable sans comptabilité de couverture = ' + (gainDerive >= 0 ? '+' : '') + gainDerive.toLocaleString('fr-FR') + '</div>';
  html += '<div class="valeur mid">ratio d\'efficacité = ' + ratio.toFixed(1) + '%</div>';
  if (efficace) {
    html += '<div class="valeur ok">à l\'intérieur de la fourchette [' + borneBasse + '%, ' + borneHaute + '%] : couverture jugée efficace, résultat net attendu = 0</div>';
  } else {
    html += '<div class="valeur ko">hors fourchette [' + borneBasse + '%, ' + borneHaute + '%] : couverture jugée inefficace, traitement spéculatif applicable (impact immédiat de ' + (gainDerive >= 0 ? '+' : '') + gainDerive.toLocaleString('fr-FR') + ' en résultat)</div>';
  }
  resDiv.innerHTML = html;
}

window.onload = function () { calculerMarquage(); calculerEfficacite(); };
</script>
</body>
</html>
