<!DOCTYPE html>
<html lang="fr">
<head>
<script id="jm-theme-detect">
(function () {
  var t = null;
  try { t = localStorage.getItem("jm-theme"); } catch (e) {}
  if (!t) { t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light"; }
  document.documentElement.setAttribute("data-theme", t);
  window.addEventListener("storage", function (e) {
    if (e.key === "jm-theme" && e.newValue) { document.documentElement.setAttribute("data-theme", e.newValue); }
  });
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapitre 7 — La couverture par contrats à terme — Calculatrice interactive</title>
<style>
  :root { --cdef: #4A3B8C; --cintu: #E08000; --cex: #2E8B57; --ceco: #1F6FB2; --cgris: #5A5A5A; }
  * { box-sizing: border-box; }
  body { font-family: Georgia, "TeX Gyre Pagella", serif; background: #FDFDFD; color: #1a1a1a; max-width: 1150px; margin: 0 auto; padding: 1.5em; }
  h1 { font-family: "Helvetica Neue", Arial, sans-serif; color: var(--cdef); font-size: 1.5em; border-bottom: 2px solid var(--cdef); padding-bottom: 0.3em; }
  .sous-titre { color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; margin-top: -0.6em; }
  .panneau { background: white; border-left: 4px solid var(--cdef); border-radius: 6px; padding: 1em 1.2em; margin: 1em 0; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .panneau h2 { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 1.05em; color: var(--cdef); margin-top: 0; }
  label { display: block; margin: 0.6em 0 0.2em; font-size: 0.85em; color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; }
  input[type=number], input[type=text] { width: 100%; padding: 0.5em; border: 1px solid #ccc; border-radius: 4px; font-family: "Courier New", monospace; font-size: 0.9em; }
  .ligne { display: flex; gap: 1em; flex-wrap: wrap; align-items: flex-start; }
  .ligne > div { flex: 1; min-width: 150px; }
  button { margin-top: 1em; margin-right: 0.5em; background: var(--cdef); color: white; border: none; padding: 0.6em 1.4em; border-radius: 5px; font-family: "Helvetica Neue", Arial, sans-serif; font-weight: bold; cursor: pointer; font-size: 0.95em; }
  button:hover { background: #372c69; }
  .erreur { color: #b00020; font-family: "Helvetica Neue", Arial, sans-serif; font-size: 0.9em; margin-top: 0.6em; }
  .resultat-zone { margin-top: 1em; font-family: "Helvetica Neue", Arial, sans-serif; }
  .aide { font-size: 0.85em; color: var(--cgris); margin-top: 0; }
  .valeur { font-size: 1.0em; padding: 0.4em 0.7em; background: var(--cdef); color: white; border-radius: 5px; display: inline-block; margin: 0.2em 0.3em 0.2em 0; }
  .valeur.ok { background: var(--cex); }
  .valeur.ko { background: #b00020; }
  .valeur.mid { background: var(--cintu); }
  table.tabres { border-collapse: collapse; margin-top: 0.7em; font-size: 0.85em; font-family: "Courier New", monospace; }
  table.tabres th, table.tabres td { border: 1px solid #ccc; padding: 0.3em 0.6em; text-align: right; }
  table.tabres th { background: #f0f0f0; font-family: "Helvetica Neue", Arial, sans-serif; }
</style>
<style id="jm-theme-override">
/* Surcharge : palette et typographie du site jmadkour.org, synchronisee
   avec son bascule clair/sombre (voir script jm-theme-detect ci-dessus). */
:root {
  --cdef: #1f6fb2; --ceco: #1f6fb2; --cex: #1d9e75; --cintu: #b56600; --cgris: #54707f;
  --bg: #ffffff; --fg: #142a38; --border: #dbe6ee; --card-bg: #f6f9fb; --code-bg: #f3f7fa;
  --danger: #b00020; --primary-dark: #17578f;
}
:root[data-theme="dark"] {
  --cdef: #3aa0e6; --ceco: #3aa0e6; --cex: #37b47e; --cintu: #e0954a; --cgris: #9db4c0;
  --bg: #0d1b26; --fg: #e7eef3; --border: #20455a; --card-bg: #13303d; --code-bg: #0f2733;
  --danger: #e0554a; --primary-dark: #5bb3ef;
}
* { box-sizing: border-box; }
html { background: var(--bg) !important; }
body {
  background: var(--bg) !important; color: var(--fg) !important;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
}
h1, h2, .panneau h2 {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  color: var(--cdef) !important; border-color: var(--cdef) !important;
}
.sous-titre, .aide, label { color: var(--cgris) !important; }
.panneau {
  background: var(--card-bg) !important; border: 1px solid var(--border) !important;
  border-left: 1px solid var(--border) !important; border-radius: 14px !important; box-shadow: none !important;
}
input[type=number], input[type=text] {
  background: var(--bg) !important; color: var(--fg) !important; border: 1px solid var(--border) !important;
}
button {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  background: var(--cdef) !important; color: #ffffff !important; border-radius: 8px !important; border: none !important;
}
button:hover { background: var(--primary-dark) !important; }
.erreur { color: var(--danger) !important; }
.valeur { background: var(--cdef) !important; color: #ffffff !important; }
.valeur.ok { background: var(--cex) !important; }
.valeur.ko { background: var(--danger) !important; }
.valeur.mid { background: var(--cintu) !important; }
table.tabres th, table.tabres td { border-color: var(--border) !important; color: var(--fg) !important; }
table.tabres th { background: var(--code-bg) !important; }
</style>
</head>
<body>

<h1>Chapitre 7 — Application : la couverture par contrats à terme</h1>
<p class="sous-titre">Calculatrice interactive — le ratio de couverture optimal (exercice 5), couvrir un portefeuille d'actions par le bêta (exercice 6)</p>

<div class="panneau">
  <h2>Le ratio de couverture optimal</h2>
  <div class="ligne">
    <div><label for="d7_expo">Exposition à couvrir</label><input type="number" id="d7_expo" value="500000" step="10000"></div>
    <div><label for="d7_taille">Taille d'un contrat</label><input type="number" id="d7_taille" value="25000" step="1000"></div>
    <div><label for="d7_sigmaS">Écart-type du comptant (%)</label><input type="number" id="d7_sigmaS" value="8" step="0.5"></div>
    <div><label for="d7_sigmaF">Écart-type du contrat (%)</label><input type="number" id="d7_sigmaF" value="10" step="0.5"></div>
    <div><label for="d7_rho">Corrélation ρ</label><input type="number" id="d7_rho" value="0.75" step="0.05" min="-1" max="1"></div>
  </div>
  <button onclick="calculerRatioCouverture()">Calculer</button>
  <div id="resultatRatio" class="resultat-zone"></div>
</div>

<div class="panneau">
  <h2>Couvrir un portefeuille d'actions par le bêta</h2>
  <div class="ligne">
    <div><label for="d7_P">Valeur du portefeuille</label><input type="number" id="d7_P" value="15000000" step="100000"></div>
    <div><label for="d7_beta">Bêta actuel du portefeuille</label><input type="number" id="d7_beta" value="1.3" step="0.05"></div>
    <div><label for="d7_A">Valeur unitaire d'un contrat sur indice</label><input type="number" id="d7_A" value="125000" step="1000"></div>
    <div><label for="d7_betaCible">Bêta cible</label><input type="number" id="d7_betaCible" value="0.5" step="0.05"></div>
  </div>
  <button onclick="calculerCouvertureBeta()">Calculer</button>
  <div id="resultatBeta" class="resultat-zone"></div>
</div>

<script>
function calculerRatioCouverture() {
  var resDiv = document.getElementById('resultatRatio');
  var expo = parseFloat(document.getElementById('d7_expo').value);
  var taille = parseFloat(document.getElementById('d7_taille').value);
  var sigmaS = parseFloat(document.getElementById('d7_sigmaS').value) / 100;
  var sigmaF = parseFloat(document.getElementById('d7_sigmaF').value) / 100;
  var rho = parseFloat(document.getElementById('d7_rho').value);
  if ([expo, taille, sigmaS, sigmaF, rho].some(isNaN) || taille <= 0 || sigmaF <= 0 || rho < -1 || rho > 1) {
    resDiv.innerHTML = '<p class="erreur">Valeurs invalides (ρ doit être compris entre -1 et 1).</p>';
    return;
  }
  var hstar = rho * sigmaS / sigmaF;
  var efficacite = rho * rho;
  var Nstar = hstar * expo / taille;

  var html = '';
  html += '<div class="valeur">ratio de couverture optimal h* = ' + hstar.toFixed(4) + '</div>';
  html += '<div class="valeur mid">efficacité (part de variance éliminée) = ' + (efficacite * 100).toFixed(2) + '%</div>';
  html += '<div class="valeur ok">nombre de contrats N* = ' + Nstar.toFixed(2) + ' (soit ' + Math.round(Nstar) + ' après arrondi)</div>';
  html += '<div class="valeur ko">part de variance résiduelle = ' + ((1 - efficacite) * 100).toFixed(2) + '%</div>';
  resDiv.innerHTML = html;
}

function calculerCouvertureBeta() {
  var resDiv = document.getElementById('resultatBeta');
  var P = parseFloat(document.getElementById('d7_P').value);
  var beta = parseFloat(document.getElementById('d7_beta').value);
  var A = parseFloat(document.getElementById('d7_A').value);
  var betaCible = parseFloat(document.getElementById('d7_betaCible').value);
  if ([P, beta, A, betaCible].some(isNaN) || A <= 0) {
    resDiv.innerHTML = '<p class="erreur">Valeurs invalides.</p>';
    return;
  }
  var Nfull = beta * P / A;
  var Nmod = (betaCible - beta) * P / A;

  function ligneSens(n) {
    if (n > 0) return 'acheter ' + n.toFixed(2) + ' contrats (soit ' + Math.round(n) + ')';
    if (n < 0) return 'vendre ' + Math.abs(n).toFixed(2) + ' contrats (soit ' + Math.round(Math.abs(n)) + ')';
    return 'aucune opération nécessaire';
  }

  var html = '';
  html += '<div class="valeur">couverture totale (bêta cible = 0) : N* = ' + Nfull.toFixed(2) + ' → ' + ligneSens(-Nfull) + '</div>';
  html += '<div class="valeur mid">ajustement vers le bêta cible (' + betaCible + ') : N = ' + Nmod.toFixed(2) + ' → ' + ligneSens(Nmod) + '</div>';
  resDiv.innerHTML = html;
}

window.onload = function () { calculerRatioCouverture(); calculerCouvertureBeta(); };
</script>
</body>
</html>
