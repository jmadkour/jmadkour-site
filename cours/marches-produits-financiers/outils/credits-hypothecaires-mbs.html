<!DOCTYPE html>
<html lang="fr">
<head>
<script id="jm-theme-detect">
(function () {
  var t = null;
  try { t = localStorage.getItem("jm-theme"); } catch (e) {}
  if (!t) { t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light"; }
  document.documentElement.setAttribute("data-theme", t);
  window.addEventListener("storage", function (e) {
    if (e.key === "jm-theme" && e.newValue) { document.documentElement.setAttribute("data-theme", e.newValue); }
  });
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapitre 17 — Les crédits hypothécaires et les titres adossés — Calculatrice interactive</title>
<style>
  :root { --cdef: #4A3B8C; --cintu: #E08000; --cex: #2E8B57; --ceco: #1F6FB2; --cgris: #5A5A5A; }
  * { box-sizing: border-box; }
  body { font-family: Georgia, "TeX Gyre Pagella", serif; background: #FDFDFD; color: #1a1a1a; max-width: 1150px; margin: 0 auto; padding: 1.5em; }
  h1 { font-family: "Helvetica Neue", Arial, sans-serif; color: var(--cdef); font-size: 1.5em; border-bottom: 2px solid var(--cdef); padding-bottom: 0.3em; }
  .sous-titre { color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; margin-top: -0.6em; }
  .panneau { background: white; border-left: 4px solid var(--cdef); border-radius: 6px; padding: 1em 1.2em; margin: 1em 0; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .panneau h2 { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 1.05em; color: var(--cdef); margin-top: 0; }
  label { display: block; margin: 0.6em 0 0.2em; font-size: 0.85em; color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; }
  input[type=number], input[type=text] { width: 100%; padding: 0.5em; border: 1px solid #ccc; border-radius: 4px; font-family: "Courier New", monospace; font-size: 0.9em; }
  .ligne { display: flex; gap: 1em; flex-wrap: wrap; align-items: flex-start; }
  .ligne > div { flex: 1; min-width: 150px; }
  button { margin-top: 1em; margin-right: 0.5em; background: var(--cdef); color: white; border: none; padding: 0.6em 1.4em; border-radius: 5px; font-family: "Helvetica Neue", Arial, sans-serif; font-weight: bold; cursor: pointer; font-size: 0.95em; }
  button:hover { background: #372c69; }
  .erreur { color: #b00020; font-family: "Helvetica Neue", Arial, sans-serif; font-size: 0.9em; margin-top: 0.6em; }
  .resultat-zone { margin-top: 1em; font-family: "Helvetica Neue", Arial, sans-serif; }
  .aide { font-size: 0.85em; color: var(--cgris); margin-top: 0; }
  .valeur { font-size: 1.0em; padding: 0.4em 0.7em; background: var(--cdef); color: white; border-radius: 5px; display: inline-block; margin: 0.2em 0.3em 0.2em 0; }
  .valeur.ok { background: var(--cex); }
  .valeur.ko { background: #b00020; }
  .valeur.mid { background: var(--cintu); }
  table.tabres { border-collapse: collapse; margin-top: 0.7em; font-size: 0.85em; font-family: "Courier New", monospace; }
  table.tabres th, table.tabres td { border: 1px solid #ccc; padding: 0.3em 0.6em; text-align: right; }
  table.tabres th { background: #f0f0f0; font-family: "Helvetica Neue", Arial, sans-serif; }
</style>
<style id="jm-theme-override">
/* Surcharge : palette et typographie du site jmadkour.org, synchronisee
   avec son bascule clair/sombre (voir script jm-theme-detect ci-dessus). */
:root {
  --cdef: #1f6fb2; --ceco: #1f6fb2; --cex: #1d9e75; --cintu: #b56600; --cgris: #54707f;
  --bg: #ffffff; --fg: #142a38; --border: #dbe6ee; --card-bg: #f6f9fb; --code-bg: #f3f7fa;
  --danger: #b00020; --primary-dark: #17578f;
}
:root[data-theme="dark"] {
  --cdef: #3aa0e6; --ceco: #3aa0e6; --cex: #37b47e; --cintu: #e0954a; --cgris: #9db4c0;
  --bg: #0d1b26; --fg: #e7eef3; --border: #20455a; --card-bg: #13303d; --code-bg: #0f2733;
  --danger: #e0554a; --primary-dark: #5bb3ef;
}
* { box-sizing: border-box; }
html { background: var(--bg) !important; }
body {
  background: var(--bg) !important; color: var(--fg) !important;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
}
h1, h2, .panneau h2 {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  color: var(--cdef) !important; border-color: var(--cdef) !important;
}
.sous-titre, .aide, label { color: var(--cgris) !important; }
.panneau {
  background: var(--card-bg) !important; border: 1px solid var(--border) !important;
  border-left: 1px solid var(--border) !important; border-radius: 14px !important; box-shadow: none !important;
}
input[type=number], input[type=text] {
  background: var(--bg) !important; color: var(--fg) !important; border: 1px solid var(--border) !important;
}
button {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  background: var(--cdef) !important; color: #ffffff !important; border-radius: 8px !important; border: none !important;
}
button:hover { background: var(--primary-dark) !important; }
.erreur { color: var(--danger) !important; }
.valeur { background: var(--cdef) !important; color: #ffffff !important; }
.valeur.ok { background: var(--cex) !important; }
.valeur.ko { background: var(--danger) !important; }
.valeur.mid { background: var(--cintu) !important; }
table.tabres th, table.tabres td { border-color: var(--border) !important; color: var(--fg) !important; }
table.tabres th { background: var(--code-bg) !important; }
</style>
</head>
<body>

<h1>Chapitre 17 — Application : les crédits hypothécaires et les titres adossés</h1>
<p class="sous-titre">Calculatrice interactive — mensualité et décomposition intérêts-capital (exercice 5), SMM, CPR et effet sur un titre IO (exercice 6)</p>

<div class="panneau">
  <h2>Mensualité et décomposition intérêts-capital</h2>
  <div class="ligne">
    <div><label for="d17_C">Capital emprunté C</label><input type="number" id="d17_C" value="200000" step="1000"></div>
    <div><label for="d17_r">Taux annuel (%, capitalisation mensuelle)</label><input type="number" id="d17_r" value="6" step="0.1"></div>
    <div><label for="d17_n">Nombre de mensualités n</label><input type="number" id="d17_n" value="360" step="1"></div>
  </div>
  <div class="ligne">
    <div><label for="d17_Rsem">Taux affiché ailleurs (%, capitalisation semestrielle)</label><input type="number" id="d17_Rsem" value="5" step="0.1"></div>
  </div>
  <button onclick="calculerMensualite()">Calculer</button>
  <div id="resultatMensualite" class="resultat-zone"></div>
</div>

<div class="panneau">
  <h2>SMM, CPR et effet sur un titre IO</h2>
  <div class="ligne">
    <div><label for="d17b_capital">Capital restant dû en début de mois</label><input type="number" id="d17b_capital" value="500000" step="1000"></div>
    <div><label for="d17b_remboursements">Remboursements anticipés du mois</label><input type="number" id="d17b_remboursements" value="7500" step="100"></div>
  </div>
  <div class="ligne">
    <div><label for="d17b_C0">Capital initial du pool (scénarios)</label><input type="number" id="d17b_C0" value="500000" step="1000"></div>
    <div><label for="d17b_CPRbas">CPR scénario « taux stables » (%)</label><input type="number" id="d17b_CPRbas" value="6" step="1"></div>
    <div><label for="d17b_CPRhaut">CPR scénario « forte baisse » (%)</label><input type="number" id="d17b_CPRhaut" value="40" step="1"></div>
  </div>
  <button onclick="calculerPrepaiement()">Calculer</button>
  <div id="resultatPrepaiement" class="resultat-zone"></div>
</div>

<script>
function calculerMensualite() {
  var resDiv = document.getElementById('resultatMensualite');
  var C = parseFloat(document.getElementById('d17_C').value);
  var r = parseFloat(document.getElementById('d17_r').value) / 100;
  var n = parseFloat(document.getElementById('d17_n').value);
  var Rsem = parseFloat(document.getElementById('d17_Rsem').value) / 100;

  if ([C, r, n, Rsem].some(isNaN) || n <= 0) {
    resDiv.innerHTML = '<p class="erreur">Valeurs invalides.</p>';
    return;
  }

  var rMensuel = r / 12;
  var X = C * rMensuel / (1 - Math.pow(1 + rMensuel, -n));
  var interet1 = C * rMensuel;
  var capital1 = X - interet1;
  var capitalRestant1 = C - capital1;
  var interet2 = capitalRestant1 * rMensuel;
  var capital2 = X - interet2;

  var tauxMensuelConverti = 12 * (Math.pow(1 + Rsem / 2, 2 / 12) - 1);
  var tauxMensuelDirect = Rsem;

  var html = '';
  html += '<div class="valeur">mensualité X = ' + X.toFixed(4) + '</div>';
  html += '<table class="tabres">';
  html += '<tr><th></th><th>intérêts</th><th>capital</th><th>capital restant après</th></tr>';
  html += '<tr><th>mois 1</th><td>' + interet1.toFixed(2) + '</td><td>' + capital1.toFixed(2) + '</td><td>' + capitalRestant1.toFixed(2) + '</td></tr>';
  html += '<tr><th>mois 2</th><td>' + interet2.toFixed(2) + '</td><td>' + capital2.toFixed(2) + '</td><td>' + (capitalRestant1 - capital2).toFixed(2) + '</td></tr>';
  html += '</table>';
  html += (interet2 < interet1
    ? '<div class="valeur ok">la part d\'intérêts diminue bien mois après mois</div>'
    : '<div class="valeur ko">anomalie : la part d\'intérêts n\'a pas diminué</div>');
  html += '<table class="tabres">';
  html += '<tr><th>taux mensuel équivalent (conversion semestrielle → mensuelle)</th><td>' + (tauxMensuelConverti * 100).toFixed(4) + '%</td></tr>';
  html += '<tr><th>taux affiché tel quel (convention américaine directe)</th><td>' + (tauxMensuelDirect * 100).toFixed(4) + '%</td></tr>';
  html += '</table>';
  resDiv.innerHTML = html;
}

function calculerPrepaiement() {
  var resDiv = document.getElementById('resultatPrepaiement');
  var capital = parseFloat(document.getElementById('d17b_capital').value);
  var remboursements = parseFloat(document.getElementById('d17b_remboursements').value);
  var C0 = parseFloat(document.getElementById('d17b_C0').value);
  var CPRbas = parseFloat(document.getElementById('d17b_CPRbas').value) / 100;
  var CPRhaut = parseFloat(document.getElementById('d17b_CPRhaut').value) / 100;

  if ([capital, remboursements, C0, CPRbas, CPRhaut].some(isNaN) || capital <= 0) {
    resDiv.innerHTML = '<p class="erreur">Valeurs invalides.</p>';
    return;
  }

  var SMM = remboursements / capital;
  var CPR = 1 - Math.pow(1 - SMM, 12);

  var resteBas = C0 * (1 - CPRbas);
  var resteHaut = C0 * (1 - CPRhaut);
  var ecart = resteBas - resteHaut;
  var reductionRelative = resteBas !== 0 ? ecart / resteBas : NaN;

  var html = '';
  html += '<div class="valeur mid">SMM = ' + (SMM * 100).toFixed(2) + '%</div>';
  html += '<div class="valeur mid">CPR (annualisé) = ' + (CPR * 100).toFixed(2) + '%</div>';
  html += '<table class="tabres">';
  html += '<tr><th>capital restant après 1 an, CPR = ' + (CPRbas * 100).toFixed(0) + '%</th><td>' + resteBas.toFixed(2) + '</td></tr>';
  html += '<tr><th>capital restant après 1 an, CPR = ' + (CPRhaut * 100).toFixed(0) + '%</th><td>' + resteHaut.toFixed(2) + '</td></tr>';
  html += '<tr><th>écart</th><td>' + ecart.toFixed(2) + '</td></tr>';
  html += '<tr><th>réduction relative de la base restante</th><td>' + (reductionRelative * 100).toFixed(2) + '%</td></tr>';
  html += '</table>';
  html += '<p class="aide">Le IO ne perçoit des intérêts que sur le capital encore présent dans le pool : une base réduite se traduit directement par une chute de sa valeur.</p>';
  resDiv.innerHTML = html;
}

window.onload = function () { calculerMensualite(); calculerPrepaiement(); };
</script>
</body>
</html>
