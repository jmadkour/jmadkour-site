<!DOCTYPE html>
<html lang="fr">
<head>
<script id="jm-theme-detect">
(function () {
  var t = null;
  try { t = localStorage.getItem("jm-theme"); } catch (e) {}
  if (!t) { t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light"; }
  document.documentElement.setAttribute("data-theme", t);
  window.addEventListener("storage", function (e) {
    if (e.key === "jm-theme" && e.newValue) { document.documentElement.setAttribute("data-theme", e.newValue); }
  });
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapitre 9 — L'évaluation des contrats à terme financiers — Calculatrice interactive</title>
<style>
  :root { --cdef: #4A3B8C; --cintu: #E08000; --cex: #2E8B57; --ceco: #1F6FB2; --cgris: #5A5A5A; }
  * { box-sizing: border-box; }
  body { font-family: Georgia, "TeX Gyre Pagella", serif; background: #FDFDFD; color: #1a1a1a; max-width: 1150px; margin: 0 auto; padding: 1.5em; }
  h1 { font-family: "Helvetica Neue", Arial, sans-serif; color: var(--cdef); font-size: 1.5em; border-bottom: 2px solid var(--cdef); padding-bottom: 0.3em; }
  .sous-titre { color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; margin-top: -0.6em; }
  .panneau { background: white; border-left: 4px solid var(--cdef); border-radius: 6px; padding: 1em 1.2em; margin: 1em 0; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .panneau h2 { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 1.05em; color: var(--cdef); margin-top: 0; }
  label { display: block; margin: 0.6em 0 0.2em; font-size: 0.85em; color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; }
  input[type=number], input[type=text] { width: 100%; padding: 0.5em; border: 1px solid #ccc; border-radius: 4px; font-family: "Courier New", monospace; font-size: 0.9em; }
  .ligne { display: flex; gap: 1em; flex-wrap: wrap; align-items: flex-start; }
  .ligne > div { flex: 1; min-width: 150px; }
  button { margin-top: 1em; margin-right: 0.5em; background: var(--cdef); color: white; border: none; padding: 0.6em 1.4em; border-radius: 5px; font-family: "Helvetica Neue", Arial, sans-serif; font-weight: bold; cursor: pointer; font-size: 0.95em; }
  button:hover { background: #372c69; }
  .erreur { color: #b00020; font-family: "Helvetica Neue", Arial, sans-serif; font-size: 0.9em; margin-top: 0.6em; }
  .resultat-zone { margin-top: 1em; font-family: "Helvetica Neue", Arial, sans-serif; }
  .aide { font-size: 0.85em; color: var(--cgris); margin-top: 0; }
  .valeur { font-size: 1.0em; padding: 0.4em 0.7em; background: var(--cdef); color: white; border-radius: 5px; display: inline-block; margin: 0.2em 0.3em 0.2em 0; }
  .valeur.ok { background: var(--cex); }
  .valeur.ko { background: #b00020; }
  .valeur.mid { background: var(--cintu); }
  table.tabres { border-collapse: collapse; margin-top: 0.7em; font-size: 0.85em; font-family: "Courier New", monospace; }
  table.tabres th, table.tabres td { border: 1px solid #ccc; padding: 0.3em 0.6em; text-align: right; }
  table.tabres th { background: #f0f0f0; font-family: "Helvetica Neue", Arial, sans-serif; }
</style>
<style id="jm-theme-override">
/* Surcharge : palette et typographie du site jmadkour.org, synchronisee
   avec son bascule clair/sombre (voir script jm-theme-detect ci-dessus). */
:root {
  --cdef: #1f6fb2; --ceco: #1f6fb2; --cex: #1d9e75; --cintu: #b56600; --cgris: #54707f;
  --bg: #ffffff; --fg: #142a38; --border: #dbe6ee; --card-bg: #f6f9fb; --code-bg: #f3f7fa;
  --danger: #b00020; --primary-dark: #17578f;
}
:root[data-theme="dark"] {
  --cdef: #3aa0e6; --ceco: #3aa0e6; --cex: #37b47e; --cintu: #e0954a; --cgris: #9db4c0;
  --bg: #0d1b26; --fg: #e7eef3; --border: #20455a; --card-bg: #13303d; --code-bg: #0f2733;
  --danger: #e0554a; --primary-dark: #5bb3ef;
}
* { box-sizing: border-box; }
html { background: var(--bg) !important; }
body {
  background: var(--bg) !important; color: var(--fg) !important;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
}
h1, h2, .panneau h2 {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  color: var(--cdef) !important; border-color: var(--cdef) !important;
}
.sous-titre, .aide, label { color: var(--cgris) !important; }
.panneau {
  background: var(--card-bg) !important; border: 1px solid var(--border) !important;
  border-left: 1px solid var(--border) !important; border-radius: 14px !important; box-shadow: none !important;
}
input[type=number], input[type=text] {
  background: var(--bg) !important; color: var(--fg) !important; border: 1px solid var(--border) !important;
}
button {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  background: var(--cdef) !important; color: #ffffff !important; border-radius: 8px !important; border: none !important;
}
button:hover { background: var(--primary-dark) !important; }
.erreur { color: var(--danger) !important; }
.valeur { background: var(--cdef) !important; color: #ffffff !important; }
.valeur.ok { background: var(--cex) !important; }
.valeur.ko { background: var(--danger) !important; }
.valeur.mid { background: var(--cintu) !important; }
table.tabres th, table.tabres td { border-color: var(--border) !important; color: var(--fg) !important; }
table.tabres th { background: var(--code-bg) !important; }
</style>
</head>
<body>

<h1>Chapitre 9 — Application : l'évaluation des contrats à terme financiers</h1>
<p class="sous-titre">Calculatrice interactive — évaluer un contrat à terme sur action (exercice 5), la valeur d'un contrat en cours de vie (exercice 6)</p>

<div class="panneau">
  <h2>Évaluer un contrat à terme sur action</h2>
  <div class="ligne">
    <div><label for="d9_S0">Prix comptant S0</label><input type="number" id="d9_S0" value="250" step="1"></div>
    <div><label for="d9_r">Taux sans risque r (%, composé en continu)</label><input type="number" id="d9_r" value="4" step="0.1"></div>
    <div><label for="d9_T">Échéance T (années)</label><input type="number" id="d9_T" value="0.5" step="0.05"></div>
    <div><label for="d9_I">Valeur actuelle des revenus connus I</label><input type="number" id="d9_I" value="6" step="0.5"></div>
    <div><label for="d9_q">Rendement continu q (%, alternative à I)</label><input type="number" id="d9_q" value="2" step="0.1"></div>
    <div><label for="d9_Fmarche">Prix observé sur le marché (optionnel)</label><input type="number" id="d9_Fmarche" value="260" step="1"></div>
  </div>
  <button onclick="calculerPrixTerme()">Calculer</button>
  <div id="resultatPrixTerme" class="resultat-zone"></div>
</div>

<div class="panneau">
  <h2>La valeur d'un contrat en cours de vie</h2>
  <div class="ligne">
    <div><label for="d9_K">Prix d'exercice K (fixé à la conclusion)</label><input type="number" id="d9_K" value="104" step="1"></div>
    <div><label for="d9_S0p">Prix comptant actuel S0'</label><input type="number" id="d9_S0p" value="108" step="1"></div>
    <div><label for="d9_rvie">Taux sans risque r (%, composé en continu)</label><input type="number" id="d9_rvie" value="4" step="0.1"></div>
    <div><label for="d9_Tvie">Échéance restante T (années)</label><input type="number" id="d9_Tvie" value="0.75" step="0.05"></div>
  </div>
  <button onclick="calculerValeurEnCours()">Calculer</button>
  <div id="resultatValeur" class="resultat-zone"></div>
</div>

<script>
function calculerPrixTerme() {
  var resDiv = document.getElementById('resultatPrixTerme');
  var S0 = parseFloat(document.getElementById('d9_S0').value);
  var r = parseFloat(document.getElementById('d9_r').value) / 100;
  var T = parseFloat(document.getElementById('d9_T').value);
  var I = parseFloat(document.getElementById('d9_I').value);
  var q = parseFloat(document.getElementById('d9_q').value) / 100;
  var Fmarche = parseFloat(document.getElementById('d9_Fmarche').value);
  if ([S0, r, T, I, q].some(isNaN) || S0 <= 0 || T <= 0) {
    resDiv.innerHTML = '<p class="erreur">Valeurs invalides.</p>';
    return;
  }
  var F0sansRevenu = S0 * Math.exp(r * T);
  var F0avecI = (S0 - I) * Math.exp(r * T);
  var F0indice = S0 * Math.exp((r - q) * T);

  var html = '';
  html += '<table class="tabres">';
  html += '<tr><th>sans revenu, F0 = S0 e^(rT)</th><td>' + F0sansRevenu.toFixed(2) + '</td></tr>';
  html += '<tr><th>avec revenu connu I, F0 = (S0-I) e^(rT)</th><td>' + F0avecI.toFixed(2) + '</td></tr>';
  html += '<tr><th>avec rendement continu q, F0 = S0 e^((r-q)T)</th><td>' + F0indice.toFixed(2) + '</td></tr>';
  html += '</table>';

  if (!isNaN(Fmarche)) {
    var ecart = Fmarche - F0avecI;
    if (Math.abs(ecart) > 0.005) {
      html += '<div class="valeur ' + (ecart > 0 ? 'ko' : 'mid') + '">écart entre prix de marché (' + Fmarche.toFixed(2) + ') et F0 avec revenu connu (' + F0avecI.toFixed(2) + ') = ' + ecart.toFixed(2) + '</div>';
      if (ecart > 0) {
        html += '<p class="aide">Le marché surcote le contrat : emprunter (S0-I), acheter l\'actif au comptant, vendre à terme au prix de marché ; profit certain par unité = ' + ecart.toFixed(2) + '.</p>';
      } else {
        html += '<p class="aide">Le marché sous-cote le contrat : vendre l\'actif à découvert, placer le produit, acheter à terme au prix de marché ; profit certain par unité = ' + (-ecart).toFixed(2) + '.</p>';
      }
    } else {
      html += '<div class="valeur ok">le prix de marché coïncide avec le prix théorique : aucun arbitrage possible</div>';
    }
  }
  resDiv.innerHTML = html;
}

function calculerValeurEnCours() {
  var resDiv = document.getElementById('resultatValeur');
  var K = parseFloat(document.getElementById('d9_K').value);
  var S0p = parseFloat(document.getElementById('d9_S0p').value);
  var r = parseFloat(document.getElementById('d9_rvie').value) / 100;
  var T = parseFloat(document.getElementById('d9_Tvie').value);
  if ([K, S0p, r, T].some(isNaN) || S0p <= 0 || T < 0) {
    resDiv.innerHTML = '<p class="erreur">Valeurs invalides.</p>';
    return;
  }
  var F0p = S0p * Math.exp(r * T);
  var f = (F0p - K) * Math.exp(-r * T);

  var html = '';
  html += '<div class="valeur">prix à terme actuel F0\' = ' + F0p.toFixed(2) + '</div>';
  html += '<div class="valeur ' + (f >= 0 ? 'ok' : 'ko') + '">valeur du contrat f = ' + f.toFixed(2) + ' (' + (f >= 0 ? 'favorable' : 'défavorable') + ' à la position longue)</div>';
  html += '<p class="aide">Lorsque T tend vers 0, F0\' tend vers le prix comptant S_T (convergence), et f tend vers S_T − K, le profil de gain terminal d\'une position longue.</p>';
  resDiv.innerHTML = html;
}

window.onload = function () { calculerPrixTerme(); calculerValeurEnCours(); };
</script>
</body>
</html>
