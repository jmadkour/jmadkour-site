<!DOCTYPE html>
<html lang="fr">
<head>
<script id="jm-theme-detect">
(function () {
  var t = null;
  try { t = localStorage.getItem("jm-theme"); } catch (e) {}
  if (!t) { t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light"; }
  document.documentElement.setAttribute("data-theme", t);
  window.addEventListener("storage", function (e) {
    if (e.key === "jm-theme" && e.newValue) { document.documentElement.setAttribute("data-theme", e.newValue); }
  });
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapitre 3 — Introduction aux produits dérivés — Calculatrice interactive</title>
<style>
  :root { --cdef: #4A3B8C; --cintu: #E08000; --cex: #2E8B57; --ceco: #1F6FB2; --cgris: #5A5A5A; }
  * { box-sizing: border-box; }
  body { font-family: Georgia, "TeX Gyre Pagella", serif; background: #FDFDFD; color: #1a1a1a; max-width: 1150px; margin: 0 auto; padding: 1.5em; }
  h1 { font-family: "Helvetica Neue", Arial, sans-serif; color: var(--cdef); font-size: 1.5em; border-bottom: 2px solid var(--cdef); padding-bottom: 0.3em; }
  .sous-titre { color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; margin-top: -0.6em; }
  .panneau { background: white; border-left: 4px solid var(--cdef); border-radius: 6px; padding: 1em 1.2em; margin: 1em 0; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .panneau h2 { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 1.05em; color: var(--cdef); margin-top: 0; }
  label { display: block; margin: 0.6em 0 0.2em; font-size: 0.85em; color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; }
  input[type=number], input[type=text], select { width: 100%; padding: 0.5em; border: 1px solid #ccc; border-radius: 4px; font-family: "Courier New", monospace; font-size: 0.9em; }
  .ligne { display: flex; gap: 1em; flex-wrap: wrap; align-items: flex-start; }
  .ligne > div { flex: 1; min-width: 150px; }
  button { margin-top: 1em; margin-right: 0.5em; background: var(--cdef); color: white; border: none; padding: 0.6em 1.4em; border-radius: 5px; font-family: "Helvetica Neue", Arial, sans-serif; font-weight: bold; cursor: pointer; font-size: 0.95em; }
  button:hover { background: #372c69; }
  .erreur { color: #b00020; font-family: "Helvetica Neue", Arial, sans-serif; font-size: 0.9em; margin-top: 0.6em; }
  .resultat-zone { margin-top: 1em; font-family: "Helvetica Neue", Arial, sans-serif; }
  .aide { font-size: 0.85em; color: var(--cgris); margin-top: 0; }
  .valeur { font-size: 1.0em; padding: 0.4em 0.7em; background: var(--cdef); color: white; border-radius: 5px; display: inline-block; margin: 0.2em 0.3em 0.2em 0; }
  .valeur.ok { background: var(--cex); }
  .valeur.ko { background: #b00020; }
  .valeur.mid { background: var(--cintu); }
  table.tabres { border-collapse: collapse; margin-top: 0.7em; font-size: 0.85em; font-family: "Courier New", monospace; }
  table.tabres th, table.tabres td { border: 1px solid #ccc; padding: 0.3em 0.6em; text-align: right; }
  table.tabres th { background: #f0f0f0; font-family: "Helvetica Neue", Arial, sans-serif; }
  svg.grapheco { width: 100%; max-width: 500px; height: auto; margin-top: 0.8em; display: block; }
  svg.grapheco text { font-family: "Helvetica Neue", Arial, sans-serif; }
</style>
<style id="jm-theme-override">
/* Surcharge : palette et typographie du site jmadkour.org, synchronisee
   avec son bascule clair/sombre (voir script jm-theme-detect ci-dessus). */
:root {
  --cdef: #1f6fb2; --ceco: #1f6fb2; --cex: #1d9e75; --cintu: #b56600; --cgris: #54707f;
  --bg: #ffffff; --fg: #142a38; --border: #dbe6ee; --card-bg: #f6f9fb; --code-bg: #f3f7fa;
  --danger: #b00020; --primary-dark: #17578f;
}
:root[data-theme="dark"] {
  --cdef: #3aa0e6; --ceco: #3aa0e6; --cex: #37b47e; --cintu: #e0954a; --cgris: #9db4c0;
  --bg: #0d1b26; --fg: #e7eef3; --border: #20455a; --card-bg: #13303d; --code-bg: #0f2733;
  --danger: #e0554a; --primary-dark: #5bb3ef;
}
* { box-sizing: border-box; }
html { background: var(--bg) !important; }
body {
  background: var(--bg) !important; color: var(--fg) !important;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
}
h1, h2, .panneau h2 {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  color: var(--cdef) !important; border-color: var(--cdef) !important;
}
.sous-titre, .aide, label { color: var(--cgris) !important; }
.panneau {
  background: var(--card-bg) !important; border: 1px solid var(--border) !important;
  border-left: 1px solid var(--border) !important; border-radius: 14px !important; box-shadow: none !important;
}
input[type=number], input[type=text], select, textarea {
  background: var(--bg) !important; color: var(--fg) !important; border: 1px solid var(--border) !important;
}
button {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  background: var(--cdef) !important; color: #ffffff !important; border-radius: 8px !important; border: none !important;
}
button:hover { background: var(--primary-dark) !important; }
.erreur { color: var(--danger) !important; }
.valeur { background: var(--cdef) !important; color: #ffffff !important; }
.valeur.ok { background: var(--cex) !important; }
.valeur.ko { background: var(--danger) !important; }
.valeur.mid { background: var(--cintu) !important; }
table.tabres th, table.tabres td { border-color: var(--border) !important; color: var(--fg) !important; }
table.tabres th { background: var(--code-bg) !important; }
svg.grapheco text { fill: var(--fg) !important; }
svg.grapheco .axe { stroke: var(--cgris) !important; }
svg.grapheco .courbe-acheteur { stroke: var(--cdef) !important; fill: none; }
svg.grapheco .courbe-vendeur { stroke: var(--cintu) !important; fill: none; }
</style>
</head>
<body>

<h1>Chapitre 3 — Application : introduction aux produits dérivés</h1>
<p class="sous-titre">Calculatrice interactive — couvrir une créance en devises par un contrat à terme (exercice 5), profil de gain d'une option (exercice 6)</p>

<div class="panneau">
  <h2>Couvrir une créance en devises par un contrat à terme</h2>
  <div class="ligne">
    <div><label for="d3_montant">Montant de la créance (devise)</label><input type="number" id="d3_montant" value="1000000" step="10000"></div>
    <div><label for="d3_K">Cours à terme K</label><input type="number" id="d3_K" value="9.95" step="0.05"></div>
    <div style="flex:2;"><label for="d3_spots">Scénarios de cours au comptant (liste)</label><input type="text" id="d3_spots" value="9.70,9.90,10.10,10.30"></div>
  </div>
  <button onclick="calculerCouverture()">Calculer</button>
  <div id="resultatCouv" class="resultat-zone"></div>
</div>

<div class="panneau">
  <h2>Le profil de gain d'une option</h2>
  <div class="ligne">
    <div><label for="d3_type">Type</label>
      <select id="d3_type"><option value="call" selected>Call (achat)</option><option value="put">Put (vente)</option></select>
    </div>
    <div><label for="d3_Kopt">Prix d'exercice K</label><input type="number" id="d3_Kopt" value="120" step="5"></div>
    <div><label for="d3_prime">Prime</label><input type="number" id="d3_prime" value="8" step="1"></div>
    <div style="flex:2;"><label for="d3_spotsOpt">Valeurs de $S_T$ à l'échéance (liste)</label><input type="text" id="d3_spotsOpt" value="100,110,120,130,140,150"></div>
  </div>
  <button onclick="calculerOption()">Calculer</button>
  <div id="resultatOption" class="resultat-zone"></div>
</div>

<script>
function calculerCouverture() {
  var resDiv = document.getElementById('resultatCouv');
  var montant = parseFloat(document.getElementById('d3_montant').value);
  var K = parseFloat(document.getElementById('d3_K').value);
  var spots = document.getElementById('d3_spots').value.split(',').map(function (s) { return parseFloat(s.trim()); }).filter(function (x) { return !isNaN(x); });
  if (isNaN(montant) || isNaN(K) || spots.length === 0) {
    resDiv.innerHTML = '<p class="erreur">Valeurs invalides.</p>';
    return;
  }
  var html = '<table class="tabres"><tr><th>S_T</th><th>non couvert</th><th>gain terme</th><th>total couvert</th></tr>';
  spots.forEach(function (ST) {
    var nonCouvert = ST * montant;
    var gainForward = (K - ST) * montant;
    var couvert = nonCouvert + gainForward;
    html += '<tr><td>' + ST.toFixed(2) + '</td><td>' + nonCouvert.toLocaleString('fr-FR') + '</td><td>' + gainForward.toLocaleString('fr-FR', {maximumFractionDigits: 0}) + '</td><td>' + couvert.toLocaleString('fr-FR', {maximumFractionDigits: 0}) + '</td></tr>';
  });
  html += '</table>';
  html += '<div class="valeur ok">recette totale couverte, constante = K × montant = ' + (K * montant).toLocaleString('fr-FR') + '</div>';
  resDiv.innerHTML = html;
}

function svgNS(tag) { return document.createElementNS('http://www.w3.org/2000/svg', tag); }

function calculerOption() {
  var resDiv = document.getElementById('resultatOption');
  var type = document.getElementById('d3_type').value;
  var K = parseFloat(document.getElementById('d3_Kopt').value);
  var prime = parseFloat(document.getElementById('d3_prime').value);
  var spots = document.getElementById('d3_spotsOpt').value.split(',').map(function (s) { return parseFloat(s.trim()); }).filter(function (x) { return !isNaN(x); });
  if (isNaN(K) || isNaN(prime) || spots.length === 0) {
    resDiv.innerHTML = '<p class="erreur">Valeurs invalides.</p>';
    return;
  }
  function payoff(ST) { return type === 'call' ? Math.max(ST - K, 0) : Math.max(K - ST, 0); }

  var html = '<table class="tabres"><tr><th>S_T</th>';
  spots.forEach(function (ST) { html += '<th>' + ST + '</th>'; });
  html += '</tr><tr><th>gain brut</th>';
  spots.forEach(function (ST) { html += '<td>' + payoff(ST).toFixed(2) + '</td>'; });
  html += '</tr><tr><th>profit acheteur</th>';
  spots.forEach(function (ST) { html += '<td>' + (payoff(ST) - prime).toFixed(2) + '</td>'; });
  html += '</tr><tr><th>profit vendeur</th>';
  spots.forEach(function (ST) { html += '<td>' + (prime - payoff(ST)).toFixed(2) + '</td>'; });
  html += '</tr></table>';

  var seuil = type === 'call' ? K + prime : K - prime;
  html += '<div class="valeur mid">seuil de rentabilité de l\'acheteur : S_T = ' + seuil.toFixed(2) + '</div>';
  html += '<div class="valeur ok">perte maximale de l\'acheteur : ' + prime.toFixed(2) + ' (la prime)</div>';
  html += '<div class="valeur ko">perte du vendeur : non plafonnée (illimitée pour un call, jusqu\'à K pour un put)</div>';

  var W = 480, H = 300, margin = 50;
  var STmin = Math.min.apply(null, spots) * 0.9, STmax = Math.max.apply(null, spots) * 1.1;
  var profits = spots.map(function (ST) { return payoff(ST) - prime; });
  var Pmax = Math.max.apply(null, profits.concat([prime])) + 5;
  var Pmin = Math.min.apply(null, profits.concat([-prime])) - 5;
  function px(x) { return margin + (x - STmin) / (STmax - STmin) * (W - 2 * margin); }
  function py(y) { return H - margin - (y - Pmin) / (Pmax - Pmin) * (H - 2 * margin); }

  var svg = svgNS('svg');
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.setAttribute('class', 'grapheco');
  var axeX = svgNS('line'); axeX.setAttribute('x1', margin); axeX.setAttribute('x2', W - margin); axeX.setAttribute('y1', py(0)); axeX.setAttribute('y2', py(0)); axeX.setAttribute('class', 'axe'); axeX.setAttribute('stroke-width', '1.2');
  svg.appendChild(axeX);
  var axeY = svgNS('line'); axeY.setAttribute('x1', margin); axeY.setAttribute('x2', margin); axeY.setAttribute('y1', margin); axeY.setAttribute('y2', H - margin); axeY.setAttribute('class', 'axe'); axeY.setAttribute('stroke-width', '1.2');
  svg.appendChild(axeY);
  var lblX = svgNS('text'); lblX.setAttribute('x', W - margin); lblX.setAttribute('y', py(0) + 16); lblX.setAttribute('text-anchor', 'end'); lblX.setAttribute('font-size', '10'); lblX.textContent = 'S_T';
  svg.appendChild(lblX);

  var pathD = '';
  var nPts = 40;
  for (var i = 0; i <= nPts; i++) {
    var ST = STmin + (STmax - STmin) * i / nPts;
    var profit = payoff(ST) - prime;
    pathD += (i === 0 ? 'M' : 'L') + px(ST).toFixed(1) + ',' + py(profit).toFixed(1) + ' ';
  }
  var path = svgNS('path');
  path.setAttribute('d', pathD);
  path.setAttribute('class', 'courbe-acheteur');
  path.setAttribute('stroke-width', '2.5');
  svg.appendChild(path);

  resDiv.innerHTML = '';
  var wrap = document.createElement('div');
  wrap.innerHTML = html;
  wrap.appendChild(svg);
  resDiv.appendChild(wrap);
}

window.onload = function () { calculerCouverture(); calculerOption(); };
</script>
</body>
</html>
