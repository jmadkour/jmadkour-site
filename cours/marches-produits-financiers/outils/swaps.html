<!DOCTYPE html>
<html lang="fr">
<head>
<script id="jm-theme-detect">
(function () {
  var t = null;
  try { t = localStorage.getItem("jm-theme"); } catch (e) {}
  if (!t) { t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light"; }
  document.documentElement.setAttribute("data-theme", t);
  window.addEventListener("storage", function (e) {
    if (e.key === "jm-theme" && e.newValue) { document.documentElement.setAttribute("data-theme", e.newValue); }
  });
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapitre 19 — Les swaps — Calculatrice interactive</title>
<style>
  :root { --cdef: #4A3B8C; --cintu: #E08000; --cex: #2E8B57; --ceco: #1F6FB2; --cgris: #5A5A5A; }
  * { box-sizing: border-box; }
  body { font-family: Georgia, "TeX Gyre Pagella", serif; background: #FDFDFD; color: #1a1a1a; max-width: 1150px; margin: 0 auto; padding: 1.5em; }
  h1 { font-family: "Helvetica Neue", Arial, sans-serif; color: var(--cdef); font-size: 1.5em; border-bottom: 2px solid var(--cdef); padding-bottom: 0.3em; }
  .sous-titre { color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; margin-top: -0.6em; }
  .panneau { background: white; border-left: 4px solid var(--cdef); border-radius: 6px; padding: 1em 1.2em; margin: 1em 0; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .panneau h2 { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 1.05em; color: var(--cdef); margin-top: 0; }
  label { display: block; margin: 0.6em 0 0.2em; font-size: 0.85em; color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; }
  input[type=number], input[type=text] { width: 100%; padding: 0.5em; border: 1px solid #ccc; border-radius: 4px; font-family: "Courier New", monospace; font-size: 0.9em; }
  .ligne { display: flex; gap: 1em; flex-wrap: wrap; align-items: flex-start; }
  .ligne > div { flex: 1; min-width: 150px; }
  button { margin-top: 1em; margin-right: 0.5em; background: var(--cdef); color: white; border: none; padding: 0.6em 1.4em; border-radius: 5px; font-family: "Helvetica Neue", Arial, sans-serif; font-weight: bold; cursor: pointer; font-size: 0.95em; }
  button:hover { background: #372c69; }
  .erreur { color: #b00020; font-family: "Helvetica Neue", Arial, sans-serif; font-size: 0.9em; margin-top: 0.6em; }
  .resultat-zone { margin-top: 1em; font-family: "Helvetica Neue", Arial, sans-serif; }
  .aide { font-size: 0.85em; color: var(--cgris); margin-top: 0; }
  .valeur { font-size: 1.0em; padding: 0.4em 0.7em; background: var(--cdef); color: white; border-radius: 5px; display: inline-block; margin: 0.2em 0.3em 0.2em 0; }
  .valeur.ok { background: var(--cex); }
  .valeur.ko { background: #b00020; }
  .valeur.mid { background: var(--cintu); }
  table.tabres { border-collapse: collapse; margin-top: 0.7em; font-size: 0.85em; font-family: "Courier New", monospace; }
  table.tabres th, table.tabres td { border: 1px solid #ccc; padding: 0.3em 0.6em; text-align: right; }
  table.tabres th { background: #f0f0f0; font-family: "Helvetica Neue", Arial, sans-serif; }
</style>
<style id="jm-theme-override">
/* Surcharge : palette et typographie du site jmadkour.org, synchronisee
   avec son bascule clair/sombre (voir script jm-theme-detect ci-dessus). */
:root {
  --cdef: #1f6fb2; --ceco: #1f6fb2; --cex: #1d9e75; --cintu: #b56600; --cgris: #54707f;
  --bg: #ffffff; --fg: #142a38; --border: #dbe6ee; --card-bg: #f6f9fb; --code-bg: #f3f7fa;
  --danger: #b00020; --primary-dark: #17578f;
}
:root[data-theme="dark"] {
  --cdef: #3aa0e6; --ceco: #3aa0e6; --cex: #37b47e; --cintu: #e0954a; --cgris: #9db4c0;
  --bg: #0d1b26; --fg: #e7eef3; --border: #20455a; --card-bg: #13303d; --code-bg: #0f2733;
  --danger: #e0554a; --primary-dark: #5bb3ef;
}
* { box-sizing: border-box; }
html { background: var(--bg) !important; }
body {
  background: var(--bg) !important; color: var(--fg) !important;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
}
h1, h2, .panneau h2 {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  color: var(--cdef) !important; border-color: var(--cdef) !important;
}
.sous-titre, .aide, label { color: var(--cgris) !important; }
.panneau {
  background: var(--card-bg) !important; border: 1px solid var(--border) !important;
  border-left: 1px solid var(--border) !important; border-radius: 14px !important; box-shadow: none !important;
}
input[type=number], input[type=text] {
  background: var(--bg) !important; color: var(--fg) !important; border: 1px solid var(--border) !important;
}
button {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  background: var(--cdef) !important; color: #ffffff !important; border-radius: 8px !important; border: none !important;
}
button:hover { background: var(--primary-dark) !important; }
.erreur { color: var(--danger) !important; }
.valeur { background: var(--cdef) !important; color: #ffffff !important; }
.valeur.ok { background: var(--cex) !important; }
.valeur.ko { background: var(--danger) !important; }
.valeur.mid { background: var(--cintu) !important; }
table.tabres th, table.tabres td { border-color: var(--border) !important; color: var(--fg) !important; }
table.tabres th { background: var(--code-bg) !important; }
</style>
</head>
<body>

<h1>Chapitre 19 — Application : les swaps</h1>
<p class="sous-titre">Calculatrice interactive — avantage comparatif et partage du gain (exercice 5), évaluation d'un swap par la méthode du swap neuf (exercice 6)</p>

<div class="panneau">
  <h2>Avantage comparatif et partage du gain</h2>
  <div class="ligne">
    <div><label for="d19_fixeA">Taux fixe de A (%)</label><input type="number" id="d19_fixeA" value="5.2" step="0.1"></div>
    <div><label for="d19_margeA">Marge variable de A, L+ (%)</label><input type="number" id="d19_margeA" value="0.30" step="0.01"></div>
    <div><label for="d19_fixeB">Taux fixe de B (%)</label><input type="number" id="d19_fixeB" value="6.5" step="0.1"></div>
    <div><label for="d19_margeB">Marge variable de B, L+ (%)</label><input type="number" id="d19_margeB" value="0.90" step="0.01"></div>
    <div><label for="d19_tauxSwap">Taux fixe du swap (%)</label><input type="number" id="d19_tauxSwap" value="5.25" step="0.01"></div>
  </div>
  <button onclick="calculerAvantageComparatif()">Calculer</button>
  <div id="resultatAvantageComparatif" class="resultat-zone"></div>
</div>

<div class="panneau">
  <h2>Évaluation d'un swap par la méthode du swap neuf</h2>
  <div class="ligne">
    <div><label for="d19b_notionnel">Notionnel</label><input type="number" id="d19b_notionnel" value="50000000" step="1000000"></div>
    <div><label for="d19b_tauxFixeRecu">Taux fixe reçu (%)</label><input type="number" id="d19b_tauxFixeRecu" value="4.5" step="0.1"></div>
    <div><label for="d19b_tauxSwapActuel">Taux de swap actuel (%)</label><input type="number" id="d19b_tauxSwapActuel" value="3.20" step="0.01"></div>
    <div><label for="d19b_nFlux">Nombre de flux trimestriels restants</label><input type="number" id="d19b_nFlux" value="12" step="1"></div>
    <div><label for="d19b_r">Taux d'actualisation continu (%/an)</label><input type="number" id="d19b_r" value="2.8" step="0.1"></div>
  </div>
  <button onclick="calculerValeurSwap()">Calculer</button>
  <div id="resultatValeurSwap" class="resultat-zone"></div>
</div>

<script>
function calculerAvantageComparatif() {
  var resDiv = document.getElementById('resultatAvantageComparatif');
  var fixeA = parseFloat(document.getElementById('d19_fixeA').value) / 100;
  var margeA = parseFloat(document.getElementById('d19_margeA').value) / 100;
  var fixeB = parseFloat(document.getElementById('d19_fixeB').value) / 100;
  var margeB = parseFloat(document.getElementById('d19_margeB').value) / 100;
  var tauxSwap = parseFloat(document.getElementById('d19_tauxSwap').value) / 100;

  if ([fixeA, margeA, fixeB, margeB, tauxSwap].some(isNaN)) {
    resDiv.innerHTML = '<p class="erreur">Valeurs invalides.</p>';
    return;
  }

  var ecartFixe = fixeB - fixeA;
  var ecartVariable = margeB - margeA;
  var gainTotal = ecartFixe - ecartVariable;
  var gainChacune = gainTotal / 2;

  var margeNetteA = fixeA - tauxSwap;
  var gainA = margeA - margeNetteA;
  var coutNetB = margeB + tauxSwap;
  var gainB = fixeB - coutNetB;

  var html = '';
  html += '<table class="tabres">';
  html += '<tr><th>écart fixe (B − A)</th><td>' + (ecartFixe * 100).toFixed(2) + '%</td></tr>';
  html += '<tr><th>écart variable (B − A)</th><td>' + (ecartVariable * 100).toFixed(2) + '%</td></tr>';
  html += '<tr><th>gain total</th><td>' + (gainTotal * 100).toFixed(2) + '%</td></tr>';
  html += '<tr><th>gain partagé également</th><td>' + (gainChacune * 100).toFixed(2) + '%</td></tr>';
  html += '</table>';
  html += '<div class="valeur mid">A (emprunte fixe, swap) : coût net = L + ' + (margeNetteA * 100).toFixed(3) + '% (gain = ' + (gainA * 100).toFixed(3) + '%)</div>';
  html += '<div class="valeur mid">B (emprunte variable, swap) : coût net = ' + (coutNetB * 100).toFixed(3) + '% fixe (gain = ' + (gainB * 100).toFixed(3) + '%)</div>';
  resDiv.innerHTML = html;
}

function calculerValeurSwap() {
  var resDiv = document.getElementById('resultatValeurSwap');
  var notionnel = parseFloat(document.getElementById('d19b_notionnel').value);
  var tauxFixeRecu = parseFloat(document.getElementById('d19b_tauxFixeRecu').value) / 100;
  var tauxSwapActuel = parseFloat(document.getElementById('d19b_tauxSwapActuel').value) / 100;
  var nFlux = parseFloat(document.getElementById('d19b_nFlux').value);
  var r = parseFloat(document.getElementById('d19b_r').value) / 100;

  if ([notionnel, tauxFixeRecu, tauxSwapActuel, nFlux, r].some(isNaN) || nFlux <= 0) {
    resDiv.innerHTML = '<p class="erreur">Valeurs invalides.</p>';
    return;
  }

  var ecart = tauxFixeRecu - tauxSwapActuel;
  var fluxTrimestriel = notionnel * ecart / 4;

  var pv = 0;
  for (var i = 1; i <= nFlux; i++) {
    var t = 0.25 * i;
    pv += fluxTrimestriel * Math.exp(-r * t);
  }

  var html = '';
  html += '<div class="valeur">écart (fixe reçu − taux de swap actuel) = ' + (ecart * 100).toFixed(2) + '%</div>';
  html += '<div class="valeur mid">flux fixe net trimestriel = ' + fluxTrimestriel.toFixed(2) + '</div>';
  html += '<div class="valeur ' + (pv >= 0 ? 'ok' : 'ko') + '">valeur actuelle du swap ≈ ' + pv.toFixed(2) + '</div>';
  html += '<p class="aide">Cette valeur est celle du swap « neuf » de sens inverse superposé au swap existant : elle représente ce que recevrait (ou paierait) le détenteur en dénouant sa position aujourd\'hui.</p>';
  resDiv.innerHTML = html;
}

window.onload = function () { calculerAvantageComparatif(); calculerValeurSwap(); };
</script>
</body>
</html>
