<!DOCTYPE html>
<html lang="fr">
<head>
<script id="jm-theme-detect">
(function () {
  var t = null;
  try { t = localStorage.getItem("jm-theme"); } catch (e) {}
  if (!t) { t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light"; }
  document.documentElement.setAttribute("data-theme", t);
  window.addEventListener("storage", function (e) {
    if (e.key === "jm-theme" && e.newValue) { document.documentElement.setAttribute("data-theme", e.newValue); }
  });
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapitre 16 — Les obligations d'entreprise — Calculatrice interactive</title>
<style>
  :root { --cdef: #4A3B8C; --cintu: #E08000; --cex: #2E8B57; --ceco: #1F6FB2; --cgris: #5A5A5A; }
  * { box-sizing: border-box; }
  body { font-family: Georgia, "TeX Gyre Pagella", serif; background: #FDFDFD; color: #1a1a1a; max-width: 1150px; margin: 0 auto; padding: 1.5em; }
  h1 { font-family: "Helvetica Neue", Arial, sans-serif; color: var(--cdef); font-size: 1.5em; border-bottom: 2px solid var(--cdef); padding-bottom: 0.3em; }
  .sous-titre { color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; margin-top: -0.6em; }
  .panneau { background: white; border-left: 4px solid var(--cdef); border-radius: 6px; padding: 1em 1.2em; margin: 1em 0; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .panneau h2 { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 1.05em; color: var(--cdef); margin-top: 0; }
  label { display: block; margin: 0.6em 0 0.2em; font-size: 0.85em; color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; }
  input[type=number], input[type=text] { width: 100%; padding: 0.5em; border: 1px solid #ccc; border-radius: 4px; font-family: "Courier New", monospace; font-size: 0.9em; }
  .ligne { display: flex; gap: 1em; flex-wrap: wrap; align-items: flex-start; }
  .ligne > div { flex: 1; min-width: 150px; }
  button { margin-top: 1em; margin-right: 0.5em; background: var(--cdef); color: white; border: none; padding: 0.6em 1.4em; border-radius: 5px; font-family: "Helvetica Neue", Arial, sans-serif; font-weight: bold; cursor: pointer; font-size: 0.95em; }
  button:hover { background: #372c69; }
  .erreur { color: #b00020; font-family: "Helvetica Neue", Arial, sans-serif; font-size: 0.9em; margin-top: 0.6em; }
  .resultat-zone { margin-top: 1em; font-family: "Helvetica Neue", Arial, sans-serif; }
  .aide { font-size: 0.85em; color: var(--cgris); margin-top: 0; }
  .valeur { font-size: 1.0em; padding: 0.4em 0.7em; background: var(--cdef); color: white; border-radius: 5px; display: inline-block; margin: 0.2em 0.3em 0.2em 0; }
  .valeur.ok { background: var(--cex); }
  .valeur.ko { background: #b00020; }
  .valeur.mid { background: var(--cintu); }
  table.tabres { border-collapse: collapse; margin-top: 0.7em; font-size: 0.85em; font-family: "Courier New", monospace; }
  table.tabres th, table.tabres td { border: 1px solid #ccc; padding: 0.3em 0.6em; text-align: right; }
  table.tabres th { background: #f0f0f0; font-family: "Helvetica Neue", Arial, sans-serif; }
</style>
<style id="jm-theme-override">
/* Surcharge : palette et typographie du site jmadkour.org, synchronisee
   avec son bascule clair/sombre (voir script jm-theme-detect ci-dessus). */
:root {
  --cdef: #1f6fb2; --ceco: #1f6fb2; --cex: #1d9e75; --cintu: #b56600; --cgris: #54707f;
  --bg: #ffffff; --fg: #142a38; --border: #dbe6ee; --card-bg: #f6f9fb; --code-bg: #f3f7fa;
  --danger: #b00020; --primary-dark: #17578f;
}
:root[data-theme="dark"] {
  --cdef: #3aa0e6; --ceco: #3aa0e6; --cex: #37b47e; --cintu: #e0954a; --cgris: #9db4c0;
  --bg: #0d1b26; --fg: #e7eef3; --border: #20455a; --card-bg: #13303d; --code-bg: #0f2733;
  --danger: #e0554a; --primary-dark: #5bb3ef;
}
* { box-sizing: border-box; }
html { background: var(--bg) !important; }
body {
  background: var(--bg) !important; color: var(--fg) !important;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
}
h1, h2, .panneau h2 {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  color: var(--cdef) !important; border-color: var(--cdef) !important;
}
.sous-titre, .aide, label { color: var(--cgris) !important; }
.panneau {
  background: var(--card-bg) !important; border: 1px solid var(--border) !important;
  border-left: 1px solid var(--border) !important; border-radius: 14px !important; box-shadow: none !important;
}
input[type=number], input[type=text] {
  background: var(--bg) !important; color: var(--fg) !important; border: 1px solid var(--border) !important;
}
button {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  background: var(--cdef) !important; color: #ffffff !important; border-radius: 8px !important; border: none !important;
}
button:hover { background: var(--primary-dark) !important; }
.erreur { color: var(--danger) !important; }
.valeur { background: var(--cdef) !important; color: #ffffff !important; }
.valeur.ok { background: var(--cex) !important; }
.valeur.ko { background: var(--danger) !important; }
.valeur.mid { background: var(--cintu) !important; }
table.tabres th, table.tabres td { border-color: var(--border) !important; color: var(--fg) !important; }
table.tabres th { background: var(--code-bg) !important; }
</style>
</head>
<body>

<h1>Chapitre 16 — Application : les obligations d'entreprise</h1>
<p class="sous-titre">Calculatrice interactive — rendement espéré et décomposition du spread (exercice 5), rang de créance et mesure du défaut (exercice 6)</p>

<div class="panneau">
  <h2>Rendement espéré et décomposition du spread</h2>
  <div class="ligne">
    <div><label for="d16_rendementAffiche">Rendement affiché (%)</label><input type="number" id="d16_rendementAffiche" value="9" step="0.1"></div>
    <div><label for="d16_tauxSouverain">Taux souverain (%)</label><input type="number" id="d16_tauxSouverain" value="4" step="0.1"></div>
    <div><label for="d16_PD">Probabilité de défaut annuelle (%)</label><input type="number" id="d16_PD" value="3" step="0.1"></div>
    <div><label for="d16_recouvrement">Taux de recouvrement (%)</label><input type="number" id="d16_recouvrement" value="40" step="1"></div>
  </div>
  <button onclick="calculerSpread()">Calculer</button>
  <div id="resultatSpread" class="resultat-zone"></div>
</div>

<div class="panneau">
  <h2>Rang de créance et mesure du défaut</h2>
  <div class="ligne">
    <div><label for="d16b_valeurLiquidation">Valeur totale de liquidation</label><input type="number" id="d16b_valeurLiquidation" value="90" step="1"></div>
    <div><label for="d16b_garantie">Créance garantie (collatéral réalisé)</label><input type="number" id="d16b_garantie" value="20" step="1"></div>
    <div><label for="d16b_senior">Dette senior</label><input type="number" id="d16b_senior" value="50" step="1"></div>
    <div><label for="d16b_subordonnee">Dette subordonnée</label><input type="number" id="d16b_subordonnee" value="40" step="1"></div>
  </div>
  <div class="ligne">
    <div><label for="d16b_nbEmissions">Nombre total d'émissions</label><input type="number" id="d16b_nbEmissions" value="200" step="1"></div>
    <div><label for="d16b_montantMoyen">Montant moyen par émission</label><input type="number" id="d16b_montantMoyen" value="50" step="1"></div>
    <div><label for="d16b_nbDefautsPetits">Nombre de petites émissions en défaut</label><input type="number" id="d16b_nbDefautsPetits" value="7" step="1"></div>
    <div><label for="d16b_emissionGeante">Montant de l'émission géante en défaut</label><input type="number" id="d16b_emissionGeante" value="800" step="10"></div>
  </div>
  <button onclick="calculerCredit()">Calculer</button>
  <div id="resultatCredit" class="resultat-zone"></div>
</div>

<script>
function calculerSpread() {
  var resDiv = document.getElementById('resultatSpread');
  var rendementAffiche = parseFloat(document.getElementById('d16_rendementAffiche').value) / 100;
  var tauxSouverain = parseFloat(document.getElementById('d16_tauxSouverain').value) / 100;
  var PD = parseFloat(document.getElementById('d16_PD').value) / 100;
  var recouvrement = parseFloat(document.getElementById('d16_recouvrement').value) / 100;

  if ([rendementAffiche, tauxSouverain, PD, recouvrement].some(isNaN)) {
    resDiv.innerHTML = '<p class="erreur">Valeurs invalides.</p>';
    return;
  }

  var perteAttendue = PD * (1 - recouvrement);
  var rendementEspere = rendementAffiche - perteAttendue;
  var spreadTotal = rendementAffiche - tauxSouverain;
  var resteAExpliquer = spreadTotal - perteAttendue;
  var partExpliquee = spreadTotal !== 0 ? perteAttendue / spreadTotal : NaN;

  var html = '';
  html += '<div class="valeur mid">perte attendue = ' + (perteAttendue * 100).toFixed(2) + '%</div>';
  html += '<div class="valeur ok">rendement espéré = ' + (rendementEspere * 100).toFixed(2) + '%</div>';
  html += '<table class="tabres">';
  html += '<tr><th>spread total</th><td>' + (spreadTotal * 100).toFixed(2) + '%</td></tr>';
  html += '<tr><th>expliqué par la perte attendue</th><td>' + (perteAttendue * 100).toFixed(2) + '% (' + (partExpliquee * 100).toFixed(1) + '% du spread)</td></tr>';
  html += '<tr><th>reste (prime de risque, liquidité, fiscal)</th><td>' + (resteAExpliquer * 100).toFixed(2) + '%</td></tr>';
  html += '</table>';
  html += '<p class="aide">Le rendement affiché n\'est pas le rendement espéré : une part souvent majoritaire du spread — le « puzzle de l\'écart de crédit » — reste inexpliquée par la seule perte attendue.</p>';
  resDiv.innerHTML = html;
}

function calculerCredit() {
  var resDiv = document.getElementById('resultatCredit');
  var valeurLiquidation = parseFloat(document.getElementById('d16b_valeurLiquidation').value);
  var garantie = parseFloat(document.getElementById('d16b_garantie').value);
  var senior = parseFloat(document.getElementById('d16b_senior').value);
  var subordonnee = parseFloat(document.getElementById('d16b_subordonnee').value);
  var nbEmissions = parseFloat(document.getElementById('d16b_nbEmissions').value);
  var montantMoyen = parseFloat(document.getElementById('d16b_montantMoyen').value);
  var nbDefautsPetits = parseFloat(document.getElementById('d16b_nbDefautsPetits').value);
  var emissionGeante = parseFloat(document.getElementById('d16b_emissionGeante').value);

  if ([valeurLiquidation, garantie, senior, subordonnee, nbEmissions, montantMoyen, nbDefautsPetits, emissionGeante].some(isNaN)) {
    resDiv.innerHTML = '<p class="erreur">Valeurs invalides.</p>';
    return;
  }

  var recouvrementGarantie = Math.min(garantie, garantie) / garantie;
  var resteApresGarantie = Math.max(valeurLiquidation - garantie, 0);
  var paiementSenior = Math.min(senior, resteApresGarantie);
  var recouvrementSenior = senior > 0 ? paiementSenior / senior : NaN;
  var resteApresSenior = resteApresGarantie - paiementSenior;
  var paiementSubordonnee = Math.min(subordonnee, resteApresSenior);
  var recouvrementSubordonnee = subordonnee > 0 ? paiementSubordonnee / subordonnee : NaN;
  var resteActionnaires = resteApresSenior - paiementSubordonnee;

  var totalMontant = nbEmissions * montantMoyen;
  var nbDefautsTotal = nbDefautsPetits + 1;
  var tauxDefautEmission = nbDefautsTotal / nbEmissions;
  var montantEnDefaut = emissionGeante + nbDefautsPetits * montantMoyen;
  var tauxDefautMontant = totalMontant > 0 ? montantEnDefaut / totalMontant : NaN;

  var html = '';
  html += '<table class="tabres">';
  html += '<tr><th>recouvrement créance garantie</th><td>' + (recouvrementGarantie * 100).toFixed(2) + '%</td></tr>';
  html += '<tr><th>recouvrement dette senior</th><td>' + (recouvrementSenior * 100).toFixed(2) + '%</td></tr>';
  html += '<tr><th>recouvrement dette subordonnée</th><td>' + (recouvrementSubordonnee * 100).toFixed(2) + '%</td></tr>';
  html += '<tr><th>reste pour les actionnaires</th><td>' + resteActionnaires.toFixed(2) + '</td></tr>';
  html += '</table>';
  html += '<table class="tabres">';
  html += '<tr><th>taux de défaut par émission</th><td>' + (tauxDefautEmission * 100).toFixed(2) + '%</td></tr>';
  html += '<tr><th>taux de défaut en montant</th><td>' + (tauxDefautMontant * 100).toFixed(2) + '%</td></tr>';
  html += '</table>';
  resDiv.innerHTML = html;
}

window.onload = function () { calculerSpread(); calculerCredit(); };
</script>
</body>
</html>
