<!DOCTYPE html>
<html lang="fr">
<head>
<script id="jm-theme-detect">
(function () {
  var t = null;
  try { t = localStorage.getItem("jm-theme"); } catch (e) {}
  if (!t) { t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light"; }
  document.documentElement.setAttribute("data-theme", t);
  window.addEventListener("storage", function (e) {
    if (e.key === "jm-theme" && e.newValue) { document.documentElement.setAttribute("data-theme", e.newValue); }
  });
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapitre 15 — Les propriétés des taux d'intérêt — Calculatrice interactive</title>
<style>
  :root { --cdef: #4A3B8C; --cintu: #E08000; --cex: #2E8B57; --ceco: #1F6FB2; --cgris: #5A5A5A; }
  * { box-sizing: border-box; }
  body { font-family: Georgia, "TeX Gyre Pagella", serif; background: #FDFDFD; color: #1a1a1a; max-width: 1150px; margin: 0 auto; padding: 1.5em; }
  h1 { font-family: "Helvetica Neue", Arial, sans-serif; color: var(--cdef); font-size: 1.5em; border-bottom: 2px solid var(--cdef); padding-bottom: 0.3em; }
  .sous-titre { color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; margin-top: -0.6em; }
  .panneau { background: white; border-left: 4px solid var(--cdef); border-radius: 6px; padding: 1em 1.2em; margin: 1em 0; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .panneau h2 { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 1.05em; color: var(--cdef); margin-top: 0; }
  label { display: block; margin: 0.6em 0 0.2em; font-size: 0.85em; color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; }
  input[type=number], input[type=text] { width: 100%; padding: 0.5em; border: 1px solid #ccc; border-radius: 4px; font-family: "Courier New", monospace; font-size: 0.9em; }
  .ligne { display: flex; gap: 1em; flex-wrap: wrap; align-items: flex-start; }
  .ligne > div { flex: 1; min-width: 150px; }
  button { margin-top: 1em; margin-right: 0.5em; background: var(--cdef); color: white; border: none; padding: 0.6em 1.4em; border-radius: 5px; font-family: "Helvetica Neue", Arial, sans-serif; font-weight: bold; cursor: pointer; font-size: 0.95em; }
  button:hover { background: #372c69; }
  .erreur { color: #b00020; font-family: "Helvetica Neue", Arial, sans-serif; font-size: 0.9em; margin-top: 0.6em; }
  .resultat-zone { margin-top: 1em; font-family: "Helvetica Neue", Arial, sans-serif; }
  .aide { font-size: 0.85em; color: var(--cgris); margin-top: 0; }
  .valeur { font-size: 1.0em; padding: 0.4em 0.7em; background: var(--cdef); color: white; border-radius: 5px; display: inline-block; margin: 0.2em 0.3em 0.2em 0; }
  .valeur.ok { background: var(--cex); }
  .valeur.ko { background: #b00020; }
  .valeur.mid { background: var(--cintu); }
  table.tabres { border-collapse: collapse; margin-top: 0.7em; font-size: 0.85em; font-family: "Courier New", monospace; }
  table.tabres th, table.tabres td { border: 1px solid #ccc; padding: 0.3em 0.6em; text-align: right; }
  table.tabres th { background: #f0f0f0; font-family: "Helvetica Neue", Arial, sans-serif; }
</style>
<style id="jm-theme-override">
/* Surcharge : palette et typographie du site jmadkour.org, synchronisee
   avec son bascule clair/sombre (voir script jm-theme-detect ci-dessus). */
:root {
  --cdef: #1f6fb2; --ceco: #1f6fb2; --cex: #1d9e75; --cintu: #b56600; --cgris: #54707f;
  --bg: #ffffff; --fg: #142a38; --border: #dbe6ee; --card-bg: #f6f9fb; --code-bg: #f3f7fa;
  --danger: #b00020; --primary-dark: #17578f;
}
:root[data-theme="dark"] {
  --cdef: #3aa0e6; --ceco: #3aa0e6; --cex: #37b47e; --cintu: #e0954a; --cgris: #9db4c0;
  --bg: #0d1b26; --fg: #e7eef3; --border: #20455a; --card-bg: #13303d; --code-bg: #0f2733;
  --danger: #e0554a; --primary-dark: #5bb3ef;
}
* { box-sizing: border-box; }
html { background: var(--bg) !important; }
body {
  background: var(--bg) !important; color: var(--fg) !important;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
}
h1, h2, .panneau h2 {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  color: var(--cdef) !important; border-color: var(--cdef) !important;
}
.sous-titre, .aide, label { color: var(--cgris) !important; }
.panneau {
  background: var(--card-bg) !important; border: 1px solid var(--border) !important;
  border-left: 1px solid var(--border) !important; border-radius: 14px !important; box-shadow: none !important;
}
input[type=number], input[type=text] {
  background: var(--bg) !important; color: var(--fg) !important; border: 1px solid var(--border) !important;
}
button {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  background: var(--cdef) !important; color: #ffffff !important; border-radius: 8px !important; border: none !important;
}
button:hover { background: var(--primary-dark) !important; }
.erreur { color: var(--danger) !important; }
.valeur { background: var(--cdef) !important; color: #ffffff !important; }
.valeur.ok { background: var(--cex) !important; }
.valeur.ko { background: var(--danger) !important; }
.valeur.mid { background: var(--cintu) !important; }
table.tabres th, table.tabres td { border-color: var(--border) !important; color: var(--fg) !important; }
table.tabres th { background: var(--code-bg) !important; }
</style>
</head>
<body>

<h1>Chapitre 15 — Application : les propriétés des taux d'intérêt</h1>
<p class="sous-titre">Calculatrice interactive — taux équivalents et valorisation par actualisation (exercice 5), duration et convexité (exercice 6)</p>

<div class="panneau">
  <h2>Taux équivalents et valorisation obligataire</h2>
  <div class="ligne">
    <div><label for="d15_Rm">Taux nominal annuel R_m (%)</label><input type="number" id="d15_Rm" value="8" step="0.1"></div>
    <div><label for="d15_m">Fréquence m (capitalisations/an)</label><input type="number" id="d15_m" value="2" step="1"></div>
    <div><label for="d15_A">Capital placé A</label><input type="number" id="d15_A" value="10000" step="1000"></div>
    <div><label for="d15_n">Durée n (années)</label><input type="number" id="d15_n" value="3" step="1"></div>
  </div>
  <div class="ligne">
    <div style="flex:2;"><label for="d15_flux">Flux de l'obligation "t:montant" (liste)</label><input type="text" id="d15_flux" value="1:6,2:6,3:106"></div>
    <div><label for="d15_y">Rendement plat y (%, continu)</label><input type="number" id="d15_y" value="5" step="0.1"></div>
    <div style="flex:2;"><label for="d15_zero">Taux zéro-coupon "t:taux%" (liste)</label><input type="text" id="d15_zero" value="1:4,2:4.5,3:5"></div>
  </div>
  <button onclick="calculerTaux()">Calculer</button>
  <div id="resultatTaux" class="resultat-zone"></div>
</div>

<div class="panneau">
  <h2>Duration et convexité</h2>
  <div class="ligne">
    <div><label for="d15b_P0">Valeur du portefeuille P0</label><input type="number" id="d15b_P0" value="5000000" step="100000"></div>
    <div><label for="d15b_D">Duration modifiée D</label><input type="number" id="d15b_D" value="7" step="0.1"></div>
    <div><label for="d15b_C">Convexité C</label><input type="number" id="d15b_C" value="60" step="1"></div>
    <div><label for="d15b_dy">Choc de taux |Δy| (points de base)</label><input type="number" id="d15b_dy" value="100" step="10"></div>
  </div>
  <button onclick="calculerDuration()">Calculer</button>
  <div id="resultatDuration" class="resultat-zone"></div>
</div>

<script>
function parseListePaires(s) {
  return s.split(',').map(function (chunk) {
    var parts = chunk.split(':');
    return [parseFloat(parts[0].trim()), parseFloat(parts[1].trim())];
  }).filter(function (p) { return !isNaN(p[0]) && !isNaN(p[1]); });
}

function calculerTaux() {
  var resDiv = document.getElementById('resultatTaux');
  var Rm = parseFloat(document.getElementById('d15_Rm').value) / 100;
  var m = parseFloat(document.getElementById('d15_m').value);
  var A = parseFloat(document.getElementById('d15_A').value);
  var n = parseFloat(document.getElementById('d15_n').value);
  var flux = parseListePaires(document.getElementById('d15_flux').value);
  var y = parseFloat(document.getElementById('d15_y').value) / 100;
  var zero = parseListePaires(document.getElementById('d15_zero').value);

  if ([Rm, m, A, n, y].some(isNaN) || m <= 0 || flux.length === 0 || zero.length === 0) {
    resDiv.innerHTML = '<p class="erreur">Valeurs invalides.</p>';
    return;
  }

  var Rc = m * Math.log(1 + Rm / m);
  var Vm = A * Math.pow(1 + Rm / m, m * n);
  var Vc = A * Math.exp(Rc * n);

  var Pplat = flux.reduce(function (s, f) { return s + f[1] * Math.exp(-y * f[0]); }, 0);
  var Ptheo = flux.reduce(function (s, f, i) {
    var r = (zero[i] ? zero[i][1] / 100 : y);
    return s + f[1] * Math.exp(-r * f[0]);
  }, 0);

  var html = '';
  html += '<div class="valeur">taux continu équivalent R_c = ' + (Rc * 100).toFixed(4) + '%</div>';
  html += '<table class="tabres"><tr><th></th><th>capitalisation discrète</th><th>capitalisation continue</th></tr>';
  html += '<tr><th>valeur après ' + n + ' an(s)</th><td>' + Vm.toFixed(2) + '</td><td>' + Vc.toFixed(2) + '</td></tr></table>';
  html += (Math.abs(Vm - Vc) < 0.01
    ? '<div class="valeur ok">les deux capitalisations coïncident : R_c est bien le taux continu strictement équivalent</div>'
    : '<div class="valeur ko">écart résiduel entre les deux valeurs</div>');

  html += '<table class="tabres"><tr><th>prix à taux plat y (' + (y * 100).toFixed(2) + '%)</th><td>' + Pplat.toFixed(4) + '</td></tr>';
  html += '<tr><th>prix théorique (courbe zéro-coupon)</th><td>' + Ptheo.toFixed(4) + '</td></tr>';
  html += '<tr><th>écart théorique − plat</th><td>' + (Ptheo - Pplat).toFixed(4) + '</td></tr></table>';
  html += '<p class="aide">Le rendement à l\'échéance $y$ n\'est qu\'une moyenne commode ; le prix théorique, qui actualise chaque flux à son propre taux zéro-coupon, est la valorisation correcte.</p>';
  resDiv.innerHTML = html;
}

function calculerDuration() {
  var resDiv = document.getElementById('resultatDuration');
  var P0 = parseFloat(document.getElementById('d15b_P0').value);
  var D = parseFloat(document.getElementById('d15b_D').value);
  var C = parseFloat(document.getElementById('d15b_C').value);
  var dy = parseFloat(document.getElementById('d15b_dy').value) / 10000;

  if ([P0, D, C, dy].some(isNaN) || P0 <= 0) {
    resDiv.innerHTML = '<p class="erreur">Valeurs invalides.</p>';
    return;
  }

  function variation(sensDy) {
    var lin = -D * sensDy;
    var conv = 0.5 * C * sensDy * sensDy;
    return { lin: lin, conv: conv, total: lin + conv };
  }

  var hausse = variation(dy);
  var baisse = variation(-dy);
  var Phausse = P0 * (1 + hausse.total);
  var Pbaisse = P0 * (1 + baisse.total);
  var perte = P0 - Phausse;
  var gain = Pbaisse - P0;

  var html = '';
  html += '<table class="tabres"><tr><th></th><th>Δy = +' + (dy * 10000).toFixed(0) + ' pb</th><th>Δy = −' + (dy * 10000).toFixed(0) + ' pb</th></tr>';
  html += '<tr><th>terme linéaire (duration)</th><td>' + (hausse.lin * 100).toFixed(2) + '%</td><td>' + (baisse.lin * 100).toFixed(2) + '%</td></tr>';
  html += '<tr><th>terme de convexité</th><td>' + (hausse.conv * 100).toFixed(2) + '%</td><td>' + (baisse.conv * 100).toFixed(2) + '%</td></tr>';
  html += '<tr><th>variation totale ΔP/P</th><td>' + (hausse.total * 100).toFixed(2) + '%</td><td>' + (baisse.total * 100).toFixed(2) + '%</td></tr>';
  html += '<tr><th>valeur du portefeuille</th><td>' + Phausse.toFixed(2) + '</td><td>' + Pbaisse.toFixed(2) + '</td></tr></table>';
  html += '<div class="valeur ko">perte si hausse = ' + perte.toFixed(2) + '</div>';
  html += '<div class="valeur ok">gain si baisse = ' + gain.toFixed(2) + '</div>';
  html += '<div class="valeur mid">avantage de convexité = gain − perte = ' + (gain - perte).toFixed(2) + '</div>';
  resDiv.innerHTML = html;
}

window.onload = function () { calculerTaux(); calculerDuration(); };
</script>
</body>
</html>
