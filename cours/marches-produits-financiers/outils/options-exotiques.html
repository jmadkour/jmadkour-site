<!DOCTYPE html>
<html lang="fr">
<head>
<script id="jm-theme-detect">
(function () {
  var t = null;
  try { t = localStorage.getItem("jm-theme"); } catch (e) {}
  if (!t) { t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light"; }
  document.documentElement.setAttribute("data-theme", t);
  window.addEventListener("storage", function (e) {
    if (e.key === "jm-theme" && e.newValue) { document.documentElement.setAttribute("data-theme", e.newValue); }
  });
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapitre 14 — Les options exotiques — Calculatrice interactive</title>
<style>
  :root { --cdef: #4A3B8C; --cintu: #E08000; --cex: #2E8B57; --ceco: #1F6FB2; --cgris: #5A5A5A; }
  * { box-sizing: border-box; }
  body { font-family: Georgia, "TeX Gyre Pagella", serif; background: #FDFDFD; color: #1a1a1a; max-width: 1150px; margin: 0 auto; padding: 1.5em; }
  h1 { font-family: "Helvetica Neue", Arial, sans-serif; color: var(--cdef); font-size: 1.5em; border-bottom: 2px solid var(--cdef); padding-bottom: 0.3em; }
  .sous-titre { color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; margin-top: -0.6em; }
  .panneau { background: white; border-left: 4px solid var(--cdef); border-radius: 6px; padding: 1em 1.2em; margin: 1em 0; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .panneau h2 { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 1.05em; color: var(--cdef); margin-top: 0; }
  label { display: block; margin: 0.6em 0 0.2em; font-size: 0.85em; color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; }
  input[type=number], input[type=text] { width: 100%; padding: 0.5em; border: 1px solid #ccc; border-radius: 4px; font-family: "Courier New", monospace; font-size: 0.9em; }
  .ligne { display: flex; gap: 1em; flex-wrap: wrap; align-items: flex-start; }
  .ligne > div { flex: 1; min-width: 150px; }
  button { margin-top: 1em; margin-right: 0.5em; background: var(--cdef); color: white; border: none; padding: 0.6em 1.4em; border-radius: 5px; font-family: "Helvetica Neue", Arial, sans-serif; font-weight: bold; cursor: pointer; font-size: 0.95em; }
  button:hover { background: #372c69; }
  .erreur { color: #b00020; font-family: "Helvetica Neue", Arial, sans-serif; font-size: 0.9em; margin-top: 0.6em; }
  .resultat-zone { margin-top: 1em; font-family: "Helvetica Neue", Arial, sans-serif; }
  .aide { font-size: 0.85em; color: var(--cgris); margin-top: 0; }
  .valeur { font-size: 1.0em; padding: 0.4em 0.7em; background: var(--cdef); color: white; border-radius: 5px; display: inline-block; margin: 0.2em 0.3em 0.2em 0; }
  .valeur.ok { background: var(--cex); }
  .valeur.ko { background: #b00020; }
  .valeur.mid { background: var(--cintu); }
  table.tabres { border-collapse: collapse; margin-top: 0.7em; font-size: 0.85em; font-family: "Courier New", monospace; }
  table.tabres th, table.tabres td { border: 1px solid #ccc; padding: 0.3em 0.6em; text-align: right; }
  table.tabres th { background: #f0f0f0; font-family: "Helvetica Neue", Arial, sans-serif; }
</style>
<style id="jm-theme-override">
/* Surcharge : palette et typographie du site jmadkour.org, synchronisee
   avec son bascule clair/sombre (voir script jm-theme-detect ci-dessus). */
:root {
  --cdef: #1f6fb2; --ceco: #1f6fb2; --cex: #1d9e75; --cintu: #b56600; --cgris: #54707f;
  --bg: #ffffff; --fg: #142a38; --border: #dbe6ee; --card-bg: #f6f9fb; --code-bg: #f3f7fa;
  --danger: #b00020; --primary-dark: #17578f;
}
:root[data-theme="dark"] {
  --cdef: #3aa0e6; --ceco: #3aa0e6; --cex: #37b47e; --cintu: #e0954a; --cgris: #9db4c0;
  --bg: #0d1b26; --fg: #e7eef3; --border: #20455a; --card-bg: #13303d; --code-bg: #0f2733;
  --danger: #e0554a; --primary-dark: #5bb3ef;
}
* { box-sizing: border-box; }
html { background: var(--bg) !important; }
body {
  background: var(--bg) !important; color: var(--fg) !important;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
}
h1, h2, .panneau h2 {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  color: var(--cdef) !important; border-color: var(--cdef) !important;
}
.sous-titre, .aide, label { color: var(--cgris) !important; }
.panneau {
  background: var(--card-bg) !important; border: 1px solid var(--border) !important;
  border-left: 1px solid var(--border) !important; border-radius: 14px !important; box-shadow: none !important;
}
input[type=number], input[type=text] {
  background: var(--bg) !important; color: var(--fg) !important; border: 1px solid var(--border) !important;
}
button {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  background: var(--cdef) !important; color: #ffffff !important; border-radius: 8px !important; border: none !important;
}
button:hover { background: var(--primary-dark) !important; }
.erreur { color: var(--danger) !important; }
.valeur { background: var(--cdef) !important; color: #ffffff !important; }
.valeur.ok { background: var(--cex) !important; }
.valeur.ko { background: var(--danger) !important; }
.valeur.mid { background: var(--cintu) !important; }
table.tabres th, table.tabres td { border-color: var(--border) !important; color: var(--fg) !important; }
table.tabres th { background: var(--code-bg) !important; }
</style>
</head>
<body>

<h1>Chapitre 14 — Application : les options exotiques</h1>
<p class="sous-titre">Calculatrice interactive — option asiatique contre option vanille (exercice 5), une option à barrière désactivante (exercice 6)</p>

<div class="panneau">
  <h2>Option asiatique contre option vanille</h2>
  <div class="ligne">
    <div><label for="d14_K">Prix d'exercice K</label><input type="number" id="d14_K" value="100" step="1"></div>
    <div style="flex:2;"><label for="d14_cours">Cours observés (liste)</label><input type="text" id="d14_cours" value="100,104,98,102,106"></div>
  </div>
  <button onclick="calculerAsiatique()">Calculer</button>
  <div id="resultatAsiatique" class="resultat-zone"></div>
</div>

<div class="panneau">
  <h2>Une option à barrière désactivante</h2>
  <div class="ligne">
    <div><label for="d14b_K">Prix d'exercice K</label><input type="number" id="d14b_K" value="100" step="1"></div>
    <div><label for="d14b_primeVanille">Prime du call vanille</label><input type="number" id="d14b_primeVanille" value="8" step="0.5"></div>
    <div><label for="d14b_B">Barrière B (knock-out)</label><input type="number" id="d14b_B" value="110" step="1"></div>
    <div><label for="d14b_primeBarriere">Prime de l'option à barrière</label><input type="number" id="d14b_primeBarriere" value="5" step="0.5"></div>
    <div style="flex:2;"><label for="d14b_trajectoire">Trajectoire complète (liste, dernier = cours final)</label><input type="text" id="d14b_trajectoire" value="102,105,107,108"></div>
  </div>
  <button onclick="calculerBarriere()">Calculer</button>
  <div id="resultatBarriere" class="resultat-zone"></div>
</div>

<script>
function calculerAsiatique() {
  var resDiv = document.getElementById('resultatAsiatique');
  var K = parseFloat(document.getElementById('d14_K').value);
  var cours = document.getElementById('d14_cours').value.split(',').map(function (s) { return parseFloat(s.trim()); }).filter(function (x) { return !isNaN(x); });
  if (isNaN(K) || cours.length === 0) {
    resDiv.innerHTML = '<p class="erreur">Valeurs invalides.</p>';
    return;
  }
  var moyenne = cours.reduce(function (a, b) { return a + b; }, 0) / cours.length;
  var payoffAsiatique = Math.max(moyenne - K, 0);
  var Sfinal = cours[cours.length - 1];
  var payoffVanille = Math.max(Sfinal - K, 0);

  var html = '';
  html += '<div class="valeur">moyenne des cours = ' + moyenne.toFixed(2) + '</div>';
  html += '<div class="valeur mid">gain option asiatique = ' + payoffAsiatique.toFixed(2) + '</div>';
  html += '<div class="valeur mid">gain option vanille (dernier cours = ' + Sfinal + ') = ' + payoffVanille.toFixed(2) + '</div>';
  if (payoffAsiatique < payoffVanille) {
    html += '<div class="valeur ok">l\'asiatique lisse la volatilité du dernier cours et vaut ici moins que la vanille</div>';
  } else if (payoffAsiatique > payoffVanille) {
    html += '<div class="valeur ko">ici, l\'asiatique vaut plus que la vanille (moyenne supérieure au dernier cours)</div>';
  } else {
    html += '<div class="valeur">les deux gains coïncident dans ce scénario</div>';
  }
  resDiv.innerHTML = html;
}

function calculerBarriere() {
  var resDiv = document.getElementById('resultatBarriere');
  var K = parseFloat(document.getElementById('d14b_K').value);
  var primeVanille = parseFloat(document.getElementById('d14b_primeVanille').value);
  var B = parseFloat(document.getElementById('d14b_B').value);
  var primeBarriere = parseFloat(document.getElementById('d14b_primeBarriere').value);
  var trajectoire = document.getElementById('d14b_trajectoire').value.split(',').map(function (s) { return parseFloat(s.trim()); }).filter(function (x) { return !isNaN(x); });
  if ([K, primeVanille, B, primeBarriere].some(isNaN) || trajectoire.length === 0) {
    resDiv.innerHTML = '<p class="erreur">Valeurs invalides.</p>';
    return;
  }
  var Sfinal = trajectoire[trajectoire.length - 1];
  var barriereFranchie = trajectoire.some(function (c) { return c >= B; });
  var payoffVanille = Math.max(Sfinal - K, 0);
  var payoffBarriere = barriereFranchie ? 0 : payoffVanille;
  var gainNetVanille = payoffVanille - primeVanille;
  var gainNetBarriere = payoffBarriere - primeBarriere;

  var html = '';
  html += '<table class="tabres"><tr><th>trajectoire</th><td>' + trajectoire.join(' → ') + '</td></tr>';
  html += '<tr><th>barrière franchie ?</th><td>' + (barriereFranchie ? 'oui' : 'non') + '</td></tr>';
  html += '<tr><th>gain vanille</th><td>' + payoffVanille.toFixed(2) + '</td></tr>';
  html += '<tr><th>gain option à barrière</th><td>' + payoffBarriere.toFixed(2) + '</td></tr>';
  html += '</table>';
  html += '<div class="valeur ' + (gainNetVanille >= 0 ? 'ok' : 'ko') + '">gain net vanille = ' + gainNetVanille.toFixed(2) + '</div>';
  html += '<div class="valeur ' + (gainNetBarriere >= 0 ? 'ok' : 'ko') + '">gain net option à barrière = ' + gainNetBarriere.toFixed(2) + '</div>';
  if (barriereFranchie) {
    html += '<p class="aide">La barrière a été franchie en cours de trajectoire : l\'option est désactivée, quel que soit le cours final.</p>';
  }
  resDiv.innerHTML = html;
}

window.onload = function () { calculerAsiatique(); calculerBarriere(); };
</script>
</body>
</html>
