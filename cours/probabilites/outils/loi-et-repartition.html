<!DOCTYPE html>
<html lang="fr">
<head>
<script id="jm-theme-detect">
(function () {
  var t = null;
  try { t = localStorage.getItem("jm-theme"); } catch (e) {}
  if (!t) { t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light"; }
  document.documentElement.setAttribute("data-theme", t);
  window.addEventListener("storage", function (e) {
    if (e.key === "jm-theme" && e.newValue) { document.documentElement.setAttribute("data-theme", e.newValue); }
  });
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapitre 9 — Loi et fonction de répartition — Calculatrice interactive</title>
<style>
  :root { --cdef: #1F6FB2; --cintu: #B56600; --cex: #1D9E75; --ceco: #1F6FB2; --cgris: #5A5A5A; }
  * { box-sizing: border-box; }
  body { font-family: Georgia, "TeX Gyre Pagella", serif; background: #FDFDFD; color: #1a1a1a; max-width: 950px; margin: 0 auto; padding: 1.5em; }
  h1 { font-family: "Helvetica Neue", Arial, sans-serif; color: var(--cdef); font-size: 1.5em; border-bottom: 2px solid var(--cdef); padding-bottom: 0.3em; }
  .sous-titre { color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; margin-top: -0.6em; }
  .panneau { background: white; border-left: 4px solid var(--cdef); border-radius: 6px; padding: 1em 1.2em; margin: 1em 0; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .panneau h2 { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 1.05em; color: var(--cdef); margin-top: 0; }
  .panneau.var { border-left-color: var(--cintu); }
  .panneau.var h2 { color: var(--cintu); }
  label { display: block; margin: 0.6em 0 0.2em; font-size: 0.92em; color: var(--cgris); }
  input { width: 100%; padding: 0.5em; border: 1px solid #ccc; border-radius: 4px; font-family: "Courier New", monospace; font-size: 0.95em; }
  .grille3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 1.2em; }
  button { margin-top: 1em; background: var(--cdef); color: white; border: none; padding: 0.6em 1.4em; border-radius: 5px; font-family: "Helvetica Neue", Arial, sans-serif; font-weight: bold; cursor: pointer; font-size: 0.95em; }
  button:hover { background: #17578f; }
  .panneau.var button { background: var(--cintu); }
  .panneau.var button:hover { background: #b56600; }
  .erreur { color: #b00020; font-family: "Helvetica Neue", Arial, sans-serif; font-size: 0.9em; margin-top: 0.6em; }
  .resultat-zone { margin-top: 1em; font-family: "Helvetica Neue", Arial, sans-serif; }
  table { border-collapse: collapse; font-family: "Courier New", monospace; font-size: 0.9em; margin-top: 0.6em; }
  td, th { border: 1px solid #ccc; padding: 0.3em 0.6em; }
  .avertissement { font-size: 0.82em; color: var(--cgris); font-style: italic; margin-top: 1em; }
  canvas { max-width: 100%; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style id="jm-theme-override">
/* Surcharge : palette et typographie du site jmadkour.org, synchronisee
   avec son bascule clair/sombre (voir script jm-theme-detect ci-dessus).
   Remplace la palette "polycopie" (violet, serif) utilisee par defaut
   dans le bloc <style> d'origine de cette page. */
:root {
  --cdef: #1f6fb2; --ceco: #1f6fb2; --cex: #1d9e75; --cintu: #b56600; --cgris: #54707f;
  --bg: #ffffff; --fg: #142a38; --border: #dbe6ee; --card-bg: #f6f9fb; --code-bg: #f3f7fa;
  --danger: #b00020; --primary-dark: #17578f;
}
:root[data-theme="dark"] {
  --cdef: #3aa0e6; --ceco: #3aa0e6; --cex: #37b47e; --cintu: #e0954a; --cgris: #9db4c0;
  --bg: #0d1b26; --fg: #e7eef3; --border: #20455a; --card-bg: #13303d; --code-bg: #0f2733;
  --danger: #e0554a; --primary-dark: #5bb3ef;
}
* { box-sizing: border-box; }
html { background: var(--bg) !important; }
body {
  background: var(--bg) !important; color: var(--fg) !important;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
}
h1, h2, h3, .panneau h2 {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  color: var(--cdef) !important; border-color: var(--cdef) !important;
}
.sous-titre, .aide, label { color: var(--cgris) !important; }
.panneau {
  background: var(--card-bg) !important; border: 1px solid var(--border) !important;
  border-left: 1px solid var(--border) !important; border-radius: 14px !important; box-shadow: none !important;
}
input[type=number], input[type=text], select, textarea {
  background: var(--bg) !important; color: var(--fg) !important; border: 1px solid var(--border) !important;
}
button {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  background: var(--cdef) !important; color: #ffffff !important; border-radius: 8px !important; border: none !important;
}

table.res, table.res th, table.res td { border-color: var(--border) !important; }
table.res th { background: var(--card-bg) !important; }
.valeur { background: var(--cdef) !important; color: #ffffff !important; }
.valeur.ok { background: var(--cex) !important; }
.valeur.ko { background: var(--danger) !important; }
</style>
</head>
<body>

<h1>Chapitre 9 — Loi et fonction de répartition</h1>
<p class="sous-titre">Calculatrice interactive — Probabilités</p>

<div class="panneau">
  <h2>Construire F(x) à partir d'une loi de probabilité</h2>
  <div class="grille3">
    <div><label for="xVals">valeurs x_i</label><input id="xVals" value="1,2,3,4,5"></div>
    <div><label for="pVals">probabilités p_i</label><input id="pVals" value="0.10,0.25,0.30,0.20,0.15"></div>
    <div></div>
  </div>
  <button onclick="calculerF()">Construire F(x) et tracer</button>
  <div id="erreur1" class="erreur"></div>
  <div id="resultat1" class="resultat-zone"></div>
  <canvas id="graphiqueF" height="240"></canvas>
</div>

<div class="panneau var">
  <h2>Lire un quantile (VaR) sur F</h2>
  <div class="grille3">
    <div><label for="alphaVal">ordre alpha</label><input id="alphaVal" value="0.95"></div>
    <div></div><div></div>
  </div>
  <button onclick="calculerQuantile()">Trouver le quantile d'ordre alpha</button>
  <div id="erreur2" class="erreur"></div>
  <div id="resultat2" class="resultat-zone"></div>
</div>

<p class="avertissement">Le quantile calculé ici utilise la même loi saisie dans le premier panneau : modifiez-la puis relancez les deux calculs.</p>

<script>
let chartF = null;
let xsGlobal = [], FsGlobal = [];

function calculerF() {
  const erreurDiv = document.getElementById('erreur1');
  const resDiv = document.getElementById('resultat1');
  erreurDiv.textContent = ''; resDiv.innerHTML = '';
  try {
    const xs = document.getElementById('xVals').value.split(',').map(s=>parseFloat(s.trim()));
    const ps = document.getElementById('pVals').value.split(',').map(s=>parseFloat(s.trim()));
    if (xs.length!==ps.length) throw new Error('Le nombre de valeurs x_i doit être égal au nombre de probabilités.');
    if (xs.some(isNaN) || ps.some(isNaN)) throw new Error('Toutes les valeurs doivent être des nombres.');
    const sommeP = ps.reduce((a,b)=>a+b,0);
    if (Math.abs(sommeP-1)>0.02) throw new Error('La somme des probabilités devrait valoir 1 (actuellement '+sommeP.toFixed(3)+').');

    let cum = 0;
    const Fs = ps.map(p => { cum += p; return cum; });
    xsGlobal = xs; FsGlobal = Fs;

    let lignes = '';
    for (let i=0;i<xs.length;i++) lignes += `<tr><td>${xs[i]}</td><td>${ps[i]}</td><td>${Fs[i].toFixed(4)}</td></tr>`;

    resDiv.innerHTML = `<table><tr><th>x_i</th><th>p_i</th><th>F(x_i)</th></tr>${lignes}</table>`;

    // graphique en escalier
    const labelsEsc = [], valeursEsc = [];
    let precedent = 0;
    for (let i=0;i<xs.length;i++) {
      labelsEsc.push(xs[i]-0.001); valeursEsc.push(precedent);
      labelsEsc.push(xs[i]); valeursEsc.push(Fs[i]);
      precedent = Fs[i];
    }
    if (chartF) chartF.destroy();
    chartF = new Chart(document.getElementById('graphiqueF').getContext('2d'), {
      type: 'line',
      data: { labels: labelsEsc, datasets: [{ label: 'F(x)', data: valeursEsc, borderColor:'#1F6FB2', backgroundColor:'transparent', borderWidth:2, pointRadius:0, stepped:'before' }] },
      options: { responsive: true, scales: { x: { type:'linear', title: { display:true, text:'x' } }, y: { title: { display:true, text:'F(x)' }, min:0, max:1.05 } },
        plugins: { title: { display:true, text:'Fonction de répartition, en escalier' } } }
    });
  } catch (e) {
    erreurDiv.textContent = 'Erreur : ' + e.message;
  }
}

function calculerQuantile() {
  const erreurDiv = document.getElementById('erreur2');
  const resDiv = document.getElementById('resultat2');
  erreurDiv.textContent = ''; resDiv.innerHTML = '';
  try {
    const alpha = parseFloat(document.getElementById('alphaVal').value);
    if (isNaN(alpha) || alpha<=0 || alpha>1) throw new Error('alpha doit être strictement compris entre 0 et 1.');
    if (xsGlobal.length===0) throw new Error('Construisez d\'abord F(x) dans le panneau ci-dessus.');

    let q = null, Fq = null;
    for (let i=0;i<xsGlobal.length;i++) {
      if (FsGlobal[i] >= alpha - 1e-9) { q = xsGlobal[i]; Fq = FsGlobal[i]; break; }
    }
    if (q===null) throw new Error('Aucune valeur ne satisfait F(x) ≥ alpha : vérifiez que la loi somme bien à 1.');

    resDiv.innerHTML = `
      <table><tr><th>alpha</th><th>quantile q_alpha</th><th>F(q_alpha)</th></tr>
      <tr><td>${alpha}</td><td><strong>${q}</strong></td><td>${Fq.toFixed(4)}</td></tr></table>
      <p style="font-size:0.85em;color:var(--cgris);">q_alpha est la plus petite valeur telle que F(x) ≥ alpha : c'est la lecture "à l'envers" de la fonction de répartition, celle qui sert à calculer une Value at Risk.</p>
    `;
  } catch (e) {
    erreurDiv.textContent = 'Erreur : ' + e.message;
  }
}

window.onload = () => { calculerF(); calculerQuantile(); };
</script>
</body>
</html>
