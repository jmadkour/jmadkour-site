<!DOCTYPE html>
<html lang="fr">
<head>
<script id="jm-theme-detect">
(function () {
  var t = null;
  try { t = localStorage.getItem("jm-theme"); } catch (e) {}
  if (!t) { t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light"; }
  document.documentElement.setAttribute("data-theme", t);
  window.addEventListener("storage", function (e) {
    if (e.key === "jm-theme" && e.newValue) { document.documentElement.setAttribute("data-theme", e.newValue); }
  });
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapitre 6 — Conditionnement et indépendance — Calculatrice interactive</title>
<style>
  :root { --cdef: #1F6FB2; --cintu: #B56600; --cex: #1D9E75; --ceco: #1F6FB2; --cgris: #5A5A5A; }
  * { box-sizing: border-box; }
  body { font-family: Georgia, "TeX Gyre Pagella", serif; background: #FDFDFD; color: #1a1a1a; max-width: 950px; margin: 0 auto; padding: 1.5em; }
  h1 { font-family: "Helvetica Neue", Arial, sans-serif; color: var(--cdef); font-size: 1.5em; border-bottom: 2px solid var(--cdef); padding-bottom: 0.3em; }
  .sous-titre { color: var(--cgris); font-family: "Helvetica Neue", Arial, sans-serif; margin-top: -0.6em; }
  .panneau { background: white; border-left: 4px solid var(--cdef); border-radius: 6px; padding: 1em 1.2em; margin: 1em 0; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .panneau h2 { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 1.05em; color: var(--cdef); margin-top: 0; }
  .panneau.totale { border-left-color: var(--cex); }
  .panneau.totale h2 { color: var(--cex); }
  label { display: block; margin: 0.6em 0 0.2em; font-size: 0.92em; color: var(--cgris); }
  input { width: 100%; padding: 0.5em; border: 1px solid #ccc; border-radius: 4px; font-family: "Courier New", monospace; font-size: 0.95em; }
  .grille3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 1.2em; }
  button { margin-top: 1em; background: var(--cdef); color: white; border: none; padding: 0.6em 1.4em; border-radius: 5px; font-family: "Helvetica Neue", Arial, sans-serif; font-weight: bold; cursor: pointer; font-size: 0.95em; }
  button:hover { background: #17578f; }
  .panneau.totale button { background: var(--cex); }
  .panneau.totale button:hover { background: #226b43; }
  .erreur { color: #b00020; font-family: "Helvetica Neue", Arial, sans-serif; font-size: 0.9em; margin-top: 0.6em; }
  .resultat-zone { margin-top: 1em; font-family: "Helvetica Neue", Arial, sans-serif; }
  table { border-collapse: collapse; font-family: "Courier New", monospace; font-size: 0.9em; margin-top: 0.6em; }
  td, th { border: 1px solid #ccc; padding: 0.3em 0.6em; }
  .avertissement { font-size: 0.82em; color: var(--cgris); font-style: italic; margin-top: 1em; }
  .ligne-fournisseur { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5em; margin-bottom: 0.4em; }
</style>
<style id="jm-theme-override">
/* Surcharge : palette et typographie du site jmadkour.org, synchronisee
   avec son bascule clair/sombre (voir script jm-theme-detect ci-dessus).
   Remplace la palette "polycopie" (violet, serif) utilisee par defaut
   dans le bloc <style> d'origine de cette page. */
:root {
  --cdef: #1f6fb2; --ceco: #1f6fb2; --cex: #1d9e75; --cintu: #b56600; --cgris: #54707f;
  --bg: #ffffff; --fg: #142a38; --border: #dbe6ee; --card-bg: #f6f9fb; --code-bg: #f3f7fa;
  --danger: #b00020; --primary-dark: #17578f;
}
:root[data-theme="dark"] {
  --cdef: #3aa0e6; --ceco: #3aa0e6; --cex: #37b47e; --cintu: #e0954a; --cgris: #9db4c0;
  --bg: #0d1b26; --fg: #e7eef3; --border: #20455a; --card-bg: #13303d; --code-bg: #0f2733;
  --danger: #e0554a; --primary-dark: #5bb3ef;
}
* { box-sizing: border-box; }
html { background: var(--bg) !important; }
body {
  background: var(--bg) !important; color: var(--fg) !important;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
}
h1, h2, h3, .panneau h2 {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  color: var(--cdef) !important; border-color: var(--cdef) !important;
}
.sous-titre, .aide, label { color: var(--cgris) !important; }
.panneau {
  background: var(--card-bg) !important; border: 1px solid var(--border) !important;
  border-left: 1px solid var(--border) !important; border-radius: 14px !important; box-shadow: none !important;
}
input[type=number], input[type=text], select, textarea {
  background: var(--bg) !important; color: var(--fg) !important; border: 1px solid var(--border) !important;
}
button {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  background: var(--cdef) !important; color: #ffffff !important; border-radius: 8px !important; border: none !important;
}
button:hover { background: var(--primary-dark) !important; }
.erreur { color: var(--danger) !important; }
table.res, table.res th, table.res td { border-color: var(--border) !important; }
table.res th { background: var(--card-bg) !important; }
.valeur { background: var(--cdef) !important; color: #ffffff !important; }
.valeur.ok { background: var(--cex) !important; }
.valeur.ko { background: var(--danger) !important; }
</style>
</head>
<body>

<h1>Chapitre 6 — Conditionnement et indépendance</h1>
<p class="sous-titre">Calculatrice interactive — Probabilités</p>

<div class="panneau">
  <h2>Conditionnement et indépendance à partir de P(A), P(B), P(A∩B)</h2>
  <div class="grille3">
    <div><label for="PA">P(A)</label><input id="PA" value="0.62"></div>
    <div><label for="PB">P(B)</label><input id="PB" value="0.28"></div>
    <div><label for="PAB">P(A∩B)</label><input id="PAB" value="0.18"></div>
  </div>
  <button onclick="calculerConditionnement()">Calculer P(A|B), P(B|A) et tester l'indépendance</button>
  <div id="erreur1" class="erreur"></div>
  <div id="resultat1" class="resultat-zone"></div>
</div>

<div class="panneau totale">
  <h2>Formule des probabilités totales : n fournisseurs</h2>
  <p style="font-family:'Helvetica Neue',Arial,sans-serif;font-size:0.85em;color:var(--cgris);">
    Saisir les parts de marché et les taux de défaut de chaque fournisseur, séparés par des virgules.
  </p>
  <div class="grille3">
    <div><label for="parts">parts de marché</label><input id="parts" value="0.45,0.35,0.20"></div>
    <div><label for="tauxDefaut">taux de défaut</label><input id="tauxDefaut" value="0.03,0.06,0.10"></div>
    <div></div>
  </div>
  <button onclick="calculerProbaTotale()">Calculer P(défaut) et la part de chaque fournisseur</button>
  <div id="erreur2" class="erreur"></div>
  <div id="resultat2" class="resultat-zone"></div>
</div>

<script>
function calculerConditionnement() {
  const erreurDiv = document.getElementById('erreur1');
  const resDiv = document.getElementById('resultat1');
  erreurDiv.textContent = ''; resDiv.innerHTML = '';
  try {
    const PA = parseFloat(document.getElementById('PA').value);
    const PB = parseFloat(document.getElementById('PB').value);
    const PAB = parseFloat(document.getElementById('PAB').value);
    if ([PA,PB,PAB].some(v=>isNaN(v)||v<0||v>1)) throw new Error('Toutes les probabilités doivent être comprises entre 0 et 1.');
    if (PAB > Math.min(PA,PB) + 1e-9) throw new Error('P(A∩B) ne peut pas dépasser min(P(A),P(B)).');

    const PA_B = PAB/PB;
    const PB_A = PAB/PA;
    const produit = PA*PB;
    const ecart = PAB - produit;
    const independants = Math.abs(ecart) < 1e-9;

    resDiv.innerHTML = `
      <table><tr><th>P(A|B)</th><th>P(B|A)</th><th>P(A)×P(B)</th><th>P(A∩B)</th><th>indépendants ?</th></tr>
      <tr><td>${PA_B.toFixed(4)}</td><td>${PB_A.toFixed(4)}</td><td>${produit.toFixed(4)}</td><td>${PAB.toFixed(4)}</td>
      <td style="font-weight:bold;color:${independants?'#1D9E75':'#b00020'};">${independants?'oui':(ecart>0?'non (positivement liés)':'non (négativement liés)')}</td></tr></table>
    `;
  } catch (e) {
    erreurDiv.textContent = 'Erreur : ' + e.message;
  }
}

function calculerProbaTotale() {
  const erreurDiv = document.getElementById('erreur2');
  const resDiv = document.getElementById('resultat2');
  erreurDiv.textContent = ''; resDiv.innerHTML = '';
  try {
    const parts = document.getElementById('parts').value.split(',').map(s=>parseFloat(s.trim()));
    const taux = document.getElementById('tauxDefaut').value.split(',').map(s=>parseFloat(s.trim()));
    if (parts.length!==taux.length) throw new Error('Le nombre de parts doit être égal au nombre de taux de défaut.');
    if (parts.some(isNaN) || taux.some(isNaN)) throw new Error('Toutes les valeurs doivent être des nombres.');
    const sommeParts = parts.reduce((a,b)=>a+b,0);
    if (Math.abs(sommeParts-1)>0.02) throw new Error('La somme des parts de marché devrait valoir 1 (actuellement '+sommeParts.toFixed(3)+').');

    const contributions = parts.map((p,i)=>p*taux[i]);
    const Ptotal = contributions.reduce((a,b)=>a+b,0);
    const parts_defauts = contributions.map(c=>c/Ptotal);

    let lignes = '';
    for (let i=0;i<parts.length;i++) {
      lignes += `<tr><td>F${i+1}</td><td>${(parts[i]*100).toFixed(1)}%</td><td>${(taux[i]*100).toFixed(1)}%</td><td>${(contributions[i]).toFixed(5)}</td><td>${(parts_defauts[i]*100).toFixed(1)}%</td></tr>`;
    }

    resDiv.innerHTML = `
      <table><tr><th>fournisseur</th><th>part de marché</th><th>taux de défaut</th><th>contribution P(Fi)×P(défaut|Fi)</th><th>part dans les défauts totaux</th></tr>
      ${lignes}
      <tr><td colspan="3"><strong>Total P(défaut)</strong></td><td colspan="2"><strong>${(Ptotal*100).toFixed(2)}%</strong></td></tr></table>
      <p style="font-size:0.85em;color:var(--cgris);">Le fournisseur avec la plus grande « part dans les défauts totaux » n'est pas forcément celui qui a le taux de défaut individuel le plus élevé : le volume compte autant que le taux.</p>
    `;
  } catch (e) {
    erreurDiv.textContent = 'Erreur : ' + e.message;
  }
}

window.onload = () => { calculerConditionnement(); calculerProbaTotale(); };
</script>
</body>
</html>
