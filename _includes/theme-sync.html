<!-- Mémorise le thème réellement appliqué par Quarto (clair ou sombre) afin
     que les diaporamas, qui sont des documents séparés, puissent s'y accorder.
     On lit la classe posée sur <body> plutôt que la clé interne de Quarto :
     celle-ci vaut « alternate », dont le sens dépend de l'ordre de déclaration
     des thèmes et pourrait s'inverser à la moindre retouche de _quarto.yml. -->
<script>
(function () {
  function courant() {
    var b = document.body;
    if (!b) return null;
    if (b.classList.contains("quarto-dark")) return "dark";
    if (b.classList.contains("quarto-light")) return "light";
    return null;
  }
  function memoriser() {
    var t = courant();
    if (!t) return;
    try { localStorage.setItem("jm-theme", t); } catch (e) {}
  }
  memoriser();
  // Le bouton de bascule change la classe de <body> : on suit le changement.
  if (window.MutationObserver && document.body) {
    new MutationObserver(memoriser).observe(document.body, {
      attributes: true, attributeFilter: ["class"]
    });
  }
})();
</script>
