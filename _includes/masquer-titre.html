<!-- Masque le bloc-titre à l'affichage sur les pages d'accueil de cours et les
     pages de niveau. Le titre reste déclaré dans l'entête du fichier : il
     alimente l'onglet du navigateur et la recherche du site. Depuis le
     28/10/2026 le bloc n'est plus retiré de la page (display: none), mais
     seulement sorti de l'écran : le titre h1 reste donc dans la page pour les
     lecteurs d'écran, qui n'avaient plus aucun titre à annoncer. Le bloc des
     métadonnées (auteur, affiliation, date), lui, reste caché.
     Les deux sélecteurs couvrent les variantes de balisage de Quarto. -->
<style>
  header#title-block-header,
  .quarto-title-block {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%);
    white-space: nowrap; border: 0;
  }
  header#title-block-header .quarto-title-meta,
  header#title-block-header .quarto-title-meta-author,
  .quarto-title-block .quarto-title-meta,
  .quarto-title-block .quarto-title-meta-author { display: none; }
  /* Sans le bloc-titre, le contenu remonte trop haut sous la barre de menu. */
  main.content > *:first-child { margin-top: 0.6rem; }
</style>
