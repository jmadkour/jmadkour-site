<!-- Lecteur de chapitres à 3 volets : styles partagés par toutes les pages de cours restructurées (volets gauche/droit sur mesure, encadrés pédagogiques repliables) et rendu KaTeX des fragments de chapitre. Voir claude/plan-refonte-pages-cours.md dans le projet Claude pour le contexte. -->
<style>
/* =====================================================================
   Lecteur de chapitres à 3 volets — pages de cours restructurées
   Palette identique aux diapositives et à la palette pédagogique de
   l'atelier (preamble.tex / preamble-article.tex / custom.scss) :
     cdef  #4A3B8C  définition
     cintu #E08000  intuition
     cex   #2E8B57  exemple
     ceco  #1F6FB2  application économique (= $primary du site)
   Couleurs de thème (fond, bordures, cartes) reprises de
   theme-light.scss / theme-dark.scss, sélectionnées via les classes
   body.quarto-light / body.quarto-dark déjà posées par Quarto.
   ===================================================================== */

/* Quarto ajoute automatiquement les classes .page-columns.page-full à tout
   bloc de premier niveau dans .content (grid.content-mode: standard, actif
   sur tout le site) — leur grille (colonnes nommées pour marge/TOC) prend
   sinon le pas sur la nôtre, à spécificité CSS égale et chargée après.
   D'où les !important ci-dessous, uniquement sur les deux propriétés en
   conflit direct.
   Largeurs : avec page-layout: full (et un DOM valide — voir la note sur
   les <summary> dans pedago-blocks.lua), .content atteint ~1135px sur ce
   site, indépendamment de la largeur de la fenêtre (grille à colonnes
   nommées, non proportionnelle au viewport). Volets latéraux à 240px,
   assez larges pour les intitulés de chapitre et de ressource sur une ou
   deux lignes, le volet central se partageant le reste (~590px, proche
   de la largeur de lecture par défaut de Quarto). */
.jm-lecteur {
  display: grid !important;
  grid-template-columns: 240px minmax(0, 1fr) 240px !important;
  gap: 1.75rem;
  align-items: start;
  margin-top: .6rem;
  max-width: none !important;
}
/* Bootstrap (.page-columns>*{grid-column:body-content-start/body-content-end})
   place autrement tous les enfants directs dans la même colonne nommée —
   même spécificité (classe + combinateur enfant), donc on rétablit le
   placement automatique (1er, 2e, 3e enfant -> colonnes 1, 2, 3). */
.jm-lecteur > * { grid-column: auto !important; }

@media (max-width: 991px) {
  .jm-lecteur { grid-template-columns: 1fr !important; }
  .jm-lecteur-gauche, .jm-lecteur-droite { position: static !important; }
}

/* ---------- Volet gauche : sommaire du cours ---------- */
.jm-lecteur-gauche {
  position: sticky;
  top: 5.5rem;
  font-size: .92rem;
}
.jm-lecteur-titre-cours {
  font-weight: 700;
  font-size: 1.05rem;
  padding-bottom: .45rem;
  margin-bottom: .6rem;
  border-bottom: 1px solid #dbe6ee;
}
.jm-lecteur-gauche ul { list-style: none; padding: 0; margin: 0; }
.jm-lecteur-gauche li { margin: 0; }
.jm-lecteur-gauche a {
  display: block;
  padding: .4rem .55rem;
  border-radius: 7px;
  margin-bottom: .1rem;
  color: inherit;
  border-left: 3px solid transparent;
  line-height: 1.35;
}
.jm-lecteur-gauche a:hover { background: rgba(31,111,178,0.08); text-decoration: none; }
.jm-lecteur-gauche a.jm-actif {
  background: rgba(31,111,178,0.12);
  border-left-color: #1f6fb2;
  color: #1f6fb2;
  font-weight: 700;
}
.jm-lecteur-gauche a.jm-accueil { font-style: italic; }

/* ---------- Volet centre : contenu du chapitre ---------- */
.jm-lecteur-centre { min-width: 0; }
.jm-lecteur-centre .quarto-title-block .title { font-size: 1.7rem; }
.jm-lecteur-centre .quarto-title-block .subtitle { color: #54707f; }

/* ---------- Volet droit : ressources du chapitre ---------- */
.jm-lecteur-droite {
  position: sticky;
  top: 5.5rem;
  font-size: .88rem;
  background: #f6f9fb;
  border: 1px solid #dbe6ee;
  border-radius: 12px;
  padding: 1rem 1.1rem;
}
.jm-lecteur-droite h3 {
  font-size: .8rem;
  text-transform: uppercase;
  letter-spacing: .04em;
  color: #54707f;
  margin: 0 0 .7rem;
}
.jm-lecteur-droite ul { list-style: none; padding: 0; margin: 0 0 0; }
.jm-lecteur-droite li { margin-bottom: .55rem; }
.jm-lecteur-droite a.jm-ressource {
  display: flex;
  align-items: center;
  gap: .5rem;
  color: #1f6fb2;
  font-weight: 600;
}
.jm-lecteur-droite a.jm-ressource:hover { text-decoration: underline; }
.jm-lecteur-droite .jm-indisponible {
  display: flex; align-items: center; gap: .5rem;
  color: #9aa9b2; font-weight: 500; cursor: default;
}
.jm-lecteur-droite .jm-reserve {
  display: flex; align-items: center; gap: .5rem;
  color: #9aa9b2; font-style: italic;
}
.jm-lecteur-droite .jm-icone { opacity: .8; }

/* ---------- Navigation précédent / suivant ---------- */
.jm-lecteur-nav {
  display: flex; justify-content: space-between; gap: 1rem;
  margin: 2.2rem 0 .5rem; padding-top: 1rem;
  border-top: 1px solid #dbe6ee;
  font-size: .92rem;
}
.jm-lecteur-nav a { color: #1f6fb2; font-weight: 600; }
.jm-lecteur-nav .jm-nav-suivant { margin-left: auto; text-align: right; }
.jm-lecteur-nav .jm-nav-label {
  display: block; font-size: .76rem; font-weight: 400; color: #54707f;
}

/* ---------- Encadrés pédagogiques dans le volet centre ---------- */
/* Reprend le mécanisme de custom.scss (atelier), adapté en <details> */
.jm-lecteur-centre details.definitionbox,
.jm-lecteur-centre details.intuitionbox,
.jm-lecteur-centre details.examplebox,
.jm-lecteur-centre details.ecobox {
  border-radius: 8px;
  overflow: hidden;
  margin: 0.9em 0;
  box-shadow: 0 1px 4px rgba(0,0,0,0.10);
}
.jm-lecteur-centre summary.pedago-title {
  font-weight: 700;
  color: #fff;
  padding: .45em .9em;
  cursor: pointer;
  list-style: none;
}
.jm-lecteur-centre summary.pedago-title::-webkit-details-marker { display: none; }
.jm-lecteur-centre summary.pedago-title::before {
  content: "▸";
  display: inline-block;
  margin-right: .5em;
  transition: transform .15s ease;
}
.jm-lecteur-centre details[open] summary.pedago-title::before { transform: rotate(90deg); }
.jm-lecteur-centre .pedago-body { padding: .7em 1em .9em; }
.jm-lecteur-centre .pedago-body > *:first-child { margin-top: 0; }
.jm-lecteur-centre .pedago-body > *:last-child { margin-bottom: 0; }

.jm-lecteur-centre details.definitionbox { background: rgba(74,59,140,0.07); }
.jm-lecteur-centre details.definitionbox summary.pedago-title { background: #4A3B8C; }
.jm-lecteur-centre details.intuitionbox  { background: rgba(224,128,0,0.09); }
.jm-lecteur-centre details.intuitionbox summary.pedago-title { background: #E08000; }
.jm-lecteur-centre details.examplebox    { background: rgba(46,139,87,0.07); }
.jm-lecteur-centre details.examplebox summary.pedago-title { background: #2E8B57; }
.jm-lecteur-centre details.ecobox        { background: rgba(31,111,178,0.07); }
.jm-lecteur-centre details.ecobox summary.pedago-title { background: #1F6FB2; }

/* Colonnes (definitionbox à côté d'une figure, etc.) : héritées du rendu
   Quarto (div.columns{display:flex} / inline style width sur div.column). */
.jm-lecteur-centre div.columns { display: flex; gap: min(4vw, 1.5em); flex-wrap: wrap; }
.jm-lecteur-centre div.column { flex: auto; overflow-x: auto; }

/* =====================================================================
   Mode sombre — posé par Quarto sur <body class="quarto-dark">
   ===================================================================== */
body.quarto-dark .jm-lecteur-titre-cours { border-bottom-color: #20455a; }
body.quarto-dark .jm-lecteur-gauche a:hover { background: rgba(58,160,230,0.12); }
body.quarto-dark .jm-lecteur-gauche a.jm-actif {
  background: rgba(58,160,230,0.16);
  border-left-color: #3aa0e6;
  color: #3aa0e6;
}
body.quarto-dark .jm-lecteur-centre .quarto-title-block .subtitle { color: #9db4c0; }
body.quarto-dark .jm-lecteur-droite {
  background: #13303d;
  border-color: #20455a;
}
body.quarto-dark .jm-lecteur-droite h3 { color: #9db4c0; }
body.quarto-dark .jm-lecteur-droite a.jm-ressource { color: #5bb3ef; }
body.quarto-dark .jm-lecteur-droite .jm-indisponible,
body.quarto-dark .jm-lecteur-droite .jm-reserve { color: #6c8494; }
body.quarto-dark .jm-lecteur-nav { border-top-color: #20455a; }
body.quarto-dark .jm-lecteur-nav a { color: #5bb3ef; }
body.quarto-dark .jm-lecteur-nav .jm-nav-label { color: #9db4c0; }

body.quarto-dark .jm-lecteur-centre details.definitionbox { background: rgba(122,104,206,0.16); }
body.quarto-dark .jm-lecteur-centre details.definitionbox summary.pedago-title { background: #6252a8; }
body.quarto-dark .jm-lecteur-centre details.intuitionbox  { background: rgba(224,148,74,0.16); }
body.quarto-dark .jm-lecteur-centre details.intuitionbox summary.pedago-title { background: #c47a2e; }
body.quarto-dark .jm-lecteur-centre details.examplebox    { background: rgba(55,180,126,0.14); }
body.quarto-dark .jm-lecteur-centre details.examplebox summary.pedago-title { background: #37b47e; }
body.quarto-dark .jm-lecteur-centre details.ecobox        { background: rgba(58,160,230,0.14); }
body.quarto-dark .jm-lecteur-centre details.ecobox summary.pedago-title { background: #3aa0e6; }
</style>
<!-- Rendu KaTeX pour le volet central : les fragments de chapitre sont
     extraits (BeautifulSoup) du rendu Quarto de l'atelier et insérés tels
     quels en HTML brut dans la page du site. Le contenu mathématique y est
     déjà mis en forme (spans <span class="math inline|display">…</span>,
     source LaTeX brute), mais Quarto ne le détecte pas à la compilation de
     CETTE page (le bloc {=html} n'est pas réanalysé comme du Markdown), et
     n'injecte donc pas lui-même les ressources KaTeX ici. On reprend donc
     ici, à l'identique, le mécanisme que Quarto insère lui-même sur les
     pages où il détecte des maths (cf. html-math-method: katex du site) :
     chargement de KaTeX depuis le même CDN, puis un scan DOMContentLoaded
     de tous les éléments .math qui les rend en place. -->
<script>window.backupDefine = window.define; window.define = undefined;</script><script src="https://cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.js"></script>
<script>document.addEventListener("DOMContentLoaded", function () {
 var mathElements = document.getElementsByClassName("math");
 var macros = [];
 for (var i = 0; i < mathElements.length; i++) {
  var texText = mathElements[i].firstChild;
  if (mathElements[i].tagName == "SPAN") {
   katex.render(texText.data, mathElements[i], {
    displayMode: mathElements[i].classList.contains('display'),
    throwOnError: false,
    macros: macros,
    fleqn: false
   });
}}});
</script>
<script>window.define = window.backupDefine; window.backupDefine = undefined;</script><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.css">
