name: Publier le site
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Un seul déploiement à la fois. Deux poussées rapprochées produisaient
# deux rendus concurrents qui se disputaient la branche gh-pages ; le plus
# lent écrasait le plus récent, ou échouait. Les rendus en attente sont
# désormais annulés au profit du dernier commit, qui contient de toute
# façon les précédents.
concurrency:
  group: publication
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Rendre le site
        uses: quarto-dev/quarto-actions/render@v2

      - name: Protéger le parcours Doctorat par mot de passe
        env:
          STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}
        run: bash scripts/protect-doctorat.sh _site

      - name: Publier sur GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: "false"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
